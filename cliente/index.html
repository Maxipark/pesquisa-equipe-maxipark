<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Pesquisa com clientes Maxipark</title>
<meta name="theme-color" content="#6B4A98">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Clientes Maxipark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="../icon-192.png">
<link rel="icon" href="../icon-192.png">
<style>
  :root{
    --roxo:#6B4A98; --roxo-escuro:#4E3572; --roxo-claro:#EEE8F5; --acento:#9935F4; --bg:#F5F3F9; --card:#FFFFFF;
    --texto:#221C2E; --cinza:#5E5670; --linha:#DED8EA; --sel:#FFD54F; --sel-texto:#3A2E00; --perigo:#B23A3A; --ok:#2E7D32; --raio:18px;
    color-scheme: light;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%;background:var(--bg);color:var(--texto);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:18px;line-height:1.35}
  button{font-family:inherit;color:var(--texto)}
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 18px;background:#fff;border-bottom:3px solid var(--roxo)}
  .top .marca{display:flex;align-items:center;gap:12px;font-weight:700;color:var(--roxo-escuro);font-size:17px}
  .top .marca img{height:40px;width:auto}
  .top .passo{font-size:15px;color:var(--roxo-escuro);font-weight:600;text-align:right}
  .barra{height:6px;background:var(--linha)} .barra > div{height:100%;background:linear-gradient(90deg,var(--roxo),var(--acento));transition:width .25s}
  .wrap{max-width:900px;margin:0 auto;padding:16px 18px 80px}
  .card{background:var(--card);border-radius:var(--raio);padding:20px 22px;box-shadow:0 2px 10px rgba(34,28,46,.06)}
  h1{font-size:28px;line-height:1.2;margin:0 0 10px;color:var(--roxo-escuro)}
  h2{font-size:23px;line-height:1.25;margin:0 0 12px}
  h3{font-size:19px;margin:18px 0 8px;color:var(--roxo-escuro)}
  p{margin:0 0 12px}
  .small{font-size:14px} .muted{color:var(--cinza)} .legenda{font-size:13px;color:var(--cinza);margin:6px 0 0}
  .pergunta{font-size:27px;font-weight:600;line-height:1.3;margin:4px 0 18px}
  .opcoes{display:grid;gap:12px}
  .opt{display:flex;align-items:center;gap:14px;width:100%;min-height:64px;padding:12px 18px;border:2px solid var(--linha);border-radius:14px;background:#fff;font-size:20px;text-align:left;cursor:pointer}
  .opt.sel{background:var(--sel);border-color:#E0B400;color:var(--sel-texto);font-weight:700}
  .opt .num{min-width:36px;height:36px;border-radius:50%;background:var(--roxo-claro);color:var(--roxo-escuro);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:18px}
  .escala{display:grid;grid-template-columns:repeat(var(--n,5),1fr);gap:10px;margin:8px 0 6px}
  .escala .opt .rot{font-size:14px;color:var(--cinza);line-height:1.2;text-align:center} .escala .opt.sel .rot{color:var(--sel-texto)}
  .escala.n3 .opt{min-height:112px} .escala.n3 .opt .rot{font-size:18px;font-weight:600}
  .pergunta-cfg{border:1px solid var(--linha);border-radius:12px;padding:10px 14px 14px;margin:10px 0;background:#FAFBFB}
  .pergunta-cfg label{font-size:14px;margin:8px 0 4px} .pergunta-cfg input,.pergunta-cfg textarea,.pergunta-cfg select{font-size:16px;padding:8px 10px} .pergunta-cfg textarea{min-height:0}
  .escala .opt{flex-direction:column;justify-content:center;text-align:center;gap:6px;padding:12px 6px;min-height:92px}
  .escala .opt .n{font-size:30px;font-weight:700;color:var(--roxo-escuro)} .escala .opt.sel .n{color:var(--sel-texto)}
  .escala .opt .face{font-size:30px;line-height:1}
  .opt.chip{width:auto;display:inline-flex;min-height:48px;font-size:16px;padding:8px 16px;border-color:transparent;background:var(--roxo-claro);color:var(--roxo-escuro)}
  .opt.destaque{min-height:76px;font-weight:700;border-color:var(--roxo)}
  .nps{display:grid;grid-template-columns:repeat(11,1fr);gap:8px;margin:8px 0 6px}
  .nps .opt{justify-content:center;min-height:64px;padding:8px 4px;font-size:22px;font-weight:700}
  .pontas{display:flex;justify-content:space-between;font-size:14px;color:var(--cinza);margin:2px 2px 10px}
  .na{margin-top:12px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:58px;padding:12px 22px;border:0;border-radius:14px;background:var(--roxo);color:#fff;font-size:20px;font-weight:700;cursor:pointer}
  .btn:disabled{opacity:.4;cursor:default}
  .btn.ghost{background:var(--roxo-claro);color:var(--roxo-escuro)} .btn.light{background:#fff;border:2px solid var(--roxo);color:var(--roxo-escuro)}
  .btn.perigo{background:var(--perigo)} .btn.block{width:100%} .btn.grande{min-height:110px;font-size:30px;border-radius:22px}
  .linha{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px} .espaco{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
  textarea,input,select{width:100%;font:inherit;font-size:19px;padding:12px 14px;border:2px solid var(--linha);border-radius:14px;background:#fff;color:var(--texto)}
  textarea{min-height:120px;resize:vertical}
  label{display:block;font-weight:600;margin:14px 0 6px}
  .check{display:flex;gap:12px;align-items:flex-start;font-weight:500;margin:12px 0 4px;font-size:16px} .check input{width:26px;height:26px;margin-top:2px;flex:none}
  .logo-hero{display:flex;justify-content:center;margin:2px 0 14px} .logo-hero img{height:64px;width:auto;max-width:80%}
  a.home{display:inline-flex;align-items:center;border-radius:8px} a.home:active{opacity:.7}
  .boasvindas{text-align:center;padding:26px 22px}
  .boasvindas h1{font-size:36px;margin:12px 0 10px}
  .boasvindas p{font-size:20px;color:var(--cinza)}
  .rodape-kiosk{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:center;padding:8px 18px;font-size:13px;color:var(--cinza);background:transparent}
  .rodape-kiosk button{background:none;border:0;color:var(--cinza);font-size:13px;text-decoration:underline;cursor:pointer;padding:10px}
  .obrigado{text-align:center;padding:30px 20px}
  .obrigado .ok{width:96px;height:96px;border-radius:50%;background:var(--ok);color:#fff;font-size:56px;display:flex;align-items:center;justify-content:center;margin:0 auto 20px}
  .kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:10px 0}
  .kpi div{background:var(--roxo-claro);border-radius:14px;padding:12px;text-align:center} .kpi b{display:block;font-size:30px;color:var(--roxo-escuro)} .kpi span{font-size:13px;color:var(--cinza)}
  table{width:100%;border-collapse:collapse;font-size:15px;margin:8px 0} th,td{padding:8px 8px;border-bottom:1px solid var(--linha);text-align:center;vertical-align:top} th{background:var(--roxo-claro);color:var(--roxo-escuro)} td.l,th.l{text-align:left}
  .tabela-wrap{overflow-x:auto}
  .tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:700} .tag.ok{background:#E6F4EA;color:#1B5E20} .tag.pend{background:#FFF4D6;color:#7A5A00}
  .aviso{background:#FFF4D6;border-left:5px solid #E0B400;padding:10px 14px;border-radius:8px;font-size:15px;margin:10px 0}
  .ruim{background:#FBE3E3;border-left:5px solid var(--perigo);padding:10px 14px;border-radius:8px;font-size:15px;margin:10px 0}
  .bom{background:#E6F4EA;border:1px solid #9CCFA9;border-radius:12px;padding:12px 14px;margin:10px 0 14px;font-size:16px;color:#1B3D26}
  .filtros{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:8px 0} .filtros label{margin:0 0 4px;font-size:13px;color:var(--cinza)} .filtros select,.filtros input{font-size:16px;padding:8px 10px}
  .pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:320px;margin:12px auto} .pinpad button{min-height:64px;font-size:26px;border-radius:14px;border:2px solid var(--linha);background:#fff}
  .pininput{display:block;max-width:320px;margin:8px auto 6px;text-align:center;font-size:30px;letter-spacing:12px;min-height:60px;-webkit-text-security:disc}
  details{margin:8px 0 14px} details summary{color:var(--roxo-escuro);cursor:pointer;font-weight:600}
  ul.lista{padding-left:20px;font-size:16px} ul.lista li{margin:6px 0}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#221C2E;color:#fff;padding:12px 18px;border-radius:12px;font-size:16px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center;z-index:9}
  .toast.show{opacity:1}
  @media (max-width:640px){ .pergunta{font-size:22px} .escala .opt{min-height:80px;padding:10px 4px} .escala .opt .n{font-size:24px} .escala .opt .rot{font-size:12px} .nps{gap:5px} .nps .opt{min-height:52px;font-size:18px} .boasvindas h1{font-size:28px} .wrap{padding:12px 12px 80px} .card{padding:16px} }
  @media (max-height:600px) and (orientation:landscape){ .pergunta{font-size:21px;margin:2px 0 10px} .opt{min-height:52px;font-size:18px} .escala .opt{min-height:76px} .wrap{padding:8px 16px 70px} }
</style>
</head>

function avancar(){

  if (q.tipo === 'fim' && state.r.contato && state.r.lgpd !== 1) { toast('Para deixar o contato, marque a autorização. Para continuar anônimo, apague o contato.'); return; }   // nunca descarta o contato em silêncio

function gravar(){

async function sendPending(){   // envia o que ainda não foi enviado, em lotes; o servidor ignora id repetido, então reenviar não duplica
  if (sending || !syncOk() || !navigator.onLine) return 0; sending = true; let enviadas = 0;
  try {
    const pend = allResponses().filter(r => !r.sent);
    for (let i = 0; i < pend.length; i += 25) {
      const lote = pend.slice(i, i + 25); const itens = lote.map(payloadDe); let ok = false;
      try { const j = await apiPost({ op: 'add', itens }); ok = !!(j && j.ok); if (j && j.ok === false) { toast(erroServidor(j)); break; } }
      catch(e) { ok = false; }   // sem resposta legível (rede, CORS, login): NÃO marca como enviado — fica pendente e tenta de novo depois; o servidor ignora id repetido
      if (!ok) break;
      const list = allResponses(); lote.forEach(r => { const it = list.find(x => x.id === r.id); if (it) it.sent = true; }); saveResponses(list); enviadas += lote.length;

async function sincronizar(silencioso, tudo){   // sobe o pendente e baixa as respostas do servidor para mpc_hist (marcadas nuvem: true); depois da 1ª vez só o que é novo (desde)
  if (!syncOk()) { if (!silencioso) toast('Configure a URL e a chave do servidor em Configurações.'); return; }
  if (syncing) return; if (!navigator.onLine) { if (!silencioso) toast('Sem internet agora; tento de novo quando voltar.'); return; }
  syncing = true; if (!silencioso) toast('Atualizando da nuvem…');

    await sendPending();
    const incremental = !tudo && !!settings.ultimaSync; const params = { op: 'list', app: APP_ID, contatos: settings.baixarContatos ? '1' : '0' };   // contatos só chegam onde o usuário marcou (nunca nos tablets das unidades)

    const locais = new Set(allResponses().map(r => r.id)); const manuaisIds = new Set(manuais.map(h => h.id)); const porId = new Map(nuvem.map(h => [h.id, h]));

/* ---------------- CSV ---------------- */
const CSV_FIXAS = ['versao', 'ver', 'esc', 'id', 'unidade', 'ponto', 'data', 'hora', 'dur'];
function csvCols(){ return CSV_FIXAS.concat(COLS_RESP); }
function celula(r, c){ if (CSV_FIXAS.includes(c)) return r[c]; return r.r[c]; }
function csvCell(v){ if (v === undefined || v === null) return ''; let s = Array.isArray(v) ? v.join(' | ') : String(v); s = s.replace(/\r?\n|\r/g, ' '); return /[",;\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
function csvText(list){
  const cols = csvCols();
  const rows = list.map(r => cols.map(c => csvCell(celula(r, c))).join(';'));
  return '﻿' + cols.join(';') + '\n' + rows.join('\n') + '\n';
}
function parseDelimited(text){   // RFC-4180: aspas, ; ou , e quebras de linha dentro de aspas
  text = text.replace(/^﻿/, ''); const sep = (text.split('\n')[0].split(';').length >= text.split('\n')[0].split(',').length) ? ';' : ',';
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) { const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += ch; }
    else if (ch === '"') q = true; else if (ch === sep) { row.push(cell); cell = ''; } else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; } else cell += ch; }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }

}
function csvToResponses(text){

  if (idx('id') < 0 || idx('unidade') < 0 || idx('csat') < 0 || idx('nps') < 0) throw new Error('Este arquivo não é um CSV da pesquisa com clientes (precisa das colunas id, unidade, csat e nps). O CSV da pesquisa com a equipe não serve aqui.');
  const out = [];
  rows.slice(1).forEach(c => { const g = n => { const i = idx(n); return i >= 0 ? (c[i] || '').trim() : ''; };
    const r = {}; COLS_RESP.forEach(k => { const v = g(k); if (v === '') return; if (NUMERICAS.has(k) || k === 'lgpd') r[k] = v === 'NA' ? 'NA' : (isNaN(parseInt(v, 10)) ? v : parseInt(v, 10)); else r[k] = v; });
    if (r.lgpd !== 1) r.contato = '';   // contato só com consentimento
    const data = g('data'); const dn = /^\d{4}-\d{2}-\d{2}$/.test(data) ? data : (/^\d{2}\/\d{2}\/\d{4}$/.test(data) ? data.slice(6) + '-' + data.slice(3, 5) + '-' + data.slice(0, 2) : data);
    const dur = parseInt(g('dur'), 10); const escv = parseInt(g('esc'), 10); const ver = g('ver') || 'C1';
    out.push({ id: g('id') || uid(), versao: g('versao') || VERSAO, ver, esc: (escv === 3 || escv === 5) ? escv : (ver === 'C1' ? 5 : undefined), unidade: g('unidade').toUpperCase(), ponto: g('ponto'), data: dn, hora: g('hora'), dur: isNaN(dur) ? null : dur, r, sent: true }); });

    case 'ans': { const q = perguntaAtual(); if (!q) return; const raw = el.dataset.v; state.r[q.codigo] = (q.tipo === 'escala' || q.tipo === 'nps') ? (raw === 'NA' ? 'NA' : parseInt(raw, 10)) : raw; render();
      clearTimeout(autoT); if (settings.autoAvanca !== false) autoT = setTimeout(() => { if (state.screen === 'q' && perguntaAtual() === q) avancar(); }, 380); break; }   // avança sozinho (configurável)
    case 'next': clearTimeout(autoT); avancar(); break;
    case 'back': clearTimeout(autoT); lerCamposLivres(); if (state.i > 0) { state.i--; go('q'); } break;
    case 'cancel': clearTimeout(autoT); registrarAbandono(); state.r = {}; go('welcome'); break;
    case 'retrysave': gravar(); break;
    case 'welcome': go('welcome'); break;
    case 'welcomeorsetup': go(settings.unidade ? 'welcome' : 'setup'); break;
    case 'pinadmin': go('pin', { pinPara: 'admin' }); break;
    case 'pinkey': { if (el.dataset.k === 'del') state.pin = state.pin.slice(0, -1); else if (state.pin.length < 8) state.pin += el.dataset.k; render(); break; }
    case 'pinok': pinTentativa(); break;
    case 'admin': if (state.screen === 'setup') { go('pin', { pinPara: 'admin' }); } else go('admin'); break;
    case 'config': if (state.screen === 'setup') go('pin', { pinPara: 'config' }); else go('config'); break;
    case 'consolidado': if (!state.cf) state.cf = cfDefault(); go('consolidado'); if (syncOk()) sincronizar(true); break;   // ao abrir, já atualiza da nuvem em silêncio
    case 'sync': sincronizar(false); break;
    case 'syncfull': sincronizar(false, true); break;
    case 'testarservidor': testarServidor(); break;
    case 'saveconfig': { const w = (document.getElementById('s-webhook') || { value: '' }).value.trim(); const ch = (document.getElementById('s-chave') || { value: '' }).value.trim(); const np = (document.getElementById('s-pin') || { value: '' }).value.trim();
      if (w && !/^https?:\/\//.test(w)) { toast('A URL precisa começar com https://'); return; } if (np && !/^\d{4,8}$/.test(np)) { toast('O PIN deve ter de 4 a 8 dígitos.'); return; } if (w && !ch) { toast('Digite também a chave de sincronização.'); return; }
      const bc = !!((document.getElementById('s-contatos') || {}).checked);
      if (w !== settings.webhook || bc !== !!settings.baixarContatos) { settings.ultimaSync = ''; LS.set('mpc_hist', histResponses().filter(h => !h.nuvem)); }   // trocou de servidor ou a regra de contatos: baixa tudo de novo na próxima vez
      settings.webhook = w; settings.chave = ch; settings.baixarContatos = bc; if (np) settings.pin = np; settings.autoAvanca = !!((document.getElementById('s-auto') || { checked: true }).checked); saveSettings(); toast('Configurações salvas.'); go('admin'); break; }
    case 'unidpadrao': localStorage.removeItem('mpc_unidades'); toast('Lista padrão restaurada.'); render(); break;
    case 'perguntas': go('perguntas'); break;
    case 'savepergs': lerPerguntas(); break;
    case 'resetpergs': localStorage.removeItem('mpc_perguntas'); aplicarPerguntas(); toast('Perguntas, respostas e pesos voltaram ao padrão (3 respostas).'); render(); break;
    case 'exportpergs': shareOrDownload('perguntas_clientes_maxipark.json', JSON.stringify(Object.assign({ app: 'pesquisa-clientes-maxipark', ver: PESQ_VER }, { esc: ESC }, perguntasCfg()), null, 1), 'application/json').then(ok => { if (ok) toast('Arquivo gerado.'); }); break;
    case 'csv': shareOrDownload(dadosExport('atual').nome + '.csv', csvText(currentResponses())).then(ok => { if (ok) { markExported(); toast('CSV gerado.'); render(); } }); break;
    case 'csvtudo': { const D = dadosExport('tudo'); shareOrDownload(D.nome + '.csv', csvText(filtrar(poolTodas(), state.cf || cfDefault()))).then(ok => { if (ok) toast('CSV gerado.'); }); break; }
    case 'xlsx': exportarExcel(el.dataset.modo || 'atual'); break;
    case 'pdf': exportarPdf(el.dataset.modo || 'atual'); break;
    case 'resend': toast('Enviando…'); sendPending().then(n => { toast(n ? `${n} resposta(s) enviada(s) para a nuvem.` : 'Nada enviado: sem internet ou servidor não respondeu.'); render(); }); break;
    case 'wipe': state.confirma = { tipo: 'wipe', msg: `Apagar as ${currentResponses().length} respostas da unidade ${settings.unidade} deste tablet?${settings.exported[settings.unidade] ? '' : ' Elas AINDA NÃO foram exportadas.'}` }; render(); break;
    case 'wipeothers': { const outras = allResponses().filter(r => r.unidade !== settings.unidade); const naoExp = [...new Set(outras.filter(r => !settings.exported[r.unidade]).map(r => r.unidade))]; state.confirma = { tipo: 'wipeothers', msg: `Apagar as ${outras.length} respostas de outras unidades (${[...new Set(outras.map(r => r.unidade))].join(', ')})?${naoExp.length ? ' Ainda não exportadas: ' + naoExp.join(', ') + '.' : ''}` }; render(); break; }
    case 'confirmno': state.confirma = null; render(); break;
    case 'confirmyes': { const t = state.confirma && state.confirma.tipo; state.confirma = null;
      if (t === 'wipe') { saveResponses(allResponses().filter(r => r.unidade !== settings.unidade)); delete settings.exported[settings.unidade]; saveSettings(); const ab = abandonos(); delete ab[settings.unidade]; LS.set('mpc_abandonos', ab); toast('Respostas apagadas.'); }
      else if (t === 'wipeothers') { saveResponses(allResponses().filter(r => r.unidade === settings.unidade)); const ab = abandonos(); Object.keys(ab).forEach(k => { if (k !== settings.unidade) delete ab[k]; }); LS.set('mpc_abandonos', ab); toast('Respostas de outras unidades apagadas.'); }
      render(); break; }
    case 'wipehist': localStorage.removeItem('mpc_hist'); toast('Respostas importadas apagadas.'); render(); break;
  }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.matches('[data-cf]')) { state.cf = state.cf || cfDefault(); state.cf[el.dataset.cf] = el.value; if (el.dataset.cf === 'mes') state.cf.dia = ''; render(); }

});

  if (el.id === 'pin-input') { state.pin = el.value.replace(/\D/g, '').slice(0, 8); if (el.value !== state.pin) el.value = state.pin; }

  if (el.id === 'c-contato') { const w = document.getElementById('lgpd-wrap'); if (w) w.hidden = !el.value.trim(); }   // a caixa de consentimento só aparece quando há contato
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && state.screen === 'pin') { e.preventDefault(); pinTentativa(); } });
['touchstart', 'pointerdown', 'keydown'].forEach(ev => document.addEventListener(ev, resetIdle, { passive: true }));

/* ---------------- início ---------------- */
try { history.pushState({ app: 1 }, ''); } catch(e) {}
window.addEventListener('popstate', () => { try { history.pushState({ app: 1 }, ''); } catch(e) {} });   // gesto "voltar" do Android não sai do quiosque
render(); sendPending();
if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) { navigator.serviceWorker.register('../sw.js').catch(() => {}); }

<script>
/* ---- atualizacao automatica ----------------------------------------------
   A cada minuto o app olha o relogio. Se ninguem tocar na tela por 10 minutos
   e existir uma versao nova publicada, ele recarrega sozinho. Nunca recarrega
   com alguem usando: qualquer toque, tecla ou rolagem zera a contagem.        */
(() => {
  if (!/^https?:/.test(location.protocol)) return;
  let ocioso = 10 * 60 * 1000, ultimo = Date.now(), base = null, ocupado = false;
  const toque = () => { ultimo = Date.now(); };
  ['pointerdown', 'keydown', 'touchstart', 'wheel', 'input'].forEach(e => addEventListener(e, toque, { passive: true }));
  document.addEventListener('visibilitychange', () => { if (!document.hidden) toque(); });
  async function impressao() {
    const r = await fetch(location.pathname, { cache: 'no-store' });
    if (!r.ok) throw new Error('http ' + r.status);
    const t = await r.text();
    let h = 5381;
    for (let i = 0; i < t.length; i++) h = ((h * 33) ^ t.charCodeAt(i)) >>> 0;
    return t.length + ':' + h;
  }
  async function verificar() {
    if (ocupado || document.hidden || !navigator.onLine) return 'pulou';
    ocupado = true;
    try {
      const agora = await impressao();
      if (base === null) { base = agora; return 'primeira leitura'; }
      if (agora === base) return 'sem novidade';
      if (Date.now() - ultimo < ocioso) return 'tem versao nova, mas alguem esta usando';
      location.reload();
      return 'recarregando';
    } catch (e) { return 'falhou: ' + (e && e.message); }
    finally { ocupado = false; }
  }
  impressao().then(x => { base = x; }).catch(() => {});
  setInterval(() => { if (Date.now() - ultimo >= ocioso) verificar(); }, 60 * 1000);
  window.__atualiza = { verificar, ociosoMs: ms => { ocioso = ms; }, parado: () => Date.now() - ultimo };
})();
</script>

<script>
/* ---- aviso de servidor ligado/desligado ---------------------------------
   Dentro de Configuracoes, logo abaixo do campo da chave, aparece em tempo real
   se o servidor respondeu, se a chave nao confere ou se esta sem conexao.     */
(() => {
  if (!/^https?:/.test(location.protocol)) return;
  const ID = 'estado-servidor';
  let ultimo = '', pedido = 0, tempo = null;
  const cores = { ok: ['#1B7A52', '#E4F4EC'], ruim: ['#A8323F', '#FBE9EB'], neutro: ['#5E5670', '#EFEDF4'] };
  function pinta(tipo, texto) {
    const el = document.getElementById(ID); if (!el) return;
    const c = cores[tipo] || cores.neutro;
    el.style.cssText = 'flex:1 1 180px;min-width:0;padding:9px 12px;border-radius:10px;font-size:14.5px;font-weight:600;color:' + c[0] + ';background:' + c[1];
    el.textContent = texto;
  }
  function valores() {
    const cx = document.getElementById('s-chave'), cu = document.getElementById('s-webhook');
    const u = (cu && cu.value.trim()) || (typeof settings !== 'undefined' ? (settings.webhook || '') : '');
    const salva = (typeof settings !== 'undefined' && settings) ? (settings.chave || '') : '';
    const k = (cx && cx.value.trim()) || salva;   /* sem campo na tela, vale a chave salva */
    return [u, k];
  }
  async function conferir() {
    const [u, k] = valores();
    const meu = ++pedido;
    if (!u) return pinta('neutro', 'Sem endere\u00e7o de servidor: as respostas ficam s\u00f3 neste aparelho.');
    if (!k) return pinta('neutro', 'Falta a chave: cole a chave de sincroniza\u00e7\u00e3o para ligar o servidor.');
    if (!navigator.onLine) return pinta('ruim', 'Sem internet agora — vou tentar de novo quando a rede voltar.');
    pinta('neutro', 'Falando com o servidor\u2026');
    try {
      const r = await fetch(u + (u.indexOf('?') >= 0 ? '&' : '?') + 'op=ping&chave=' + encodeURIComponent(k));
      const j = await r.json();
      if (meu !== pedido) return;
      if (j && j.ok) pinta('ok', '\u2713 Servidor ligado — as respostas deste aparelho v\u00e3o para a planilha.');
      else if (j && j.erro === 'chave') pinta('ruim', '\u2717 Chave diferente da do servidor: confira se copiou certo.');
      else if (j && j.erro === 'configurar-chave') pinta('ruim', '\u2717 O servidor ainda est\u00e1 com a chave de exemplo.');
      else pinta('ruim', '\u2717 O servidor respondeu algo inesperado.');
    } catch (e) { if (meu === pedido) pinta('ruim', '\u2717 N\u00e3o consegui falar com o servidor (internet ou endere\u00e7o errado).'); }
  }
  function agenda(ms) { clearTimeout(tempo); tempo = setTimeout(conferir, ms); }

  async function mostraVersao() {
    const el = document.getElementById('versao-app'); if (!el) return;
    const app = (typeof VERSAO !== 'undefined' && VERSAO) ? String(VERSAO) : '';
    let aqui = '';
    try {
      const ks = await caches.keys();
      const k = ks.find(x => /^pesquisa-maxipark-/.test(x));
      if (k) aqui = k.replace('pesquisa-maxipark-', '');
    } catch (e) {}
    let publicada = '';
    try {
      const t = await (await fetch('../sw.js', { cache: 'no-store' })).text();
      const m = /VERSAO\s*=\s*'([0-9.]+)'/.exec(t);
      if (m) publicada = m[1];
    } catch (e) {}
    const partes = [];
    partes.push('Neste aparelho: vers\u00e3o ' + (aqui || (publicada || '\u2014')) + (aqui ? '' : ' (ainda sem c\u00f3pia guardada)'));
    if (app) partes.push('tela ' + app);
    let txt = partes.join(' \u00b7 ');
    if (publicada && aqui && publicada !== aqui) {
      txt += ' \u2014 h\u00e1 uma vers\u00e3o nova (' + publicada + '): toque em Atualizar app agora.';
      el.style.color = '#A8323F'; el.style.fontWeight = '700';
    } else if (publicada && aqui && publicada === aqui) {
      txt += ' \u2014 est\u00e1 na vers\u00e3o mais nova.';
      el.style.color = '#1B7A52'; el.style.fontWeight = '600';
    }
    el.textContent = txt;
  }
  function escondeChave(cx) {
    /* A chave salva fica escondida, mas NAO e apagada ao tocar no campo: tocar so
       seleciona tudo, entao digitar substitui e sair sem digitar nao perde nada. */
    if (cx.dataset.mostrando === '1') return;
    const cheia = !!(cx.value || '').trim();
    cx.style.webkitTextSecurity = cheia ? 'disc' : 'none';
    if (!cx.dataset.ligado) {
      cx.dataset.ligado = '1';
      const abre = () => { cx.dataset.mostrando = '1'; cx.style.webkitTextSecurity = 'none'; };
      cx.addEventListener('focus', () => { try { cx.select(); } catch (e) {} });
      cx.addEventListener('input', abre);
    }
  }
  function montar() {
    const cx = document.getElementById('s-chave');
    if (!cx) { ultimo = ''; return; }
    escondeChave(cx);
    if (!document.getElementById(ID)) {
      const linha = document.createElement('div');
      linha.style.cssText = 'display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0 2px';
      const el = document.createElement('div');
      el.id = ID;
      const bt = document.createElement('button');
      bt.type = 'button'; bt.id = 'btn-atualizar-app'; bt.textContent = 'Atualizar app agora';
      bt.style.cssText = 'padding:10px 16px;border:2px solid #6B4A98;border-radius:10px;background:#fff;color:#6B4A98;font-weight:700;font-size:14.5px;cursor:pointer;white-space:nowrap';
      bt.addEventListener('click', async () => {
        bt.disabled = true; bt.textContent = 'Atualizando\u2026';
        try {
          if (navigator.serviceWorker) {
            const rs = await navigator.serviceWorker.getRegistrations();
            await Promise.all(rs.map(r => r.update().catch(() => {})));
          }
          if (window.caches) {
            const ks = await caches.keys();
            await Promise.all(ks.map(k => caches.delete(k)));
          }
        } catch (e) {}
        location.reload();
      });
      linha.appendChild(el); linha.appendChild(bt);
      cx.insertAdjacentElement('afterend', linha);
      const ver = document.createElement('div');
      ver.id = 'versao-app';
      ver.style.cssText = 'margin:2px 0 6px;font-size:13.5px;color:#5E5670';
      ver.textContent = 'Conferindo a vers\u00e3o deste aparelho\u2026';
      linha.insertAdjacentElement('afterend', ver);
      mostraVersao();
      ultimo = '';
    }
    const agora = valores().join('|');
    if (agora !== ultimo) { ultimo = agora; agenda(500); }
  }
  setInterval(montar, 700);
  document.addEventListener('input', e => { if (e.target && (e.target.id === 's-chave' || e.target.id === 's-webhook')) montar(); });
  window.addEventListener('online', () => { ultimo = ''; montar(); });
})();
</script>


<script>
/* ---- a chave vale para os quatro apps deste aparelho ---------------------
   Digitou a chave em um app? Os outros tres do mesmo aparelho passam a usar
   a mesma chave, sem precisar digitar de novo em cada um.                    */
(() => {
  const GUARDA = 'maxipark_chave_sync';
  /* Chaves antigas do tempo em que a chave vinha embutida no codigo: nunca mais valem.
     Sem isto, uma aba velha esquecida aberta empurra a chave morta de volta. */
  const chaveMorta = k => /^MAXIPARK-/i.test(String(k || '').trim());
  const le = () => { try { const v = localStorage.getItem(GUARDA) || ''; return chaveMorta(v) ? '' : v; } catch (e) { return ''; } };
  const grava = v => { try { if (chaveMorta(v)) return; localStorage.setItem(GUARDA, v); } catch (e) {} };
  /* limpeza de uma vez: tira a chave morta deste app e do aparelho */
  (function limpa() {
    try { if (chaveMorta(localStorage.getItem(GUARDA))) localStorage.removeItem(GUARDA); } catch (e) {}
    ['mpc_settings','mp_settings','mpco_settings','mpp_settings'].forEach(n => {
      try { const o = JSON.parse(localStorage.getItem(n)); 
            if (o && chaveMorta(o.chave)) { o.chave = ''; localStorage.setItem(n, JSON.stringify(o)); } } catch (e) {}
    });
  })();
  function salvar() {
    try { if (typeof saveSettings === 'function') saveSettings(); else if (typeof LS === 'object' && LS.set) LS.set('mpc_settings', settings); } catch (e) {}
  }
  /* o endereco do servidor tambem vale para o aparelho todo (trocar de provedor) */
  const GUARDA_SRV = 'maxipark_servidor';
  const servidorDoAparelho = () => { try { return (localStorage.getItem(GUARDA_SRV) || '').trim(); } catch (e) { return ''; } };
  let vista = null;
  function sincroniza() {
    if (typeof settings !== 'object' || !settings) return;
    if (chaveMorta(settings.chave)) { settings.chave = ''; salvar(); }
    const srv = servidorDoAparelho();
    if (srv && srv !== (settings.webhook || '').trim()) { settings.webhook = srv; salvar(); }
    const guardada = le(), minha = (settings.chave || '').trim();
    if (vista === null) vista = minha;
    if (minha !== vista) {            /* a pessoa digitou/salvou aqui: essa passa a valer no aparelho */
      vista = minha; if (minha) grava(minha); return;
    }
    if (guardada && guardada !== minha) {   /* o aparelho tem uma chave: vale mais que a antiga guardada aqui */
      settings.chave = guardada; vista = guardada; salvar(); return;
    }
    if (!guardada && minha) grava(minha);
  }
  sincroniza();
  setInterval(sincroniza, 3000);
  window.addEventListener('storage', sincroniza);
})();
</script>
<script>
/* ---- Diagnostico: diz em portugues por que o servidor nao liga, e conserta ---- */
(() => {
  const ID = 'mp-diag';
  const GUARDA = 'maxipark_chave_sync';
  const linha = (rot, val) => '<div style="display:flex;gap:8px;padding:5px 0;border-bottom:1px solid #eee">' +
    '<b style="min-width:160px">' + rot + '</b><span>' + val + '</span></div>';
  const oculta = k => !k ? '\u2014' : (k.length <= 4 ? '\u2022\u2022\u2022\u2022' : k.slice(0,2) + '\u2022'.repeat(Math.max(3, k.length-4)) + k.slice(-2)) + ' (' + k.length + ' caracteres)';

  async function levantar() {
    const s = (typeof settings === 'object' && settings) ? settings : {};
    const doApp = (s.chave || '').trim();
    let doAparelho = ''; try { doAparelho = localStorage.getItem(GUARDA) || ''; } catch (e) {}
    const url = (s.webhook || '').trim();
    let versao = '?'; try { const t = await (await fetch('../sw.js?x=' + Date.now(), {cache:'reload'})).text();
                            versao = (t.match(/VERSAO = '([^']+)'/) || [])[1] || '?'; } catch (e) { versao = 'sem internet'; }
    let sw = 'nao instalado'; try { sw = (await navigator.serviceWorker.getRegistrations()).length ? 'instalado' : 'nao instalado'; } catch (e) {}
    let caixas = []; try { caixas = await caches.keys(); } catch (e) {}
    let resposta = 'nao testei';
    if (url && doApp) {
      try { const r = await fetch(url + (url.indexOf('?') >= 0 ? '&' : '?') + 'op=ping&chave=' + encodeURIComponent(doApp));
            const j = await r.json();
            resposta = (j && j.ok) ? 'LIGADO \u2014 o servidor aceitou esta chave'
                    : (j && j.erro === 'chave') ? 'a chave deste aparelho NAO confere com a do servidor'
                    : (j && j.erro === 'configurar-chave') ? 'o servidor ainda esta com a chave de exemplo'
                    : 'o servidor recusou (' + JSON.stringify(j).slice(0,80) + ')'; }
      catch (e) { resposta = 'nao consegui falar com o servidor (internet ou endereco)'; }
    } else if (!url) resposta = 'falta o endereco do servidor';
    else resposta = 'falta a chave neste aparelho';

    let veredito, cor;
    if (/^LIGADO/.test(resposta)) { veredito = 'Est\u00e1 tudo certo: este aparelho fala com o servidor.'; cor = '#0a7d3c'; }
    else if (!doApp) { veredito = 'Falta digitar a chave neste aparelho. Digite no campo acima e toque em Salvar.'; cor = '#b00020'; }
    else if (/NAO confere/.test(resposta)) { veredito = 'A chave deste aparelho esta errada. Apague o campo acima, digite a chave certa e toque em Salvar.'; cor = '#b00020'; }
    else { veredito = 'O aparelho nao conseguiu falar com o servidor. Confira a internet.'; cor = '#b00020'; }

    return '<div style="font-size:14.5px;line-height:1.5">' +
      '<div style="padding:10px 12px;border-radius:10px;background:' + cor + '11;color:' + cor + ';font-weight:700;margin-bottom:10px">' + veredito + '</div>' +
      linha('Versao no aparelho', (typeof VERSAO_TELA !== 'undefined' ? VERSAO_TELA : 'tela') ) +
      linha('Versao publicada', versao) +
      linha('Chave deste app', oculta(doApp)) +
      linha('Chave do aparelho', oculta(doAparelho)) +
      linha('As duas batem?', (doApp && doApp === doAparelho) ? 'sim' : (doApp || doAparelho ? 'NAO' : '\u2014')) +
      linha('Endereco do servidor', url ? url.slice(0, 52) + '\u2026' : '\u2014') +
      linha('Resposta do servidor', resposta) +
      linha('App instalado', sw + (caixas.length ? ' \u00b7 ' + caixas.join(', ') : '')) +
      '</div>';
  }

  function monta() {
    const cx = document.getElementById('s-chave');
    if (!cx || document.getElementById(ID + '-bt')) return;
    const bt = document.createElement('button');
    bt.type = 'button'; bt.id = ID + '-bt'; bt.textContent = 'Diagn\u00f3stico do servidor';
    bt.style.cssText = 'margin:10px 0 2px;padding:10px 16px;border:2px solid #6B4A98;border-radius:10px;background:#fff;color:#6B4A98;font-weight:700;font-size:14.5px;cursor:pointer';
    const cx2 = document.createElement('div'); cx2.id = ID; cx2.style.cssText = 'margin:8px 0';
    bt.addEventListener('click', async () => {
      bt.disabled = true; cx2.innerHTML = '<span style="color:#666">Conferindo\u2026</span>';
      try { cx2.innerHTML = await levantar(); } catch (e) { cx2.textContent = 'Nao consegui conferir: ' + e.message; }
      bt.disabled = false;
    });
    const pai = document.getElementById('mp-estado-linha') || cx.parentNode;
    pai.parentNode.insertBefore(bt, pai.nextSibling);
    bt.parentNode.insertBefore(cx2, bt.nextSibling);
  }
  setInterval(monta, 800);
})();
</script>
<script>
/* ---- Botao "Pronto" ao lado da chave: salva, liga o aparelho e diz o resultado ---- */
(() => {
  const ID = 'mp-ok-chave', AVISO = 'mp-ok-aviso';
  const GUARDA = 'maxipark_chave_sync';
  const CAIXAS = ['mpc_settings', 'mp_settings', 'mpco_settings', 'mpp_settings'];
  const morta = k => /^MAXIPARK-/i.test(String(k || '').trim());

  function fala(tipo, texto) {
    const el = document.getElementById(AVISO); if (!el) return;
    const c = tipo === 'ok' ? ['#0a7d3c', '#e8f5ec'] : tipo === 'ruim' ? ['#b00020', '#fdecef'] : ['#4a4a4a', '#f0f0f3'];
    el.style.cssText = 'margin:8px 0 2px;padding:9px 12px;border-radius:10px;font-size:14.5px;font-weight:600;color:' + c[0] + ';background:' + c[1];
    el.textContent = texto;
  }

  function guardaNoAparelho(k) {
    try { localStorage.setItem(GUARDA, k); } catch (e) {}
    CAIXAS.forEach(n => {
      try { const o = JSON.parse(localStorage.getItem(n)) || {}; o.chave = k; localStorage.setItem(n, JSON.stringify(o)); } catch (e) {}
    });
  }

  async function confirmar(bt) {
    const cx = document.getElementById('s-chave'), cu = document.getElementById('s-webhook');
    if (!cx) return;
    const k = (cx.value || '').trim();
    const u = ((cu && cu.value) || (typeof settings !== 'undefined' && settings ? settings.webhook : '') || '').trim();
    if (!k) return fala('ruim', 'Digite a chave do servidor antes de tocar em Pronto.');
    if (morta(k)) return fala('ruim', 'Essa e a chave antiga, que nao vale mais. Digite a chave nova.');
    if (!u) return fala('ruim', 'Falta o endereco do servidor no campo acima.');

    bt.disabled = true; fala('neutro', 'Conferindo a chave com o servidor\u2026');
    let j = null;
    try {
      const r = await fetch(u + (u.indexOf('?') >= 0 ? '&' : '?') + 'op=ping&chave=' + encodeURIComponent(k));
      j = await r.json();
    } catch (e) {
      bt.disabled = false;
      return fala('ruim', 'Nao consegui falar com o servidor. Confira a internet e tente de novo.');
    }
    bt.disabled = false;

    if (!(j && j.ok)) {
      if (j && j.erro === 'chave') return fala('ruim', '\u2717 Essa chave nao confere com a do servidor. Voce digitou: "' + k + '" (' + k.length + ' caracteres). Confira letra por letra \u2014 letras trocadas de lugar sao o erro mais comum.');
      if (j && j.erro === 'configurar-chave') return fala('ruim', '\u2717 O servidor ainda esta com a chave de exemplo.');
      return fala('ruim', '\u2717 O servidor recusou a chave.');
    }
    /* chave certa: grava neste app e nos outros tres do aparelho */
    try { if (typeof settings === 'object' && settings) { settings.chave = k; settings.webhook = u;
          if (typeof saveSettings === 'function') saveSettings(); } } catch (e) {}
    guardaNoAparelho(k);
    try { cx.style.webkitTextSecurity = 'disc'; cx.dataset.mostrando = ''; cx.blur(); } catch (e) {}
    fala('ok', '\u2713 Pronto! Chave salva e servidor ligado neste aparelho \u2014 vale para as quatro telas.');
  }

  function monta() {
    const cx = document.getElementById('s-chave');
    if (!cx || document.getElementById(ID)) return;
    const bt = document.createElement('button');
    bt.type = 'button'; bt.id = ID; bt.textContent = 'Pronto \u2014 usar esta chave';
    bt.style.cssText = 'margin:8px 0 2px;padding:12px 20px;border:0;border-radius:10px;background:#6B4A98;color:#fff;font-weight:700;font-size:15.5px;cursor:pointer';
    const av = document.createElement('div'); av.id = AVISO;
    bt.addEventListener('click', () => confirmar(bt));
    cx.parentNode.insertBefore(bt, cx.nextSibling);
    bt.parentNode.insertBefore(av, bt.nextSibling);
    /* apertar Enter no campo faz o mesmo */
    cx.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); confirmar(bt); } });
  }
  setInterval(monta, 800);
})();
</script>
</body>
