<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Pesquisa Equipe Maxipark</title>
<meta name="theme-color" content="#6B4A98">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Pesquisa Equipe">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="../icon-192.png">
<link rel="icon" href="../icon-192.png">
<style>
  :root{
    /* Paleta Maxipark: roxo oficial #6B4A98 (Pantone/Oracal 043, informado pelo gestor) + violeta do símbolo do logo (#9935F4) como acento */
    --teal:#6B4A98; --teal-dark:#4E3572; --teal-soft:#EEE8F5; --accent:#9935F4; --bg:#F5F3F9; --card:#FFFFFF;
    --text:#221C2E; --muted:#5E5670; --line:#DED8EA; --sel:#FFD54F; --sel-text:#3A2E00;
    --danger:#B23A3A; --ok:#2E7D32; --radius:18px;
    color-scheme: light;   /* o app é sempre claro: evita texto claro do modo escuro do aparelho em botões e campos */
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  button{font-family:inherit;color:var(--text)}
  details summary{color:var(--teal-dark)}
  html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:18px;line-height:1.35}
  body{overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  textarea,input,pre{-webkit-user-select:text;user-select:text}
  #app{min-height:100vh;display:flex;flex-direction:column}
  .top{background:#fff;color:var(--teal-dark);border-bottom:1px solid var(--line);padding:calc(12px + env(safe-area-inset-top,0px)) 20px 12px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .top .brand{display:flex;align-items:center;gap:12px;font-size:14px;font-weight:600;color:var(--muted)}
  .top .step{font-size:15px;text-align:right;color:var(--teal-dark);font-weight:600}
  .progress{height:6px;background:var(--teal-soft)}
  .progress > div{height:100%;background:var(--sel);transition:width .25s}
  .wrap{flex:1;display:flex;flex-direction:column;align-items:center;padding:20px 16px calc(70px + env(safe-area-inset-bottom,0px))}
  .card{width:100%;max-width:820px;background:var(--card);border-radius:var(--radius);padding:22px 22px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
  h1{font-size:28px;line-height:1.2;margin:0 0 10px;color:var(--teal-dark)}
  h2{font-size:23px;line-height:1.25;margin:0 0 12px}
  h3{font-size:19px;margin:18px 0 8px;color:var(--teal-dark)}
  p{margin:0 0 12px}
  ul.plain{margin:0 0 14px;padding-left:22px}
  ul.plain li{margin:6px 0;font-size:19px}
  .muted{color:var(--muted)}
  .small{font-size:15px}
  .notice{background:var(--teal-soft);border-radius:12px;padding:14px 16px;font-size:16px;margin:12px 0}
  .good{background:#E6F4EA;border:1px solid #9CCFA9;border-radius:12px;padding:12px 14px;margin:10px 0 14px;font-size:16px;color:#1B3D26}
  .datefield{padding:12px 14px;border:2px dashed var(--line);border-radius:12px;font-size:19px;font-weight:600;color:var(--teal-dark);background:#fff}
  details{margin:8px 0 14px}
  summary{cursor:pointer;color:var(--teal-dark);font-weight:600;font-size:16px;padding:8px 0}
  .dim{display:inline-block;background:var(--teal-soft);color:var(--teal-dark);border-radius:999px;padding:4px 12px;font-size:14px;font-weight:600;margin-bottom:8px}
  .statement{font-size:26px;font-weight:600;line-height:1.3;margin:4px 0 18px}
  .opts{display:flex;flex-direction:column;gap:10px}
  .opt{display:flex;align-items:center;gap:16px;width:100%;min-height:68px;padding:10px 18px;border:2px solid var(--line);border-radius:14px;background:#fff;font-size:21px;font-weight:600;text-align:left;cursor:pointer;color:var(--text)}
  .opt .num{flex:0 0 46px;height:46px;border-radius:50%;background:var(--teal-soft);color:var(--teal-dark);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px}
  .opt.sel{background:var(--sel);border-color:#E0B400;color:var(--sel-text)}
  .opt.sel .num{background:#fff;font-size:30px;line-height:1}
  .opt.alt{border-style:dashed;color:var(--muted);font-size:17px;font-weight:500;min-height:52px}
  .scale{display:grid;grid-template-columns:repeat(11,1fr);gap:8px;margin:8px 0 6px}
  .scale button{min-height:62px;border:2px solid var(--line);border-radius:12px;background:#fff;font-size:22px;font-weight:700;cursor:pointer;color:var(--text)}
  .scale button.sel{background:var(--sel);border-color:#E0B400;color:var(--sel-text)}
  .anchors{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);margin-bottom:12px;gap:10px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:12px 22px;border-radius:14px;border:0;background:var(--teal);color:#fff;font-size:19px;font-weight:600;cursor:pointer}
  .btn.block{width:100%}
  .btn.ghost{background:#fff;color:var(--teal-dark);border:2px solid var(--teal)}
  .btn.light{background:var(--teal-soft);color:var(--teal-dark)}
  .btn.danger{background:var(--danger)}
  .btn.link{background:transparent;color:var(--muted);font-weight:500;font-size:16px;min-height:44px;padding:8px 12px}
  .btn:disabled{opacity:.45;cursor:default}
  .row{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px}
  .row > .btn{flex:1 1 200px}
  .spread{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:18px;flex-wrap:wrap}
  label{display:block;font-weight:600;margin:14px 0 6px}
  input[type=text],input[type=month],input[type=password],input[type=url],input[type=search],textarea,select{width:100%;font:inherit;font-size:19px;padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--text)}
  textarea{min-height:140px;resize:vertical}
  textarea.obs{min-height:54px;font-size:16px;margin-top:12px;padding:8px 12px;border-style:dashed}
  .unitfield{display:flex;gap:10px;align-items:stretch}
  .unitfield input{flex:1}
  .unitfield .btn{flex:0 0 auto;min-height:0;padding:8px 16px;font-size:16px}
  .ulist{display:flex;flex-direction:column;gap:8px;margin-top:12px;max-height:60vh;overflow:auto}
  .uitem{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:#fff;text-align:left;cursor:pointer;color:var(--text)}
  .uitem b{font-size:18px;color:var(--teal-dark)}
  .uitem span{font-size:14px;color:var(--muted)}
  table{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
  th,td{border:1px solid var(--line);padding:6px 6px;text-align:center}
  th{background:var(--teal-soft);color:var(--teal-dark)}
  td.l,th.l{text-align:left}
  .kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin:10px 0}
  .kpi div{background:var(--teal-soft);border-radius:12px;padding:12px;text-align:center}
  .kpi b{display:block;font-size:26px;color:var(--teal-dark)}
  .kpi span{font-size:13px;color:var(--muted)}
  .pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:320px;margin:12px auto}
  .pinpad button{min-height:62px;font-size:26px;border-radius:14px;border:2px solid var(--line);background:#fff;cursor:pointer;color:var(--text)}
  .pinpad button.ok{background:var(--teal);border-color:var(--teal);color:#fff;font-size:20px;font-weight:700}
  /* campo único do PIN: mostra os pontos (sem type=password, para o navegador não oferecer "salvar senha") e aceita o teclado do tablet ou físico */
  .pininput{display:block;max-width:320px;margin:8px auto 6px;text-align:center;font-size:30px;letter-spacing:12px;min-height:60px;-webkit-text-security:disc}
  .pininput::placeholder{letter-spacing:0;font-size:15px;-webkit-text-security:none}
  .thanks{text-align:center;padding:36px 10px}
  .thanks .check{width:96px;height:96px;border-radius:50%;background:var(--ok);color:#fff;font-size:56px;display:flex;align-items:center;justify-content:center;margin:0 auto 20px}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222;color:#fff;padding:12px 18px;border-radius:12px;font-size:16px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;z-index:9}
  .toast.show{opacity:1}
  .corner{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.94);color:var(--muted);font-size:13px;font-weight:600;cursor:pointer;z-index:5;box-shadow:0 1px 4px rgba(0,0,0,.10)}
  .warn{background:#FFF4D6;border-left:5px solid #E0B400;padding:10px 14px;border-radius:8px;font-size:15px;margin:10px 0}
  .bad{background:#FBE3E3;border-left:5px solid var(--danger);padding:10px 14px;border-radius:8px;font-size:15px;margin:10px 0}
  pre{white-space:pre-wrap;font-size:13px;background:#F7F9F9;border:1px solid var(--line);border-radius:10px;padding:10px;max-height:260px;overflow:auto}
  .legend{font-size:13px;color:var(--muted);margin:6px 0 0}
  .filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:6px}
  .filters label{margin:0 0 4px;font-size:13px;color:var(--muted)}
  .filters select{font-size:16px;padding:8px 10px}
  .tag{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700}
  .tag.ok{background:#E6F4EA;color:#1E6B34}
  .tag.pend{background:#FBE3E3;color:#9B1C1C}
  .up{color:#1E6B34;font-weight:700} .down{color:var(--danger);font-weight:700}
  tr.cur td{background:#F1F8F4}
  .check{display:flex;gap:10px;align-items:center;font-weight:500;margin:10px 0 4px;font-size:16px}
  .check input{width:22px;height:22px}
  .obslist{padding-left:18px;font-size:15px} .obslist > li{margin:8px 0} .obslist ul{padding-left:18px;margin:4px 0}
  .pergunta{border:1px solid var(--line);border-radius:12px;padding:10px 14px 14px;margin:10px 0;background:#FAFBFB}
  .pergunta label{font-size:14px;margin:8px 0 4px} .pergunta input,.pergunta textarea,.pergunta select{font-size:16px;padding:8px 10px} .pergunta textarea{min-height:0}
  /* identidade Maxipark: barra branca com o logo, barra de progresso violeta → índigo */
  .brand .logo{height:44px;width:auto;display:block}
  .logo-hero{display:flex;justify-content:center;margin:2px 0 14px} a.home{display:inline-flex;align-items:center;border-radius:8px} a.home:active{opacity:.7} .logo-hero img{height:58px;width:auto;max-width:80%}
  .progress div{background:linear-gradient(90deg,var(--accent),var(--teal))}
  .thanks .check{background:linear-gradient(135deg,var(--accent),var(--teal))}
  @media (max-width:560px){ .brand span{display:none} .brand .logo{height:34px} .logo-hero img{height:44px} }
  @media (max-width:560px){ .statement{font-size:23px} .scale{grid-template-columns:repeat(6,1fr)} h1{font-size:25px} .opt{font-size:19px} }
  @media (max-height:600px) and (orientation:landscape){ textarea.obs{min-height:44px;margin-top:8px;padding:6px 10px} .spread{margin-top:8px} .statement{font-size:20px;margin:2px 0 8px} .opt{min-height:50px} .wrap{padding:8px 16px 56px} }
  @media (max-height:820px) and (orientation:landscape){
    .wrap{padding:10px 16px 60px} .card{padding:14px 18px} .statement{font-size:22px;margin:2px 0 10px}
    .opts{gap:8px} .opt{min-height:54px;padding:6px 14px;font-size:19px} .opt .num{flex-basis:38px;height:38px;font-size:17px}
    .spread{margin-top:10px} .dim{margin-bottom:4px} .scale button{min-height:50px} .top{padding-top:8px;padding-bottom:8px}
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast"></div>
<input type="file" id="file-unidades" accept=".csv,.txt,.xlsx,.xls" style="display:none">
<input type="file" id="file-hist" accept=".csv,.txt" multiple style="display:none">
<input type="file" id="file-pergs" accept=".json,application/json" style="display:none">

  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch(e){ return false; } }
};
const DEFAULT_SETTINGS = { pin:'', unidade:'', mes:'', data:'', rodada:'R1', webhook:'', chave:'', ultimaSync:'', exported:{}, pinFails:0, lockUntil:0 };   // sem nome do avaliador (pedido do gestor): o app não guarda nome de ninguém
let settings = Object.assign({}, DEFAULT_SETTINGS, LS.get('mp_settings', {}));
function saveSettings(){ LS.set('mp_settings', settings); }
aplicarTextos();   // perguntas, respostas e pesos: padrão ou alterados pelo gestor
if ('avaliador' in settings) { delete settings.avaliador; saveSettings(); }   // apaga o nome do avaliador gravado por versões anteriores
// PIN programado: aplica o PIN padrão uma única vez (também em tablets que já tinham outro PIN de teste); depois disso, um PIN trocado em Configurações é respeitado.
if (settings.pinPadraoAplicado !== PIN_PADRAO_MARCA) { settings.pin = PIN_PADRAO; settings.pinFails = 0; settings.lockUntil = 0; settings.pinPadraoAplicado = PIN_PADRAO_MARCA; saveSettings(); }
if (settings.senhaZerarAplicada !== SENHA_ZERAR_MARCA) { settings.senhaZerar = SENHA_ZERAR_PADRAO; settings.senhaZerarAplicada = SENHA_ZERAR_MARCA; saveSettings(); }
// Zerar histórico: apaga respostas, recusas, rodadas e importadas deste aparelho; mantém PIN, senha de zerar e lista de unidades.
function zerarHistorico(){
  ['mp_respostas', 'mp_recusas', 'mp_hist', 'mp_rodadas'].forEach(k => { try { localStorage.removeItem(k); } catch(e) {} });
  settings.exported = {}; settings.rodada = 'R1'; settings.unidade = ''; settings.mes = ''; settings.data = ''; saveSettings();
}
// Pedido do gestor (09/09/2026): ao atualizar para esta versão, cada tablet começa do zero (uma única vez, controlado pela marca abaixo).
const ZERAR_MARCA = 'zerar-2026-09-09';
if (settings.zeradoEm !== ZERAR_MARCA) { const tinha = allResponses().length + (LS.get('mp_hist', []) || []).length; zerarHistorico(); settings.zeradoEm = ZERAR_MARCA; settings.avisoZerado = tinha ? `${tinha} resposta(s), recusas, rodadas e importadas` : true; saveSettings(); }
function allResponses(){ return LS.get('mp_respostas', []); }
function saveResponses(list){ return LS.set('mp_respostas', list); }
/* Rodadas: cada "pesquisa" é uma rodada (R1, R2…). Uma nova rodada zera as contagens da coleta sem apagar nada; o histórico fica no Consolidado. */
function rodadas(){
  let l = LS.get('mp_rodadas', null);
  if (!Array.isArray(l) || !l.length) {
    const datas = allResponses().map(r => r.data || (r.mes ? r.mes + '-01' : '')).filter(Boolean).sort();
    l = [{ id:'R1', nome:'Rodada 1', inicio: datas[0] || hojeISO(), fim:'' }];
    LS.set('mp_rodadas', l);
  }
  return l;
}
function saveRodadas(l){ return LS.set('mp_rodadas', l); }
function rodadaDe(r){ return (r && r.rodada) || 'R1'; }   // respostas antigas (sem carimbo) pertencem à Rodada 1
function rodadaNome(id){ const x = rodadas().find(r => r.id === id); return x ? x.nome : (id || 'Rodada 1'); }
function garantirRodada(id){ const l = rodadas(); if (!l.find(r => r.id === id)) { l.push({ id, nome: 'Rodada ' + String(id).replace(/^R/, '') + ' (importada)', inicio:'', fim:'' }); saveRodadas(l); } }
function novaRodada(){
  const l = rodadas(); const atual = l.find(r => r.id === settings.rodada); if (atual) atual.fim = hojeISO();
  const n = Math.max(0, ...l.map(r => parseInt(String(r.id).replace(/^R/, ''), 10) || 0)) + 1;
  const nova = { id: 'R' + n, nome: 'Rodada ' + n, inicio: hojeISO(), fim:'' };
  l.push(nova); saveRodadas(l); settings.rodada = nova.id; saveSettings();
  return nova;
}
if (!settings.rodada) { settings.rodada = 'R1'; saveSettings(); }
// chaves antigas "unidade|AAAA-MM" (recusas e marcação de exportado) passam a "unidade|R1"
(function migrarChavesRodada(){
  const re = /\|\d{4}-\d{2}$/;
  const rec = LS.get('mp_recusas', {}); let mudou = false; const novo = {};
  Object.keys(rec).forEach(k => { const nk = re.test(k) ? k.replace(re, '|R1') : k; if (nk !== k) mudou = true; novo[nk] = (novo[nk] || 0) + (rec[k] || 0); });
  if (mudou) LS.set('mp_recusas', novo);
  const ex = settings.exported || {}; let m2 = false; const ne = {};
  Object.keys(ex).forEach(k => { const nk = re.test(k) ? k.replace(re, '|R1') : k; if (nk !== k) m2 = true; ne[nk] = (nk in ne) ? (ne[nk] && ex[k]) : ex[k]; });   // só conta como exportado se TODOS os meses fundidos foram
  if (m2) { settings.exported = ne; saveSettings(); }
})();
function key(u, r){ return (u || settings.unidade) + '|' + (r || settings.rodada); }
function currentResponses(){ return allResponses().filter(r => r.unidade === settings.unidade && rodadaDe(r) === settings.rodada); }
function otherKeys(){ const m = {}; allResponses().forEach(r => { const k = key(r.unidade, rodadaDe(r)); if (k !== key()) m[k] = (m[k] || 0) + 1; }); return m; }
function keyLabel(k){ const [u, r] = k.split('|'); return u + ' · ' + rodadaNome(r); }
function refusals(){ const m = LS.get('mp_recusas', {}); return m[key()] || 0; }
function addRefusal(){ const m = LS.get('mp_recusas', {}); m[key()] = (m[key()] || 0) + 1; LS.set('mp_recusas', m); }
function uid(){ return Math.random().toString(36).slice(2, 10) + Math.random().toString(36).slice(2, 6); }
function shuffle(a){ const x = a.slice(); for (let i = x.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [x[i], x[j]] = [x[j], x[i]]; } return x; }
function configured(){ return !!(settings.pin && settings.unidade && settings.mes); }
/* lista de unidades: importada (localStorage) ou padrão */
function unidades(){ const u = LS.get('mp_unidades', null); return (u && u.origem && Array.isArray(u.lista) && u.lista.length) ? u.lista : UNIDADES_PADRAO; }
function unidadesInfo(){ const u = LS.get('mp_unidades', null); return (u && u.origem) ? `${u.lista.length} unidades importadas (${u.origem})` : `${UNIDADES_PADRAO.length} unidades da lista padrão (Grande SP)`; }
function unidadePorCodigo(c){ return unidades().find(u => u.codigo === c) || null; }

/* ---------------- estado da tela ---------------- */
const SURVEY_SCREENS = ['q','enps','ces','open'];
let state = { screen: 'setup', q: 0, pin: '', pinTarget: 'admin', showText: '', newPin: '', newPinStage: 0, newPinFirst: '', notice: '', pickReturn: 'setup', filtro: '' };
let current = null;      // resposta em andamento: só existe na memória até o fim
let thanksTimer = null, idleTimer = null, deferredInstall = null, busy = false, sending = false, answerToken = 0, pendingConfirm = null;

function novaResposta(){ if (settings.data !== hojeISO()) { fixarData(); saveSettings(); } return { id: uid(), versao: VERSAO, escala: ESCALA, unidade: settings.unidade, mes: settings.mes, data: settings.data, rodada: settings.rodada, r: Array(ITENS.length).fill(null), c: Array(ITENS.length).fill(''), enps: null, cEnps: '', ces: null, cCes: '', a1: '', a2: '', sent: false }; }
// comentário opcional em cada página da pesquisa (pedido do gestor): c[i] por frase, cEnps e cCes
function obsField(val){ return `<textarea id="f-obs" class="obs" maxlength="300" rows="2" placeholder="Comentário (opcional) — sem nomes, seu ou de colegas">${esc(val || '')}</textarea>`; }
function captureObs(){
  const ta = document.getElementById('f-obs'); if (!ta || !current) return;
  const v = ta.value.trim().slice(0, 300);
  if (state.screen === 'q') { if (!current.c) current.c = Array(ITENS.length).fill(''); current.c[state.q] = v; }
  else if (state.screen === 'enps') current.cEnps = v; else if (state.screen === 'ces') current.cCes = v;
}
function obsAtual(screen, q){ if (!current) return ''; return screen === 'q' ? ((current.c || [])[q] || '') : screen === 'enps' ? (current.cEnps || '') : screen === 'ces' ? (current.cCes || '') : ''; }
function homeScreen(){ return configured() ? 'welcome' : 'setup'; }
function go(screen, extra){
  state.screen = screen; state.fin = false; Object.assign(state, extra || {});   // fin: chegou aqui por "Finalizar pesquisa"
  // fora das telas de resposta, a pesquisa em andamento só sobrevive na tela de erro de gravação, de PIN e de confirmação
  if (!SURVEY_SCREENS.includes(screen) && screen !== 'saveerror' && screen !== 'pin' && screen !== 'confirm') current = null;
  armIdle(); render(); window.scrollTo(0, 0);
}
function askConfirm(msg, onYes){ pendingConfirm = { msg, onYes, from: state.screen, q: state.q }; state.screen = 'confirm'; armIdle(); render(); window.scrollTo(0, 0); }
function discardAndHome(){ current = null; busy = false; pendingConfirm = null; go(homeScreen()); }
function armIdle(){
  clearTimeout(idleTimer);
  const inSurvey = () => SURVEY_SCREENS.includes(state.screen) || (state.screen === 'confirm' && pendingConfirm && SURVEY_SCREENS.includes(pendingConfirm.from));
  if (inSurvey()) idleTimer = setTimeout(() => { if (inSurvey()) discardAndHome(); }, IDLE_MS);
}
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), Math.min(9000, 2500 + msg.length * 35)); }   // mensagens longas ficam mais tempo
function mesLabel(m){ if(!m) return ''; const [y, mo] = m.split('-'); return mo + '/' + y; }
function validMes(m){ return /^\d{4}-(0[1-9]|1[0-2])$/.test(m || ''); }
// Data da coleta: preenchida automaticamente (dia/mês/ano de hoje); o mês de referência deriva dela. A mesma data vale para todos os
// colaboradores da visita — nunca se grava hora nem ordem de resposta.
function hojeISO(){ const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function dataLabel(d){ if (!d) return ''; const [y, m, dd] = d.split('-'); return dd + '/' + m + '/' + y; }
function fixarData(){ settings.data = hojeISO(); settings.mes = settings.data.slice(0, 7); }
function startThanks(){ go('thanks'); clearTimeout(thanksTimer); thanksTimer = setTimeout(() => { if (state.screen === 'thanks') go('welcome'); }, 20000); }

/* ---------------- telas ---------------- */
function render(){
  const foco = document.activeElement && /^(pin|newpin)-input$/.test(document.activeElement.id) ? document.activeElement.id : '';
  const views = { setup:viewSetup, setpin:viewSetPin, welcome:viewWelcome, q:viewQuestion, enps:viewEnps, ces:viewCes, open:viewOpen, thanks:viewThanks, pin:viewPin, admin:viewAdmin, settings:viewSettings, text:viewText, saveerror:viewSaveError, confirm:viewConfirm, unidades:viewUnidades, colar:viewColar, consolidado:viewConsolidado, perguntas:viewPerguntas };
  document.getElementById('app').innerHTML = (views[state.screen] || viewSetup)();
  if (foco) { const el = document.getElementById(foco); if (el && !el.disabled) { el.focus({ preventScroll: true }); try { el.setSelectionRange(el.value.length, el.value.length); } catch(e) {} } }   // mantém o teclado aberto após cada tecla
}
function header(step, pct){
  return `<div class="top"><div class="brand"><a href="../" class="home" title="Página inicial: escolher a pesquisa" aria-label="Página inicial: escolher a pesquisa"><img class="logo" src="data:image/png;base64,${LOGO_B64}" alt="Maxipark"></a><span>Pesquisa com a equipe</span></div><div class="step">${esc(step || '')}</div></div>
          <div class="progress"><div style="width:${pct || 0}%"></div></div>`;
}
function cornerBtn(){ return `<button class="corner" data-action="pin" data-target="admin" aria-label="Área do avaliador (com PIN)">⚙ Avaliador</button>`; }
function logoHero(){ return `<div class="logo-hero"><a href="../" class="home" title="Página inicial: escolher a pesquisa"><img src="data:image/png;base64,${LOGO_B64}" alt="Maxipark"></a></div>`; }   // logo grande no topo dos cartões principais
function unidadeLabel(c){ const u = unidadePorCodigo(c); if (!u) return c || ''; return u.codigo + (u.nome ? ' · ' + u.nome : '') + (u.bairro ? ' · ' + u.bairro : ''); }
function unitField(idPrefix, ret){
  return `<label>Unidade</label>
    <div class="unitfield">
      <input type="text" id="${idPrefix}-unidade" value="${esc(settings.unidade)}" placeholder="toque em Escolher" autocapitalize="characters" autocomplete="off">
      <button class="btn light" data-action="pickunit" data-ret="${ret}">Escolher na lista</button>
    </div>
    ${settings.unidade ? `<p class="small muted" style="margin:6px 0 0">${esc(unidadeLabel(settings.unidade))}</p>` : `<p class="small muted" style="margin:6px 0 0">${esc(unidadesInfo())}</p>`}`;
}

function viewSetup(){
  const pinOk = !!settings.pin;
  let fim = '';
  if (state.fin) {   // veio de "Finalizar pesquisa" na tela Obrigado!
    const n = currentResponses().length, rec = refusals();
    fim = `<div class="good"><b>Pesquisa finalizada · ${esc(settings.unidade)} · ${settings.data ? dataLabel(settings.data) : mesLabel(settings.mes)}</b><br>${n} resposta${n === 1 ? '' : 's'} gravada${n === 1 ? '' : 's'}${rec ? ` · ${rec} preferi${rec === 1 ? 'u' : 'ram'} não responder` : ''}. Exporte as contagens antes de preparar outra unidade.
      <div class="row" style="margin-top:10px"><button class="btn block" data-action="admin">Ver contagens e exportar</button></div></div>`;
  }
  return header('Avaliador · configuração', 0) + `<div class="wrap"><div class="card">
    ${logoHero()}
    <h1>Preparar a coleta</h1>
    ${fim}
    <p class="muted">Escolha a unidade antes de entregar o tablet à equipe. Com as respostas ficam gravados só o código da unidade e a data da coleta — nenhum nome, cargo ou horário.</p>
    ${pinOk ? '' : '<div class="warn">Primeiro uso: defina o <b>PIN do avaliador</b>. Ele protege as contagens e as configurações.</div>'}
    ${unitField('f', 'setup')}
    <label>Data da coleta (preenchida automaticamente)</label>
    <div class="datefield">${dataLabel(hojeISO())} <span class="small muted">· mês de referência ${mesLabel(hojeISO().slice(0, 7))} · <b>${esc(rodadaNome(settings.rodada))}</b></span></div>
    ${settings.avisoZerado ? `<div class="warn">Ao atualizar para a versão ${VERSAO}, o histórico deste tablet foi zerado (${settings.avisoZerado === true ? 'respostas, recusas, rodadas e importadas' : esc(settings.avisoZerado)}), a pedido do gestor. O PIN e a lista de unidades foram mantidos. <button class="btn link" data-action="okzerado">OK, entendi</button></div>` : ''}
    <div class="row">
      ${pinOk ? '<button class="btn block" data-action="start">Iniciar coleta com a equipe</button>' : '<button class="btn block" data-action="gosetpin">Definir PIN do avaliador</button>'}
    </div>
    <div class="row">
      <button class="btn ghost" data-action="pin" data-target="admin" ${pinOk ? '' : 'disabled'}>Área do avaliador (contagens e exportar)</button>
      ${deferredInstall ? '<button class="btn light" data-action="install">Instalar como app no tablet</button>' : ''}
    </div>
    <p class="small muted" style="margin-top:18px">Versão ${VERSAO} · funciona sem internet · <b>exporte as respostas no fim de cada visita</b> e apague-as depois de conferir que o CSV chegou à área de Experiência do Cliente — o histórico para comparar rodadas fica nos CSVs e no aparelho onde eles são importados.</p>
    <p class="small" style="margin-top:8px"><a href="../" style="color:var(--teal-dark);font-weight:600">← Página inicial (escolher a pesquisa)</a> <span class="muted">·</span> <a href="../cliente/" style="color:var(--teal-dark);font-weight:600">Pesquisa com CLIENTES (cliente final)</a></p>
  </div></div>`;
}

function viewUnidades(){
  const f = (state.filtro || '').trim().toLowerCase();
  const lista = unidades();
  const hits = lista.filter(u => !f || [u.codigo, u.nome, u.endereco, u.bairro, u.regiao].join(' ').toLowerCase().includes(f));
  const shown = hits.slice(0, 80);
  return header('Escolher unidade', 0) + `<div class="wrap"><div class="card">
    <h2>Qual é a unidade?</h2>
    <input type="search" id="u-filtro" value="${esc(state.filtro)}" placeholder="${(LS.get('mp_unidades', null) || {}).origem ? 'Digite parte do código, do cliente, do endereço, do bairro ou da região' : 'Digite parte do código ou do bairro (ex.: GAZETA ou Bela Vista)'}" autocomplete="off" autofocus>
    <p class="small muted" style="margin:8px 0 0">${hits.length} de ${lista.length} unidades${hits.length > shown.length ? ' (mostrando as primeiras ' + shown.length + ' — refine a busca)' : ''} · ${esc(unidadesInfo())}</p>
    <div class="ulist">${shown.map(u => `<button class="uitem" data-action="chooseunit" data-c="${esc(u.codigo)}"><b>${esc(u.codigo)}${u.nome ? ' · ' + esc(u.nome) : ''}</b><span>${esc([u.endereco, u.bairro, u.regiao].filter(Boolean).join(' · '))}</span></button>`).join('') || '<p class="muted">Nenhuma unidade com esse texto. Você pode digitar o código direto no campo Unidade.</p>'}</div>
    <div class="row"><button class="btn ghost block" data-action="cancelpick">Voltar</button></div>
  </div></div>`;
}

function viewColar(){
  return header('Colar lista de unidades', 0) + `<div class="wrap"><div class="card">
    <h2>Cole a lista</h2>
    <p class="small muted">Uma unidade por linha. Colunas separadas por ponto e vírgula, vírgula ou tabulação (copiar do Excel funciona): <b>Código; Nome/Cliente; Endereço; Bairro/Cidade; Região</b>. A primeira linha pode ser o cabeçalho.</p>
    <textarea id="c-lista" placeholder="GAZETA;Edifício Gazeta;Av. Paulista 900;Bela Vista;Centro"></textarea>
    <div class="row"><button class="btn" data-action="importpaste">Importar</button><button class="btn ghost" data-action="settings">Cancelar</button></div>
  </div></div>`;
}

function viewSetPin(){

  const keys = ['1','2','3','4','5','6','7','8','9','←','0','OK'];
  const repeat = state.newPinStage === 1;

    <p class="small muted" style="text-align:center">${repeat ? 'Repita os mesmos números e toque em OK.' : '4 a 8 números. Não use 1234, 0000 ou datas fáceis. Digite e toque em <b>OK</b>.'}${zerar ? ' Esta senha só serve para apagar todo o histórico do tablet; é diferente do PIN do avaliador.' : ''}</p>
    <input type="text" id="newpin-input" class="pininput" inputmode="numeric" pattern="[0-9]*" maxlength="8" autocomplete="off" enterkeyhint="done" placeholder="toque nos números ou digite aqui" value="${esc(state.newPin)}">

// Sem botão "Voltar" e sem avanço automático (pedido do gestor): a página só muda pelo botão "Próxima", para dar tempo de escrever o comentário.
function surveyFooter(canBack, canNext, nextLabel){
  return `<div class="spread">
      <button class="btn link" data-action="quit">Desistir</button>
      <button class="btn ${canNext ? '' : 'light'}" data-action="next" ${canNext ? '' : 'disabled'}>${nextLabel || 'Próxima →'}</button>
    </div>`;
}

function viewQuestion(){
  const i = state.q, it = ITENS[i], val = current.r[i];
  const pct = Math.round((i / (ITENS.length + 4)) * 100);
  const opts = it.opts.map((lbl, k) => `<button class="opt ${val === VALOR[k] ? 'sel' : ''}" data-action="answer" data-val="${VALOR[k]}"><span class="num">${val === VALOR[k] ? '●' : ''}</span><span>${esc(lbl)}</span></button>`).join('');
  const na = it.na ? `<button class="opt alt ${val === 'NA' ? 'sel' : ''}" data-action="answer" data-val="NA"><span class="num">—</span><span>${esc(it.na)}</span></button>` : '';
  return header(`Frase ${i+1} de ${ITENS.length}`, pct) + `<div class="wrap"><div class="card">
    <span class="dim">${esc(it.dim)}</span>
    <div class="statement">${esc(it.t)}</div>
    <div class="opts">${opts}${na}</div>
    ${obsField((current.c || [])[i])}
    ${surveyFooter(i > 0, val != null)}
  </div></div>` + cornerBtn();
}

function scaleButtons(val){
  let h = '';
  for (let k = 0; k <= 10; k++) h += `<button class="${val === k ? 'sel' : ''}" data-action="answer" data-val="${k}">${k}</button>`;
  return `<div class="scale">${h}</div>`;
}
function viewEnps(){
  const pct = Math.round((ITENS.length / (ITENS.length + 4)) * 100);
  return header('Nota de 0 a 10', pct) + `<div class="wrap"><div class="card">

/* ---------------- cálculo das contagens ---------------- */
function tally(list){
  const items = ITENS.map(() => ({ c:[0,0,0], na:0, n:0 }));   // c[0] = Não (1), c[1] = meio (2), c[2] = Sim (3)
  const enps = { det:0, neu:0, pro:0, n:0 };
  const ces = { nao:0, meio:0, sim:0, np:0, n:0 };
  let coments = [], legado = 0, obsItens = ITENS.map(() => []), obsEnps = [], obsCes = [];
  list.forEach(resp => {
    if (resp.escala !== ESCALA) { legado++; return; }   // resposta de versão anterior (escala 1-5): não mistura
    resp.r.forEach((v, i) => {
      if (v === 'NA') items[i].na++;
      else if (v === 1 || v === 2 || v === 3) { items[i].c[v-1]++; items[i].n++; }
    });
    if (typeof resp.enps === 'number') { enps.n++; if (resp.enps <= 6) enps.det++; else if (resp.enps <= 8) enps.neu++; else enps.pro++; }
    if (resp.ces === 'NP') ces.np++;
    else if (resp.ces === 1 || resp.ces === 2 || resp.ces === 3) { ces.n++; if (resp.ces === 1) ces.nao++; else if (resp.ces === 2) ces.meio++; else ces.sim++; }
    if (resp.a1) coments.push(resp.a1);
    if (resp.a2) coments.push(resp.a2);
    (resp.c || []).forEach((txt, i) => { if (txt && obsItens[i]) obsItens[i].push(txt); });
    if (resp.cEnps) obsEnps.push(resp.cEnps);
    if (resp.cCes) obsCes.push(resp.cCes);
  });
  coments = shuffle(coments);   // nunca na ordem em que as pessoas responderam
  obsItens.forEach((l, i) => { obsItens[i] = shuffle(l); }); obsEnps = shuffle(obsEnps); obsCes = shuffle(obsCes);
  const nResp = list.length - legado;
  // tudo é calculado a partir de 1 resposta; os sinais abaixo só dizem o que pode ser DIVULGADO por unidade
  // 'poucas' só quando a unidade tem respostas suficientes mas a frase não (houve "Não se aplica"); com 1-2 respostas o banner vermelho já cobre
  items.forEach(it => { it.pctSim = it.n ? Math.round(it.c[2] / it.n * 100) : null; it.poucas = nResp >= N_DIVULGA_FRASE && it.n > 0 && it.n < N_DIVULGA_FRASE; });
  const enpsVal = enps.n ? Math.round((enps.pro - enps.det) / enps.n * 100) : null;
  const cesFacil = ces.n ? Math.round(ces.sim / ces.n * 100) : null;
  const totSim = items.reduce((a, it) => a + it.c[2], 0), totN = items.reduce((a, it) => a + it.n, 0);
  const pctSimGeral = totN ? Math.round(totSim / totN * 100) : null;
  let pSim = 0, pN = 0; items.forEach((it, i) => { const p = (ITENS[i] && ITENS[i].peso) || 1; pSim += p * it.c[2]; pN += p * it.n; });
  const pctSimPond = pN ? Math.round(pSim / pN * 100) : null;   // ponderado pelos pesos das frases
  const identificavel = nResp > 0 && nResp < N_DIVULGA_FRASE;          // 1 ou 2 pessoas: as contagens são as respostas delas
  const poucasDetalhe = nResp > 0 && nResp < N_DIVULGA_DETALHE;        // eNPS, CES e comentários: não divulgar por unidade
  const cesPoucas = ces.n > 0 && ces.n < N_DIVULGA_DETALHE;            // poucos precisaram do escritório
  return { items, enps, ces, coments, obsItens, obsEnps, obsCes, nResp, legado, enpsVal, cesFacil, pctSimGeral, pctSimPond, identificavel, poucasDetalhe, cesPoucas };
}

  L.push('Leitura: 3 = Sim, 2 = resposta do meio, 1 = Não. Em B12 "Não lembro" conta como não elogiado; em B15 "Talvez" não é meio-termo: leia essas duas só pelo % Sim.');

  L.push(`CES (escritório)\t${CES_OPTS[2]}: ${t.ces.nao}\t${CES_OPTS[1]}: ${t.ces.meio}\t${CES_OPTS[0]}: ${t.ces.sim}\tNunca precisei: ${t.ces.np}\t${t.cesFacil == null ? '' : '% fácil = ' + t.cesFacil + '%'}${t.cesPoucas ? ' (menos de ' + N_DIVULGA_DETALHE + ' precisaram do escritório)' : ''}`);
  if (t.poucasDetalhe) L.push(`(eNPS e CES: não divulgar por unidade com menos de ${N_DIVULGA_DETALHE} respostas)`);
  return L.join('\n');
}

function csvText(list){
  // escala B3: B1-B15 → 3 = Sim, 2 = resposta do meio, 1 = Não, NA = não se aplica; CES → 3 = fácil, 2 = mais ou menos, 1 = difícil, NP = nunca precisei.
  // Linhas sem carimbo (escala B5) vêm da v1.2, com notas de 1 a 5. Sem linha de legenda: o arquivo é só dados, uma pessoa por linha.
  const head = ['versao','escala','id','unidade','mes','data','rodada', ...ITENS.map(it => 'B' + it.n), 'eNPS', 'CES', 'aberta1', 'aberta2', ...ITENS.map(it => 'cB' + it.n), 'cENPS', 'cCES'];   // data = dia da coleta; rodada = R1, R2…; cB1… = comentário escrito na página da frase
  // quebras de linha viram espaço: o arquivo fica com uma pessoa por linha e importa sem perder campos
  const q = v => { let s = String(v == null ? '' : v).replace(/\s*\r?\n\s*/g, ' '); if (/^[=+\-@\t\r]/.test(s)) s = "'" + s; return '"' + s.replace(/"/g, '""') + '"'; };
  const rows = shuffle(list).map(r => [r.versao || '1.2', r.escala || 'B5', r.id, r.unidade, r.mes, r.data || '', rodadaDe(r), ...r.r.map(v => v == null ? '' : v), r.enps == null ? '' : r.enps, r.ces == null ? '' : r.ces, r.a1, r.a2, ...ITENS.map((it, i) => (r.c || [])[i] || ''), r.cEnps || '', r.cCes || ''].map(q).join(';'));
  return '﻿' + head.join(';') + '\n' + rows.join('\n') + '\n';
}

function lerPerguntas(){   // lê o formulário; devolve {ok, msg, o}

    if (!it.t) return { ok: false, msg: `A frase B${i + 1} está vazia.` };
    if (it.opts.some(x => !x)) return { ok: false, msg: `A frase B${i + 1} precisa das 3 respostas.` };
    if (new Set(it.opts.map(x => x.toLowerCase())).size < 3) return { ok: false, msg: `As 3 respostas da frase B${i + 1} precisam ser diferentes.` };

  }
  if (!o.enpsQ || !o.cesQ || o.cesOpts.some(x => !x) || o.abertas.some(x => !x)) return { ok: false, msg: 'Preencha todas as perguntas e respostas.' };
  if (NEG_RE.test(o.cesOpts[0]) || POS_RE.test(o.cesOpts[2])) return { ok: false, msg: 'CES: a 1ª resposta deve ser a positiva ("fácil") e a 3ª a negativa ("difícil").' };

/* ---------------- consolidado de todas as unidades e rodadas ---------------- */
const MESES = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
function histResponses(){ return LS.get('mp_hist', []); }   // respostas importadas de outros tablets (CSV do app)
function poolConsolidado(){
  const seen = new Set(), lista = []; let legado = 0;
  allResponses().concat(histResponses()).forEach(r => { if (!r || !r.id || seen.has(r.id)) return; seen.add(r.id); if (r.escala !== ESCALA) { legado++; return; } lista.push(r); });
  return { lista, legado };
}
function agregar(list){   // um grupo de respostas (uma unidade ou todas)
  const a = { n: list.length, totSim: 0, totN: 0, enps: { n:0, pro:0, det:0 }, ces: { n:0, sim:0 }, itens: ITENS.map(() => ({ c:[0,0,0], na:0, n:0 })) };
  list.forEach(r => {
    (r.r || []).forEach((v, i) => { const it = a.itens[i]; if (!it) return; if (v === 'NA') it.na++; else if (v === 1 || v === 2 || v === 3) { it.c[v-1]++; it.n++; a.totN++; if (v === 3) a.totSim++; } });
    if (typeof r.enps === 'number') { a.enps.n++; if (r.enps <= 6) a.enps.det++; else if (r.enps >= 9) a.enps.pro++; }
    if (r.ces === 1 || r.ces === 2 || r.ces === 3) { a.ces.n++; if (r.ces === 3) a.ces.sim++; }
  });
  a.pctSim = a.totN ? Math.round(a.totSim / a.totN * 100) : null;
  // % Sim ponderado pelos pesos das frases (pesos em Configurações → Perguntas, respostas e pesos)
  let pSim = 0, pN = 0; a.itens.forEach((it, i) => { const p = (ITENS[i] && ITENS[i].peso) || 1; pSim += p * it.c[2]; pN += p * it.n; });
  a.pctSimPond = pN ? Math.round(pSim / pN * 100) : null;
  // mesmo critério da Área do avaliador: calcula a partir de 1 resposta e sinaliza quando há poucas (regra de divulgação)
  a.enpsVal = a.enps.n ? Math.round((a.enps.pro - a.enps.det) / a.enps.n * 100) : null;
  a.cesFacil = a.ces.n ? Math.round(a.ces.sim / a.ces.n * 100) : null;
  a.identificavel = a.n > 0 && a.n < N_DIVULGA_FRASE;
  a.poucasDetalhe = a.n > 0 && a.n < N_DIVULGA_DETALHE;
  a.cesPoucas = a.ces.n > 0 && a.ces.n < N_DIVULGA_DETALHE;
  return a;
}
function porUnidade(list){ const m = {}; list.forEach(r => { (m[r.unidade] = m[r.unidade] || []).push(r); }); return Object.keys(m).map(u => Object.assign({ unidade: u }, agregar(m[u]))); }
function filtrarPool(lista, cf, semUnidade){
  return lista.filter(r => {
    if (cf.rodada && rodadaDe(r) !== cf.rodada) return false;
    const data = r.data || '', mes = r.mes || data.slice(0, 7);
    if (cf.ano && mes.slice(0, 4) !== cf.ano) return false;
    if (cf.mes && mes.slice(5, 7) !== cf.mes) return false;
    if (cf.dia && data.slice(8, 10) !== cf.dia) return false;   // respostas antigas sem dia ficam fora quando se filtra por dia
    if (!semUnidade && cf.unidade && r.unidade !== cf.unidade) return false;
    return true;
  });
}
function cfDefault(){ return { rodada: settings.rodada, ano:'', mes:'', dia:'', unidade:'', ordem:'melhores', soPend:false, comp:'' }; }
function avisoUnidade(u){ return u.identificavel ? 'IDENTIFICÁVEL (1-2 respostas): uso restrito, não comparar' : (u.poucasDetalhe ? 'menos de 5 respostas: eNPS e CES não divulgar por unidade' : ''); }
function rankingTexto(units, compMap){
  return rankingLinhas(units, compMap).map(l => l.join('\t')).join('\n');
}
function rankingLinhas(units, compMap){   // cabeçalho + linhas do ranking (usado no copiar, no Excel e no PDF)
  const L = [['#','Unidade','Local (bairro)','Respostas','% Sim','% Sim ponderado','eNPS','% fácil c/ escritório','Aviso'].concat(compMap ? ['% Sim (comparação)','Diferença (pts)'] : [])];
  units.forEach((u, i) => { const c = compMap ? compMap[u.unidade] : null; L.push([i+1, u.unidade, (unidadePorCodigo(u.unidade) || {}).nome || '', u.n, u.pctSim == null ? '' : u.pctSim + '%', u.pctSimPond == null ? '' : u.pctSimPond + '%', u.enpsVal == null ? '' : u.enpsVal, u.cesFacil == null ? '' : u.cesFacil + '%', avisoUnidade(u)].concat(compMap ? [c && c.pctSim != null ? c.pctSim + '%' : '', (c && u.pctSim != null && c.pctSim != null) ? (u.pctSim - c.pctSim) : ''] : [])); });
  return L;
}
// Tudo o que a tela Consolidado e as exportações (CSV, Excel, PDF) precisam, calculado uma vez a partir dos filtros
function calcConsolidado(cf, apenasLocal){   // apenasLocal: só as respostas deste tablet (relatório da pesquisa atual), sem as importadas
  const rl = rodadas();
  if (cf.rodada && !rl.find(r => r.id === cf.rodada)) cf.rodada = settings.rodada;
  const pool = apenasLocal ? { lista: allResponses().filter(r => r.escala === ESCALA), legado: allResponses().filter(r => r.escala !== ESCALA).length } : poolConsolidado();
  const todas = pool.lista;
  const base = filtrarPool(todas, cf, true);                       // rodada + datas (sem unidade): serve à cobertura
  const filt = cf.unidade ? base.filter(r => r.unidade === cf.unidade) : base;
  const geral = agregar(filt);
  const units = porUnidade(filt);
  let compMap = null;
  if (cf.comp) { compMap = {}; porUnidade(todas.filter(r => rodadaDe(r) === cf.comp && (!cf.unidade || r.unidade === cf.unidade))).forEach(u => { compMap[u.unidade] = u; }); }
  const ord = {
    melhores: (a, b) => ((b.pctSim == null ? -1 : b.pctSim) - (a.pctSim == null ? -1 : a.pctSim)) || (b.n - a.n) || a.unidade.localeCompare(b.unidade),
    piores: (a, b) => ((a.pctSim == null ? 101 : a.pctSim) - (b.pctSim == null ? 101 : b.pctSim)) || (b.n - a.n) || a.unidade.localeCompare(b.unidade),
    respostas: (a, b) => (b.n - a.n) || a.unidade.localeCompare(b.unidade),
    nome: (a, b) => a.unidade.localeCompare(b.unidade)
  };
  units.sort(ord[cf.ordem] || ord.melhores);
  const naRodada = todas.filter(r => !cf.rodada || rodadaDe(r) === cf.rodada);
  const mesDe = r => r.mes || (r.data || '').slice(0, 7);
  const anos = [...new Set(naRodada.map(r => mesDe(r).slice(0, 4)).filter(Boolean))].sort();
  const meses = [...new Set(naRodada.filter(r => !cf.ano || mesDe(r).slice(0, 4) === cf.ano).map(r => mesDe(r).slice(5, 7)).filter(Boolean))].sort();
  const dias = [...new Set(naRodada.filter(r => r.data && (!cf.ano || r.data.slice(0, 4) === cf.ano) && (!cf.mes || r.data.slice(5, 7) === cf.mes)).map(r => r.data.slice(8, 10)))].sort();
  const unidadesOpt = [...new Set(todas.map(r => r.unidade))].sort();
  // cobertura: cadastradas × pesquisadas (dentro da rodada/datas escolhidas)
  const cad = unidades(); const pesq = new Set(base.map(r => r.unidade));
  const pendentes = cad.filter(u => !pesq.has(u.codigo));
  const naoCad = [...pesq].filter(c => !cad.find(u => u.codigo === c)).sort();
  const nBase = {}; base.forEach(r => { nBase[r.unidade] = (nBase[r.unidade] || 0) + 1; });
  const obsPorFrase = ITENS.map(() => []); const obsOutros = { enps: [], ces: [] };
  filt.forEach(r => { (r.c || []).forEach((txt, i) => { if (txt && obsPorFrase[i]) obsPorFrase[i].push(txt); }); if (r.cEnps) obsOutros.enps.push(r.cEnps); if (r.cCes) obsOutros.ces.push(r.cCes); });

// Leitor de CSV/TSV no padrão RFC 4180: respeita aspas, aspas duplas ("") e quebras de linha dentro de um campo.
function parseDelimited(text){

  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (inQ) { if (ch === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else inQ = false; } else cur += ch; }
    else if (ch === '"') inQ = true;
    else if (ch === delim) { row.push(cur); cur = ''; }
    else if (ch === '\n') { row.push(cur); rows.push(row); row = []; cur = ''; }

  if (cur !== '' || row.length) { row.push(cur); rows.push(row); }

async function sendPending(silencioso){   // em LOTE e embaralhado (anonimato): o servidor registra a hora do lote, não a de cada pessoa. O servidor ignora id repetido
  if (sending || !syncOk() || !navigator.onLine) return 0; sending = true; let enviadas = 0;
  const pend = shuffle(allResponses().filter(r => !r.sent));
  try {
    for (let i = 0; i < pend.length; i += 25) {
      const lote = pend.slice(i, i + 25); const itens = lote.map(payloadDe); let ok = false;
      try { const j = await apiPost({ op: 'add', itens }); ok = !!(j && j.ok); if (j && j.ok === false) { toast(erroServidor(j)); break; } }
      catch(e) { ok = false; }   // sem resposta legível (rede, CORS, login): NÃO marca como enviado — fica pendente e tenta de novo depois; o servidor ignora id repetido
      if (!ok) break;
      const list = allResponses(); lote.forEach(r => { const it = list.find(x => x.id === r.id); if (it) it.sent = true; }); saveResponses(list); enviadas += lote.length;
    }
  } finally { sending = false; }
  if (enviadas && !allResponses().some(r => !r.sent && r.unidade === settings.unidade && rodadaDe(r) === settings.rodada)) markExported();   // só marca "exportada" quando nada desta unidade/rodada ficou pendente
  if (state.screen === 'admin') { if (!silencioso) toast(pend.length === 0 ? 'Nada pendente para enviar.' : (enviadas === pend.length ? 'Tudo enviado para a nuvem.' : `${enviadas} enviada(s); ${pend.length - enviadas} ainda pendente(s).`)); render(); }
  return enviadas;
}
function erroServidor(j){ if (!j) return 'Resposta inesperada do servidor.'; if (j.erro === 'chave') return 'Chave de sincronização diferente da do servidor (Configurações).'; if (j.erro === 'configurar-chave') return 'O servidor ainda está com a chave de exemplo: troque CHAVE no Code.gs e implante de novo.'; return 'Resposta inesperada do servidor' + (j.erro ? ' (' + j.erro + ')' : '') + '.'; }
async function sincronizar(silencioso, tudo){   // sobe o pendente (em lote) e baixa as respostas do servidor para mp_hist (marcadas nuvem: true); depois da 1ª vez só o que é novo (desde)
  if (!syncOk()) { if (!silencioso) toast('Configure a URL e a chave do servidor em Configurações.'); return; }
  if (syncing) return; if (!navigator.onLine) { if (!silencioso) toast('Sem internet agora; tento de novo quando voltar.'); return; }
  syncing = true; if (!silencioso) toast('Atualizando da nuvem…');
  try {
    await sendPending(true);
    const incremental = !tudo && !!settings.ultimaSync; const params = { op: 'list', app: APP_ID };
    if (incremental) params.desde = new Date(new Date(settings.ultimaSync).getTime() - 15 * 60 * 1000).toISOString();   // margem de 15 min para relógios diferentes
    const j = await apiGet(params); if (!j || !j.ok) throw new Error(erroServidor(j));
    const anteriores = histResponses(); const manuais = anteriores.filter(h => !h.nuvem); const nuvem = incremental ? anteriores.filter(h => h.nuvem) : [];
    const locais = new Set(allResponses().map(r => r.id)); const manuaisIds = new Set(manuais.map(h => h.id)); const porId = new Map(nuvem.map(h => [h.id, h]));
    let novas = 0; (j.itens || []).map(registroDe).forEach(x => { if (!x || locais.has(x.id) || manuaisIds.has(x.id)) return; if (!porId.has(x.id)) novas++; porId.set(x.id, x); });
    const lista = [...porId.values()]; new Set(lista.map(x => x.rodada || 'R1')).forEach(garantirRodada);   // rodadas dos outros tablets passam a existir no filtro
    if (!LS.set('mp_hist', manuais.concat(lista))) throw new Error('Não coube na memória do tablet: exporte e apague respostas antigas.');
    settings.ultimaSync = new Date().toISOString(); saveSettings();
    let extra = ''; if (novas && state.cf && state.cf.rodada && lista.length && !lista.some(x => (x.rodada || 'R1') === state.cf.rodada)) { state.cf.rodada = ''; state.cf.comp = ''; extra = ' As respostas da nuvem são de outra rodada — o filtro de rodada foi aberto para "Todas".'; }
    if (!silencioso) toast(`Nuvem atualizada: ${novas} nova(s); ${lista.length} resposta(s) de outros aparelhos no total.${extra}`); render();
  } catch(e) { console.warn('sincronizar', e); if (!silencioso) toast(e.message || 'Não consegui falar com o servidor.'); }
  finally { syncing = false; }
}

async function shareOrDownload(name, data, mime){

    if (navigator.share && navigator.canShare) {
      const file = new File([data], name, { type: mime.split(';')[0] });
      if (navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); return true; }

  const img = wb.addImage({ base64: LOGO_B64, extension: 'png' });
  const ROXO = 'FF6B4A98', ZEBRA = 'FFF4F1F8', BRANCO = 'FFFFFFFF', CINZA = 'FF5E5670', VERMELHO = 'FF9B1C1C';
  const fill = argb => ({ type: 'pattern', pattern: 'solid', fgColor: { argb } });
  const sub = `Gerado em ${dataLabel(hojeISO())} - ${D.escopo} - Rodada atual do tablet: ${rodadaNome(settings.rodada)} - App v${VERSAO}`;
  const aviso = 'USO RESTRITO da área de Experiência do Cliente. Com menos de 3 respostas a unidade fica identificável: não divulgar por unidade nem mostrar ao encarregado ou supervisor.';
  folhas.forEach(f => {
    let aoa = f.aoa; if (f.semCab && aoa.length && aoa[0].length === 1 && aoa[0][0] === D.titulo) aoa = aoa.slice(1);   // o título já vai no topo da aba
    const ncol = Math.max(3, ...aoa.map(r => r.length)); const larg = aoa.length ? aoa[0].length : ncol;
    const ws = wb.addWorksheet(f.nome);
    (f.larguras || []).forEach((w, i) => { ws.getColumn(i + 1).width = w; });
    ws.getRow(1).height = 26; ws.getRow(2).height = 26; ws.getRow(3).height = 8;   // 2 linhas altas = ~70 px para o logo
    ws.addImage(img, { tl: { col: 0.1, row: 0.15 }, ext: { width: 268, height: 62 } });
    const mc = 10;   // título, subtítulo e aviso ocupam sempre 10 colunas (≥ 84 caracteres de largura), mesmo nas abas estreitas
    const wch = Array.from({ length: mc }, (_, i) => (f.larguras && f.larguras[i]) || 8.43).reduce((a, b) => a + b, 0);   // largura da faixa em caracteres
    const linha = (r, txt, font, h) => { ws.mergeCells(r, 1, r, mc); const c = ws.getCell(r, 1); c.value = txt; c.font = font; c.alignment = { vertical: 'middle', wrapText: true };
      const nLin = Math.max(1, Math.ceil(String(txt).length * font.size / 11 / wch)); ws.getRow(r).height = Math.max(h, nLin * font.size * 1.35 + 6); };   // altura cresce com o nº de linhas (o Excel não ajusta célula mesclada)
    linha(4, D.titulo, { name: 'Calibri', size: 15, bold: true, color: { argb: ROXO } }, 24);
    linha(5, sub, { name: 'Calibri', size: 9, italic: true, color: { argb: CINZA } }, 16);
    linha(6, aviso, { name: 'Calibri', size: 9, bold: true, color: { argb: VERMELHO } }, 30);
    ws.getRow(7).height = 5; for (let c = 1; c <= Math.max(ncol, mc); c++) ws.getCell(7, c).fill = fill(ROXO);   // faixa roxa fina
    let r = 8, zebra = 0;
    aoa.forEach((row, ri) => {
      const isCab = f.semCab ? row[0] === 'Indicador' : ri === 0; const xr = ws.getRow(r);
      if (!isCab && !f.semCab && row.length && zebra % 2 === 1) for (let c = 1; c <= larg; c++) xr.getCell(c).fill = fill(ZEBRA);
      row.forEach((v, ci) => {
        if (v === undefined || v === null) return; const c = xr.getCell(ci + 1);
        if (typeof v === 'string' && PCT_RE.test(v)) { c.value = parseInt(v, 10); c.numFmt = '0"%"'; } else c.value = v;
        if (isCab) { c.font = { name: 'Calibri', size: 11, bold: true, color: { argb: BRANCO } }; c.fill = fill(ROXO); c.alignment = { vertical: 'middle', wrapText: true }; }
      });
      if (isCab) { xr.height = 30; zebra = 0; if (!f.semCab && ri === 0) ws.autoFilter = { from: { row: r, column: 1 }, to: { row: r, column: row.length } }; } else if (row.length) zebra++;
      r++;
    });
  });
  return await wb.xlsx.writeBuffer();
}
function excelSimples(XLSX, folhas){   // reserva (SheetJS, sem logo) caso o gerador com logo não carregue
  const wb = XLSX.utils.book_new();
  folhas.forEach(f => {
    const ws = XLSX.utils.aoa_to_sheet(f.aoa);
    Object.keys(ws).forEach(a => { const c = ws[a]; if (a[0] !== '!' && c && c.t === 's' && PCT_RE.test(c.v)) { c.t = 'n'; c.v = parseInt(c.v, 10); c.z = '0"%"'; } });
    if (f.larguras) ws['!cols'] = f.larguras.map(w => ({ wch: w }));
    XLSX.utils.book_append_sheet(wb, ws, f.nome);
  });
  return XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
}
async function exportarExcel(modo){
  if (exportando) return; exportando = true;
  try { await _exportarExcel(modo); } finally { exportando = false; }
}
async function _exportarExcel(modo){
  const MIME = 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
  let D, folhas; try { D = dadosExport(modo); folhas = folhasExcel(D); } catch(e) { console.error(e); toast('Não consegui montar os dados do Excel. Tente de novo; se continuar, use o CSV.'); return; }
  toast('Preparando o Excel…');
  let out = null, comLogo = false;
  try { const EJ = await loadExcelJS(); out = await excelComLogo(EJ, D, folhas); comLogo = true; } catch(e) { console.warn('Excel com logo indisponível, gerando a versão simples', e); }
  if (!out) {
    let XLSX; try { XLSX = await loadSheetJS(); } catch(e) { toast('Para gerar o Excel é preciso internet na primeira vez. Sem internet, use o CSV.'); return; }
    try { out = excelSimples(XLSX, folhas); } catch(e) { console.error(e); toast('Não consegui gerar o Excel. Tente de novo; se continuar, use o CSV.'); return; }
  }
  try {
    const ok = await shareOrDownload(D.nome + '.xlsx', new Blob([out], { type: MIME }), MIME);
    if (ok) { toast(comLogo ? 'Excel gerado.' : 'Excel gerado (versão simples, sem logo).'); if (D.atual) { markExported(); if (state.screen === 'admin') render(); } }
  } catch(e) { console.error(e); toast('Não consegui gerar o Excel. Tente de novo; se continuar, use o CSV.'); }
}
// A fonte padrão do jsPDF (Helvetica) só tem Latin-1: símbolos e emojis (comuns nos comentários) viram texto ilegível — trocamos ou removemos
const pdfTxt = s => String(s == null ? '' : s).replace(/⚠/g, '(!)').replace(/—/g, '-').replace(/–/g, '-').replace(/·/g, '-').replace(/●/g, '*').replace(/→/g, '->').replace(/←/g, '<-').replace(/…/g, '...').replace(/[“”]/g, '"').replace(/[‘’]/g, "'").replace(/×/g, 'x').replace(/÷/g, '/').replace(/−/g, '-').replace(/✓/g, 'v').replace(/⚙/g, '')
  .replace(/[\u{1F000}-\u{1FFFF}\u{2600}-\u{27BF}\u{FE0F}\u{200D}\u{20E3}]/gu, '')   // emojis e pictogramas somem
  .replace(/[^\x09\x0A\x20-\x7E\xA0-\xFF]/g, '?');                                  // qualquer outro caractere fora do Latin-1 vira ? (acentos do português ficam)
async function exportarPdf(modo){
  if (exportando) return; exportando = true;
  try { await _exportarPdf(modo); } finally { exportando = false; }
}
async function _exportarPdf(modo){
  let jsPDF; try { toast('Preparando o PDF…'); jsPDF = await loadJsPDF(); } catch(e) { toast('Para gerar o PDF é preciso internet na primeira vez. Sem internet, use o CSV ou o texto das contagens.'); return; }
  try {
    const D = dadosExport(modo); const doc = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
    const W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight(); const cor = [107, 74, 152];   // roxo Maxipark #6B4A98
    const tabela = (titulo, aoa, opts) => {
      let y = doc.lastAutoTable && doc.lastAutoTable.finalY ? doc.lastAutoTable.finalY + 8 : 24;
      if (y > H - 40) { doc.addPage(); y = 22; }   // as páginas seguintes recebem a faixa com o logo no fim (loop final)
      doc.setFontSize(12); doc.setTextColor(cor[0], cor[1], cor[2]); doc.text(pdfTxt(titulo), 12, y); doc.setTextColor(0, 0, 0);
      const linhas = aoa.slice(1).map(r => r.map(pdfTxt));
      doc.autoTable(Object.assign({ head: [aoa[0].map(pdfTxt)], body: linhas.length ? linhas : [['(sem dados)']], startY: y + 3, margin: { top: 21, left: 12, right: 12, bottom: 14 }, styles: { fontSize: 7.5, cellPadding: 1.4, overflow: 'linebreak' }, headStyles: { fillColor: cor, textColor: 255, fontSize: 7.5 }, alternateRowStyles: { fillColor: [244, 243, 252] } }, opts || {}));
    };
    // capa / resumo (Helvetica renderiza os acentos do português; pdfTxt só troca símbolos)
    // capa com o logo em destaque (60 mm) e faixa na cor Maxipark
    try { doc.addImage('data:image/png;base64,' + LOGO_B64, 'PNG', 12, 7, 60, 13.8); } catch(e) {}
    doc.setDrawColor(cor[0], cor[1], cor[2]); doc.setLineWidth(1.2); doc.line(12, 24, W - 12, 24);
    doc.setFontSize(D.atual ? 15 : 18); doc.setTextColor(cor[0], cor[1], cor[2]);
    const tl = doc.splitTextToSize(pdfTxt(D.titulo), W - 24); const dy = (tl.length - 1) * (D.atual ? 6.1 : 7.3);   // título longo (nome de unidade importado) quebra linha e empurra o resto para baixo
    doc.text(tl, 12, 33); doc.setTextColor(0, 0, 0);
    doc.setFontSize(9.5); doc.text(pdfTxt(`Gerado em ${dataLabel(hojeISO())} - ${D.escopo} - Rodada atual do tablet: ${rodadaNome(settings.rodada)} - App v${VERSAO}`), 12, 40 + dy, { maxWidth: W - 24 });
    doc.setFontSize(8.5); doc.setTextColor(155, 28, 28); doc.text(pdfTxt('USO RESTRITO da área de Experiência do Cliente. Com menos de 3 respostas a unidade fica identificável: não divulgar por unidade nem mostrar ao encarregado ou supervisor.'), 12, 47 + dy, { maxWidth: W - 24 }); doc.setTextColor(0, 0, 0);
    doc.lastAutoTable = { finalY: 47 + dy };   // a 1ª seção começa 8 mm abaixo do aviso
    tabela('Resumo', [['Indicador', 'Valor', 'Observação']].concat(D.indicadores), { columnStyles: { 0: { cellWidth: 90 }, 1: { cellWidth: 40 } } });
    if (!D.atual) tabela('Ranking das unidades (' + pdfTxt(D.C.ordTxt) + ')', D.ranking);
    tabela(D.atual ? 'Por frase (quantos colaboradores deram cada resposta)' : 'Por frase (todas as respostas do filtro)', D.porFrase, { columnStyles: { 2: { cellWidth: 80 } } });
    if (!D.atual) { tabela('Cobertura: unidades cadastradas x pesquisadas', D.cobertura); tabela('Rodadas', D.rodadasT); }
    tabela('Perguntas, respostas e pesos em uso', D.perguntas, { columnStyles: { 2: { cellWidth: 90 } } });
    doc.addPage(); doc.lastAutoTable = { finalY: 14 };
    const nCol = D.respostas[0].length;   // última coluna = aviso por linha
    tabela('Respostas individuais (ordem embaralhada) — 3 = Sim, 2 = meio, 1 = Não, NA = não se aplica — USO RESTRITO', [['Unidade', 'Rodada', 'Data', ...ITENS.map(it => 'B' + it.n), 'eNPS', 'CES', '(!)']].concat(D.respostas.slice(1).map(r => [r[3], r[7], r[6] ? dataLabel(r[6]) : r[5], ...r.slice(8, 8 + ITENS.length + 2), r[nCol - 1] ? '(!)' : ''])), { styles: { fontSize: 7, cellPadding: 1 } });
    tabela('Comentários e respostas abertas (ordem embaralhada) — USO RESTRITO', D.comentarios, { columnStyles: { 0: { cellWidth: 62 }, 4: { cellWidth: 100 }, 5: { cellWidth: 40 } } });
    const total = doc.internal.getNumberOfPages();
    const rodape = pdfTxt(`${D.titulo}${D.atual ? '' : ' - ' + D.escopo} - gerado em ${dataLabel(hojeISO())} - USO RESTRITO da área de Experiência do Cliente`);   // no modo 'atual' o título já traz unidade e rodada
    const tituloFaixa = doc.splitTextToSize(pdfTxt(D.titulo), W - 72)[0];   // uma linha só, sem invadir o logo (termina em x = 52 mm)
    for (let p = 1; p <= total; p++) { doc.setPage(p); doc.setFontSize(7.5); doc.setTextColor(120, 120, 120); const lr = doc.splitTextToSize(rodape, W - 60); doc.text(lr, 12, H - 6 - 3.04 * (lr.length - 1)); doc.text(pdfTxt(`página ${p} de ${total}`), W - 12, H - 6, { align: 'right' }); if (p > 1) { try { doc.addImage('data:image/png;base64,' + LOGO_B64, 'PNG', 12, 5, 40, 9.2); doc.setDrawColor(cor[0], cor[1], cor[2]); doc.setLineWidth(0.8); doc.line(12, 16.5, W - 12, 16.5); doc.setFontSize(8); doc.setTextColor(cor[0], cor[1], cor[2]); doc.text(tituloFaixa, W - 12, 12, { align: 'right' }); } catch(e) {} } }   // logo em destaque + faixa em todas as páginas; rodapé longo cresce para cima, nunca sai da página
    const blob = doc.output('blob');
    const ok = await shareOrDownload(D.nome + '.pdf', blob, 'application/pdf');
    if (ok) { toast('PDF gerado.'); if (D.atual) { markExported(); if (state.screen === 'admin') render(); } }
  } catch(e) { console.error(e); toast('Não consegui gerar o PDF. Tente de novo; se continuar, use o CSV ou o texto das contagens.'); }
}

    }
    case 'importhist': document.getElementById('file-hist').click(); break;
    case 'csvcons': { const cf = state.cf || cfDefault(); const lst = filtrarPool(poolConsolidado().lista, cf, false); shareOrDownload(nomeExport(cf) + '.csv', csvText(lst)); break; }
    case 'copycons': {
      const cf = state.cf || cfDefault(); const pool = poolConsolidado().lista; const filt = filtrarPool(pool, cf, false); const units = porUnidade(filt);
      let compMap = null; if (cf.comp) { compMap = {}; porUnidade(pool.filter(r => rodadaDe(r) === cf.comp && (!cf.unidade || r.unidade === cf.unidade))).forEach(u => { compMap[u.unidade] = u; }); }
      const ordem = { melhores: (a, b) => ((b.pctSim == null ? -1 : b.pctSim) - (a.pctSim == null ? -1 : a.pctSim)) || (b.n - a.n), piores: (a, b) => ((a.pctSim == null ? 101 : a.pctSim) - (b.pctSim == null ? 101 : b.pctSim)) || (b.n - a.n), respostas: (a, b) => b.n - a.n, nome: (a, b) => a.unidade.localeCompare(b.unidade) };
      units.sort(ordem[cf.ordem] || ordem.melhores);
      const txt = rankingTexto(units, compMap);
      (async () => { try { await navigator.clipboard.writeText(txt); toast('Ranking copiado.'); } catch(e) { go('text', { showText: txt, textReturn: 'consolidado' }); toast('Toque e segure no texto para copiar.'); } })();
      break;
    }
    case 'zerartudo': {
      const n = allResponses().length + histResponses().length;
      // duas etapas: pergunta Sim/Não e, depois, o PIN do avaliador (pedido do gestor)
      askConfirm(`Zerar TODO o histórico deste tablet? Somem ${n} resposta(s) de todas as unidades e rodadas, as recusas, as rodadas e as respostas importadas. O PIN e a lista de unidades ficam. Isso não tem volta. Se confirmar, o app ainda vai pedir a senha de zerar.`, () => { state.pin = ''; state.pinTarget = 'zerar'; state.pinFin = false; go('pin'); });
      break;
    }
    case 'wipehist': askConfirm(`Apagar as ${histResponses().length} respostas importadas de outros tablets? As deste tablet não são afetadas.`, () => { LS.set('mp_hist', []); toast('Importadas apagadas.'); go('consolidado'); }); break;
    case 'tocollect': go(homeScreen()); break;
    case 'tosetup': go('setup'); break;
    case 'copy': copyText(tallyText(tally(list()))); break;
    case 'showtext': go('text', { showText: tallyText(tally(list())), textReturn: 'admin' }); break;
    case 'csv': exportCsv(); break;
    case 'mail': {
      const t = tally(list());
      const restrito = t.identificavel || t.poucasDetalhe;   // poucas respostas: o e-mail carrega respostas quase individuais
      const subject = (restrito ? 'RESTRITO Experiência do Cliente - ' : '') + `Pesquisa equipe Maxipark - ${settings.unidade} - ${rodadaNome(settings.rodada)} - ${settings.data ? dataLabel(settings.data) : mesLabel(settings.mes)}`;
      const body = (restrito ? 'USO RESTRITO da área de Experiência do Cliente: não encaminhe ao encarregado nem ao supervisor; não divulgue por unidade.\n\n' : '') + tallyText(t).replace(/\t/g, ' | ') + '\n\n(O arquivo com as respostas sai pelo botão "arquivo de respostas" no tablet.)';
      location.href = 'mailto:?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body);
      toast('Depois de enviar o e-mail, exporte também o arquivo de respostas.');
      break;   // sem markExported(): o e-mail pode ter sido cancelado
    }
    case 'resend': sendPending(false); break;
    case 'wipe': {
      const n = list().length;
      const aviso = settings.exported[key()] ? '' : ' ATENÇÃO: estas respostas ainda NÃO foram exportadas.';
      askConfirm(`Apagar as ${n} respostas de ${settings.unidade} · ${rodadaNome(settings.rodada)} deste tablet?${aviso}`, () => {
        saveResponses(allResponses().filter(r => !(r.unidade === settings.unidade && rodadaDe(r) === settings.rodada)));
        const m = LS.get('mp_recusas', {}); delete m[key()]; LS.set('mp_recusas', m);
        delete settings.exported[key()]; saveSettings();
        toast('Respostas apagadas.'); go('admin', { notice: '' });
      });
      break;
    }
    case 'wipeothers': {
      const others = otherKeys();
      const naoExp = Object.keys(others).filter(k => !settings.exported[k]);
      const aviso = naoExp.length ? ` ATENÇÃO: ainda NÃO exportadas: ${naoExp.map(keyLabel).join(', ')}.` : '';
      askConfirm(`Apagar as respostas de OUTRAS unidades e rodadas deste tablet (${Object.keys(others).map(keyLabel).join(', ')})? Elas somem do Consolidado deste aparelho.${aviso}`, () => {
        saveResponses(allResponses().filter(r => r.unidade === settings.unidade && rodadaDe(r) === settings.rodada));
        const m = LS.get('mp_recusas', {}); Object.keys(m).forEach(k => { if (k !== key()) delete m[k]; }); LS.set('mp_recusas', m);
        Object.keys(settings.exported).forEach(k => { if (k !== key()) delete settings.exported[k]; }); saveSettings();
        toast('Outras respostas apagadas.'); go('admin', { notice: '' });
      });
      break;
    }
    case 'savesettings': {
      const u = readUnitInput('s');
      const w = document.getElementById('s-webhook').value.trim(); const ch = (document.getElementById('s-chave') || { value: '' }).value.trim();
      if (!u) { toast('Escolha a unidade.'); return; }
      if (w && !/^https?:\/\//i.test(w)) { toast('A URL do servidor deve começar com https://'); return; }
      if (w && !ch) { toast('Digite também a chave de sincronização.'); return; }
      const rd = document.getElementById('s-rodada');
      if (rd && rd.value && rd.value !== settings.rodada) { const l = rodadas(); const alvo = l.find(r => r.id === rd.value); if (alvo) { alvo.fim = ''; saveRodadas(l); settings.rodada = alvo.id; if (state.cf) state.cf.rodada = alvo.id; } }
      if (w !== settings.webhook) { settings.ultimaSync = ''; LS.set('mp_hist', histResponses().filter(h => !h.nuvem)); }   // trocou de servidor: esquece o que veio do antigo
      settings.unidade = u; fixarData(); settings.webhook = w; settings.chave = ch; saveSettings();
      toast('Configurações salvas.'); go('admin', { notice: '' }); break;
    }
  }
}

function advance(){
  if (!current) return;
  captureObs();
  if (state.screen === 'q') {
    if (current.r[state.q] == null) return;
    if (state.q < ITENS.length - 1) go('q', { q: state.q + 1 }); else go('enps');
  } else if (state.screen === 'enps') { if (current.enps == null) return; go('ces'); }
  else if (state.screen === 'ces') { if (current.ces == null) return; go('open', { q: 0 }); }
  else if (state.screen === 'open') {
    const ta = document.getElementById('f-open');
    const v = ta ? ta.value.trim().slice(0, 600) : '';
    if (state.q === 0) { current.a1 = v; go('open', { q: 1 }); } else { current.a2 = v; submitCurrent(); }
  }
}
function back(){
  if (!current) return;
  captureObs();
  if (state.screen === 'q') { if (state.q > 0) go('q', { q: state.q - 1 }); }
  else if (state.screen === 'enps') go('q', { q: ITENS.length - 1 });
  else if (state.screen === 'ces') go('enps');
  else if (state.screen === 'open') {
    const ta = document.getElementById('f-open'); const v = ta ? ta.value.trim().slice(0, 600) : '';
    if (state.q === 0) { current.a1 = v; go('ces'); } else { current.a2 = v; go('open', { q: 0 }); }
  }
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el || el.disabled) return;
  handle(el.getAttribute('data-action'), el);
});
// PIN e senhas: além do teclado da tela, dá para digitar num campo (teclado do tablet ou físico); Enter = OK
function stubKey(k){ return { getAttribute: () => k }; }
document.addEventListener('keydown', e => {
  if (state.screen !== 'pin' && state.screen !== 'setpin') return;
  const action = state.screen === 'pin' ? 'pinkey' : 'newpinkey';
  const noCampo = e.target && (e.target.id === 'pin-input' || e.target.id === 'newpin-input');
  if (e.key === 'Enter') { if (e.target && e.target.tagName === 'BUTTON') return; e.preventDefault(); handle(action, stubKey('OK')); return; }   // Enter num botão (ex.: Cancelar) segue o botão
  if (noCampo) return;   // dígitos digitados no campo entram pelo evento 'input'
  if (/^[0-9]$/.test(e.key)) { e.preventDefault(); handle(action, stubKey(e.key)); }
  else if (e.key === 'Backspace') { e.preventDefault(); handle(action, stubKey('←')); }
});
document.addEventListener('input', e => {
  if (e.target && (e.target.id === 'pin-input' || e.target.id === 'newpin-input')) {
    const v = e.target.value.replace(/\D/g, '').slice(0, 8); e.target.value = v;
    if (e.target.id === 'pin-input') state.pin = v; else state.newPin = v;
    return;
  }
  if (e.target && e.target.id === 'f-obs') { captureObs(); return; }   // comentário da página: guarda enquanto digita, sem redesenhar
  if (e.target && e.target.id === 'u-filtro') {
    state.filtro = e.target.value;
    const pos = e.target.selectionStart; render();
    const el = document.getElementById('u-filtro'); if (el) { el.focus(); try { el.setSelectionRange(pos, pos); } catch(err) {} }
  }
});
document.getElementById('file-unidades').addEventListener('change', e => { const f = e.target.files && e.target.files[0]; if (f) importFile(f); e.target.value = ''; });
document.getElementById('file-hist').addEventListener('change', e => { const fs = e.target.files ? [...e.target.files] : []; if (fs.length) importHist(fs); e.target.value = ''; });
document.getElementById('file-pergs').addEventListener('change', e => { const f = e.target.files && e.target.files[0]; if (f) importarPerguntas(f); e.target.value = ''; });
document.addEventListener('change', e => {   // filtros do Consolidado
  const el = e.target && e.target.closest ? e.target.closest('[data-cf]') : null;
  if (!el || !state.cf || state.screen !== 'consolidado') return;
  const k = el.getAttribute('data-cf');
  state.cf[k] = el.type === 'checkbox' ? el.checked : el.value;
  if (k === 'rodada') { state.cf.ano = ''; state.cf.mes = ''; state.cf.dia = ''; if (state.cf.comp === state.cf.rodada) state.cf.comp = ''; }
  if (k === 'ano') { state.cf.mes = ''; state.cf.dia = ''; }
  if (k === 'mes') state.cf.dia = '';
  render();
});
['touchstart','keydown','input'].forEach(ev => document.addEventListener(ev, () => armIdle(), { passive: true }));
// Botão/gesto "voltar" do Android: não sai do app; age como o "Voltar" da tela.
history.pushState({ app: 1 }, '');
window.addEventListener('popstate', () => { history.pushState({ app: 1 }, ''); });   // gesto "voltar" do Android: não sai do app e não volta de página (sem botão Voltar)
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; if (state.screen === 'setup') render(); });
if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) { navigator.serviceWorker.register('../sw.js').catch(() => {}); }
state.screen = 'setup';   // abre SEMPRE em "Preparar a coleta" (escolher/confirmar a unidade), como as outras pesquisas; homeScreen() continua valendo dentro do app (idle, cancelar, voltar à coleta)
render();
</script>
