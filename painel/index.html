<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Painel de resultados Maxipark</title>
<meta name="theme-color" content="#6B4A98">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Painel Maxipark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="../icon-192.png">
<link rel="icon" href="../icon-192.png">
<style>
  :root{
    --roxo:#6B4A98; --roxo-escuro:#4E3572; --roxo-claro:#EEE8F5; --acento:#9935F4; --bg:#F5F3F9; --card:#FFFFFF;
    --texto:#221C2E; --cinza:#5E5670; --linha:#DED8EA; --perigo:#B23A3A; --ok:#2E7D32; --raio:18px;
    color-scheme: light;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%;background:var(--bg);color:var(--texto);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:17px;line-height:1.35}
  button{font-family:inherit;color:var(--texto)}
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 18px;background:#fff;border-bottom:3px solid var(--roxo)}
  .top .marca{display:flex;align-items:center;gap:12px;font-weight:700;color:var(--roxo-escuro);font-size:17px}
  .top .marca img{height:40px;width:auto}
  .top .passo{font-size:15px;color:var(--roxo-escuro);font-weight:600;text-align:right}
  .wrap{max-width:1180px;margin:0 auto;padding:16px 18px 60px}
  .card{background:var(--card);border-radius:var(--raio);padding:20px 22px;box-shadow:0 2px 10px rgba(34,28,46,.06);margin-bottom:16px}
  h1{font-size:26px;line-height:1.2;margin:0 0 10px;color:var(--roxo-escuro)}
  h2{font-size:21px;line-height:1.25;margin:0 0 10px;color:var(--roxo-escuro)}
  h3{font-size:18px;margin:16px 0 8px;color:var(--roxo-escuro)}
  p{margin:0 0 12px}
  .small{font-size:14px} .muted{color:var(--cinza)} .legenda{font-size:13px;color:var(--cinza);margin:6px 0 0}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:10px 20px;border:0;border-radius:14px;background:var(--roxo);color:#fff;font-size:18px;font-weight:700;cursor:pointer}
  .btn:disabled{opacity:.4;cursor:default}
  .btn.ghost{background:var(--roxo-claro);color:var(--roxo-escuro)} .btn.light{background:#fff;border:2px solid var(--roxo);color:var(--roxo-escuro)}
  .btn.perigo{background:var(--perigo)} .btn.block{width:100%} .btn.mini{min-height:38px;font-size:14px;padding:6px 12px;white-space:nowrap;flex:none}
  .linha{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px;align-items:center} .espaco{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
  textarea,input,select{width:100%;font:inherit;font-size:17px;padding:10px 12px;border:2px solid var(--linha);border-radius:12px;background:#fff;color:var(--texto)}
  label{display:block;font-weight:600;margin:14px 0 6px}
  .check{display:flex;gap:12px;align-items:flex-start;font-weight:500;margin:12px 0 4px;font-size:16px} .check input{width:26px;height:26px;margin-top:2px;flex:none}
  .logo-hero{display:flex;justify-content:center;margin:2px 0 14px} .logo-hero img{height:64px;width:auto;max-width:80%}
  a.home{display:inline-flex;align-items:center;border-radius:8px} a.home:active{opacity:.7}
  a.link{color:var(--roxo-escuro);font-weight:600}
  .grade{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));gap:16px}
  .bloco{border:1px solid var(--linha);border-radius:16px;padding:14px 16px;background:#fff}
  .bloco .cab{display:flex;align-items:center;gap:10px;margin-bottom:8px} .bloco .cab .ic{width:40px;height:40px;border-radius:12px;background:var(--roxo-claro);display:flex;align-items:center;justify-content:center;font-size:22px}
  .bloco h2{margin:0;font-size:19px} .bloco .sub{font-size:13px;color:var(--cinza)}
  .kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:8px 0}
  .kpi div{background:var(--roxo-claro);border-radius:12px;padding:10px 8px;text-align:center} .kpi b{display:block;font-size:26px;color:var(--roxo-escuro);line-height:1.1} .kpi span{font-size:12px;color:var(--cinza);display:block;margin-top:3px}
  table{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0} th,td{padding:7px 8px;border-bottom:1px solid var(--linha);text-align:center;vertical-align:middle} th{background:var(--roxo-claro);color:var(--roxo-escuro);font-size:13px} td.l,th.l{text-align:left}
  .tabela-wrap{overflow-x:auto}
  .mini{height:10px;background:var(--roxo-claro);border-radius:6px;overflow:hidden;min-width:70px;display:inline-block;vertical-align:middle;width:90px} .mini i{display:block;height:100%;background:var(--roxo)} .mini.acento i{background:var(--acento)}
  .tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:700} .tag.ok{background:#E6F4EA;color:#1B5E20} .tag.pend{background:#FFF4D6;color:#7A5A00} .tag.ruim{background:#FBE3E3;color:#7A1F1F}
  .aviso{background:#FFF4D6;border-left:5px solid #E0B400;padding:10px 14px;border-radius:8px;font-size:15px;margin:10px 0}
  .ruim{background:#FBE3E3;border-left:5px solid var(--perigo);padding:10px 14px;border-radius:8px;font-size:15px;margin:10px 0}
  .bom{background:#E6F4EA;border:1px solid #9CCFA9;border-radius:12px;padding:12px 14px;margin:10px 0 14px;font-size:16px;color:#1B3D26}
  .filtros{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin:8px 0} .filtros label{margin:0 0 4px;font-size:13px;color:var(--cinza)} .filtros select{font-size:16px;padding:8px 10px}
  .grafico{width:100%;min-width:600px;height:auto;display:block;margin:6px 0} .rot{font-size:11px;fill:var(--cinza)}
  .legenda-graf{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--cinza)} .legitem i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:6px}
  .pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:320px;margin:12px auto} .pinpad button{min-height:64px;font-size:26px;border-radius:14px;border:2px solid var(--linha);background:#fff}
  .pininput{display:block;max-width:320px;margin:8px auto 6px;text-align:center;font-size:30px;letter-spacing:12px;min-height:60px;-webkit-text-security:disc}
  details{margin:8px 0 14px} details summary{color:var(--roxo-escuro);cursor:pointer;font-weight:600}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#221C2E;color:#fff;padding:12px 18px;border-radius:12px;font-size:16px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center;z-index:9}
  .toast.show{opacity:1}
  @media (max-width:640px){ .wrap{padding:12px 12px 60px} .card{padding:16px} h1{font-size:22px} .kpi b{font-size:22px} }
  @media print{ .top,.btn,.filtros,.rodape-acoes{display:none !important} .card{box-shadow:none;border:1px solid var(--linha)} }
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script>
'use strict';
/* =========================================================
   PAINEL DE RESULTADOS — Maxipark
   Junta as três pesquisas do site (equipe/, cliente/, conselho/) numa visão só: indicadores gerais, tabela por unidade,
   tendência mensal, detalhes por pesquisa, Excel e PDF únicos. Fontes: as respostas guardadas NESTE aparelho pelos três
   apps (mesma origem → mesmo localStorage) + a nuvem (servidor/Code.gs, as três abas), com a mesma URL e chave dos apps.
   As contas repetem as de cada app (mesmos pesos, mesma regra de positivo). Área protegida por PIN. LEIA-ME, seção 13.
   ========================================================= */
const VERSAO = '1.0.0';
const PIN_PADRAO = '2819';

/* ---------- acesso vindo da pagina inicial (#a=...) ---------- */
const ESCOPO = (() => {
  try {
    const m = /[#&]a=([A-Za-z0-9\-_]+)/.exec(location.hash || '');
    if (!m) return null;
    let b = m[1].replace(/-/g, '+').replace(/_/g, '/');
    while (b.length % 4) b += '=';
    const j = JSON.parse(decodeURIComponent(escape(atob(b))));
    if (!j || !j.e) return null;
    return {
      nome: j.n || j.e, email: j.e, papel: j.p || 'total',
      pesquisas: Array.isArray(j.q) ? j.q : ['clientes', 'equipe', 'conselho'],
      unidades: (!j.u || j.u === 'todas') ? null : (Array.isArray(j.u) ? j.u : [j.u])
    };
  } catch (e) { return null; }
})();
function escNormU(x){ return String(x == null ? '' : x).toLowerCase().replace(/[^0-9a-zà-ú]+/g, ''); }
function unidadesPermitidas(opts){
  if (!ESCOPO || !ESCOPO.unidades) return opts;
  const alvo = ESCOPO.unidades.map(escNormU);
  const alvoN = alvo.map(a => a.replace(/\D/g, '')).filter(Boolean);
  return (opts || []).filter(o => {
    const n = escNormU(o), d = n.replace(/\D/g, '');
    return alvo.indexOf(n) >= 0 || (d && alvoN.indexOf(d) >= 0);
  });
}
function unidadesDoPool(){
  try {
    const P = pool();
    return [...new Set((P.equipe || []).map(r => r.unidade).concat((P.clientes || []).map(r => r.unidade)))].filter(Boolean).sort();
  } catch (e) { return []; }
}
function travaUnidade(cf){
  if (!ESCOPO || !ESCOPO.unidades) return;
  const perm = unidadesPermitidas(unidadesDoPool());
  if (!perm.length) { cf.unidade = '\u0000sem-unidade'; return; }
  if (perm.indexOf(cf.unidade) < 0) cf.unidade = perm[0];
}

const N_IDENT = 3, N_POUCAS = 5;   // regras de divulgação iguais às dos apps

const LS = { get(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch(e){ return d; } }, set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch(e){ return false; } } };
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c])); }
function hojeISO(d){ d = d || new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function dataLabel(iso){ if (!iso || iso.length < 10) return iso || ''; return iso.slice(8, 10) + '/' + iso.slice(5, 7) + '/' + iso.slice(0, 4); }
function mesLabel(m){ if (!m || m.length < 7) return m || ''; const n = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez']; return n[parseInt(m.slice(5, 7), 10) - 1] + '/' + m.slice(0, 4); }
function num(v){ return typeof v === 'number' && !isNaN(v); }
function pct(v){ return v == null ? '—' : v + '%'; }
function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
let toastT; function toast(m){ const t = document.getElementById('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 3400); }

/* ---------------- pesos e nomes editados nos apps (valem os deste aparelho) ---------------- */
function eqItens(){ const o = LS.get('mp_itens', null); return EQ.itens.map((it, i) => { const x = o && Array.isArray(o.itens) ? o.itens[i] : null; const p = x ? parseInt(x.peso, 10) : NaN; return { dim: (x && x.dim) || it.dim, t: (x && x.t) || it.t, p: (p >= 1 && p <= 3) ? p : it.p }; }); }
function clFatores(){ const c = LS.get('mpc_perguntas', null) || {}; const s = c.q || {}; return CL.fatores.map(f => { const p = parseInt((s[f.c] || {}).peso, 10); return { c: f.c, f: f.f, p: (p >= 1 && p <= 3) ? p : f.p }; }); }
function coCfg(){ const c = LS.get('mpco_perguntas', null) || {}; const s = c.q || {}; const cc = c.conselheiros || {}; const peso = (cod, d) => { const p = parseInt((s[cod] || {}).peso, 10); return (p >= 1 && p <= 3) ? p : d; };
  return { r8: c.r8 === true, reuniao: CO.reuniao.map(q => ({ c: q.c, f: q.f, p: peso(q.c, q.p) })), conselheiros: CO.conselheiros.map(x => ({ c: x.c, nome: (cc[x.c] && typeof cc[x.c].nome === 'string' && cc[x.c].nome.trim()) || x.nome })), pesoCrit: (cs, n, d) => peso(cs + n, d) }; }

/* ---------------- fontes: este aparelho + nuvem ---------------- */
function locais(){ return { equipe: (LS.get('mp_respostas', []) || []).concat(LS.get('mp_hist', []) || []), clientes: (LS.get('mpc_respostas', []) || []).concat(LS.get('mpc_hist', []) || []), conselho: (LS.get('mpco_respostas', []) || []).concat(LS.get('mpco_hist', []) || []) }; }
function nuvem(){ const n = LS.get('mpp_nuvem', {}) || {}; return { equipe: n.equipe || [], clientes: n.clientes || [], conselho: n.conselho || [] }; }
let poolCache = null;
function pool(){
  const P = poolBruto();
  if (!ESCOPO || ESCOPO.papel === 'total' || ESCOPO.papel === 'admin') return P;
  const ok = k => (ESCOPO.pesquisas || []).indexOf(k) >= 0;
  return { origem: P.origem,
    equipe:   ok('equipe')   ? P.equipe   : [],
    clientes: ok('clientes') ? P.clientes : [],
    conselho: ok('conselho') ? P.conselho : [] };
}
function poolBruto(){
  if (poolCache) return poolCache;
  if (DEMO) { poolCache = demoPool(); return poolCache; }
  const loc = locais(), nv = nuvem(); const out = { origem: {} };
  ['equipe', 'clientes', 'conselho'].forEach(k => { const seen = new Set(); out[k] = []; let nLoc = 0, nNuv = 0; (loc[k] || []).forEach(r => { if (!r || !r.id || seen.has(r.id)) return; seen.add(r.id); out[k].push(r); nLoc++; }); (nv[k] || []).forEach(r => { if (!r || !r.id || seen.has(r.id)) return; seen.add(r.id); out[k].push(r); nNuv++; }); out.origem[k] = { aparelho: nLoc, nuvem: nNuv }; });
  poolCache = out; return out;
}
function invalidar(){ poolCache = null; }

/* conversão do que vem do servidor (igual ao registroDe de cada app; o painel nunca guarda contato de cliente) */
function numOuNA(v){ return (v === 'NA' || v === 'NP') ? v : ((v === '' || v === null || v === undefined) ? undefined : (isNaN(parseInt(v, 10)) ? v : parseInt(v, 10))); }
function registroEq(p){ if (!p || !p.id) return null; const resp = Array.isArray(p.respostas) ? p.respostas.map(numOuNA) : (typeof p.respostas === 'string' && p.respostas ? p.respostas.split(/\s*\|\s*/).map(numOuNA) : []);
  return { id: String(p.id), versao: p.versao || '', escala: p.escala || 'B5', unidade: String(p.unidade || '').toUpperCase(), mes: p.mes || '', data: p.data || '', rodada: p.rodada || 'R1', r: resp, enps: numOuNA(p.enps), ces: numOuNA(p.ces), a1: p.aberta1 || '', a2: p.aberta2 || '', nuvem: true }; }
function registroCl(p){ if (!p || !p.id) return null; const r = {}; CL.cols.forEach(k => { let v = p[k]; if (v === undefined || v === null || v === '') return; if ((CL.numericas.includes(k) || k === 'lgpd') && v !== 'NA') { const n = parseInt(v, 10); v = isNaN(n) ? v : n; } r[k] = v; }); r.contato = ''; r.coment = r.coment || '';
  const escv = parseInt(p.esc, 10); const ver = p.ver || 'C1'; return { id: String(p.id), versao: p.versao || '', ver, esc: (escv === 3 || escv === 5) ? escv : (ver === 'C1' ? 5 : undefined), unidade: String(p.unidade || '').toUpperCase(), ponto: p.ponto || '', data: p.data || '', hora: p.hora || '', r, nuvem: true }; }
function registroCo(p){ if (!p || !p.id) return null; const r = {}; CO.cols.forEach(k => { let v = p[k]; if (v === undefined || v === null || v === '') return; if (k !== 'mais' && k !== 'mudar' && v !== 'NA') { const n = parseInt(v, 10); v = isNaN(n) ? v : n; } r[k] = v; }); r.mais = r.mais || ''; r.mudar = r.mudar || '';
  const escv = parseInt(p.esc, 10); const unidade = String(p.unidade || ''); if (p.reuniao && unidade && !nomeReuniao(unidade)) { const m = LS.get('mpco_reunioes', {}) || {}; m[unidade] = String(p.reuniao); LS.set('mpco_reunioes', m); }
  const out = { id: String(p.id), versao: p.versao || '', ver: p.ver || 'B1', esc: (escv === 3 || escv === 5) ? escv : undefined, unidade, reuniao: p.reuniao || '', data: p.data || '', r, nuvem: true }; if (typeof p.presentes === 'string') out.presentes = p.presentes; if (typeof p.avaliados === 'string') out.avaliados = p.avaliados; return out; }

/* ---------------- contas (as mesmas de cada app) ---------------- */
function positivo(v, e){ return num(v) && (e === 3 ? v === 3 : v >= 4); }
function negativo(v, e){ return num(v) && (e === 3 ? v === 1 : v <= 2); }
function escPadraoCl(){ return ((LS.get('mpc_perguntas', null) || {}).esc === 5) ? 5 : 3; }   // a escala configurada no app de clientes deste aparelho (ESC)
function escPadraoCo(){ return ((LS.get('mpco_perguntas', null) || {}).esc === 5) ? 5 : 3; }  // idem, app do conselho
function escDeCl(r){ return (r.esc === 3 || r.esc === 5) ? r.esc : (r.ver === 'C1' ? 5 : escPadraoCl()); }
function escDeCo(r){ return (r.esc === 3 || r.esc === 5) ? r.esc : escPadraoCo(); }
function temProblema(x){ return !!x.prob && x.prob !== 'nenhum' && x.prob !== 'NA'; }
function agEquipe(list){
  const itens = eqItens(); const a = { n: list.length, totSim: 0, totN: 0, enps: { n: 0, pro: 0, det: 0 }, ces: { n: 0, sim: 0 }, itens: itens.map(it => ({ dim: it.dim, t: it.t, p: it.p, c: [0, 0, 0], na: 0, n: 0 })), unidades: new Set() };
  list.forEach(r => { a.unidades.add(r.unidade); (r.r || []).forEach((v, i) => { const it = a.itens[i]; if (!it) return; if (v === 'NA') it.na++; else if (v === 1 || v === 2 || v === 3) { it.c[v - 1]++; it.n++; a.totN++; if (v === 3) a.totSim++; } });
    if (typeof r.enps === 'number') { a.enps.n++; if (r.enps <= 6) a.enps.det++; else if (r.enps >= 9) a.enps.pro++; }
    if (r.ces === 1 || r.ces === 2 || r.ces === 3) { a.ces.n++; if (r.ces === 3) a.ces.sim++; } });
  a.pctSim = a.totN ? Math.round(a.totSim / a.totN * 100) : null;
  let pS = 0, pN = 0; a.itens.forEach(it => { pS += it.p * it.c[2]; pN += it.p * it.n; it.pctSim = it.n ? Math.round(it.c[2] / it.n * 100) : null; it.pctNao = it.n ? Math.round(it.c[0] / it.n * 100) : null; });
  a.pctSimPond = pN ? Math.round(pS / pN * 100) : null;
  a.enpsVal = a.enps.n ? Math.round((a.enps.pro - a.enps.det) / a.enps.n * 100) : null;
  a.cesFacil = a.ces.n ? Math.round(a.ces.sim / a.ces.n * 100) : null;
  a.nUnid = a.unidades.size; a.identificavel = a.n > 0 && a.n < N_IDENT; a.poucas = a.n > 0 && a.n < N_POUCAS;
  return a;
}
function agClientes(list){
  const fat = clFatores(); const g = { n: list.length, unidades: new Set(list.map(r => r.unidade)), problemas: {}, resolv: {}, tipos: {} }; const rr = list.map(r => r.r || {});
  const npsV = rr.map(x => x.nps).filter(num); g.npsN = npsV.length; g.nps = npsV.length ? Math.round((npsV.filter(v => v >= 9).length - npsV.filter(v => v <= 6).length) / npsV.length * 100) : null;
  const cs = list.filter(r => num((r.r || {}).csat)); g.csatN = cs.length; g.csat = cs.length ? Math.round(cs.filter(r => positivo(r.r.csat, escDeCl(r))).length / cs.length * 100) : null;
  let pn = 0, pd = 0; g.fatores = fat.map(f => { const xs = list.filter(r => num((r.r || {})[f.c])); const na = list.filter(r => (r.r || {})[f.c] === 'NA').length; const pos = xs.filter(r => positivo(r.r[f.c], escDeCl(r))).length; const neg = xs.filter(r => negativo(r.r[f.c], escDeCl(r))).length; pn += f.p * pos; pd += f.p * xs.length; return { c: f.c, f: f.f, p: f.p, n: xs.length, na, pct: xs.length ? Math.round(pos / xs.length * 100) : null, neg: xs.length ? Math.round(neg / xs.length * 100) : null }; });
  g.pond = pd ? Math.round(pn / pd * 100) : null;
  Object.keys(CL.problemas).forEach(k => { g.problemas[k] = 0; }); Object.keys(CL.resolv).forEach(k => { g.resolv[k] = 0; });
  rr.forEach(x => { if (x.prob && x.prob !== 'NA') g.problemas[x.prob] = (g.problemas[x.prob] || 0) + 1; if (x.resolv && x.resolv !== 'NA') g.resolv[x.resolv] = (g.resolv[x.resolv] || 0) + 1; if (x.tipo && x.tipo !== 'NA') g.tipos[x.tipo] = (g.tipos[x.tipo] || 0) + 1; });
  g.comProblema = rr.filter(temProblema).length; g.pctProblema = g.n ? Math.round(g.comProblema / g.n * 100) : null;
  g.resolvidoHora = g.comProblema ? Math.round((g.resolv.sim || 0) / g.comProblema * 100) : null;
  const cesL = list.filter(r => { const x = r.r || {}; return temProblema(x) && ['sim', 'parcial', 'nao'].includes(x.resolv) && num(x.ces); }); g.cesN = cesL.length; g.ces = cesL.length ? Math.round(cesL.filter(r => positivo(r.r.ces, escDeCl(r))).length / cesL.length * 100) : null;
  g.pediramRetorno = rr.filter(x => x.lgpd === 1).length; g.nUnid = g.unidades.size;
  return g;
}
function coAvaliados(r, cons){ if (typeof r.avaliados === 'string') return r.avaliados.split(' ').filter(Boolean); if (typeof r.presentes === 'string') return r.presentes.split(' ').filter(Boolean); return cons.filter(cs => CO.criterios.some(cr => num((r.r || {})[cs.c + cr.n]))).map(cs => cs.c); }
function agConselho(list){
  const cfg = coCfg(); const g = { n: list.length, reunioes: [...new Set(list.map(r => r.unidade))].filter(Boolean).sort(), blocos: {}, nBloco: {}, itens: [], nota: null, notaN: 0, nota9: null, conselheiros: cfg.conselheiros };
  const itensDef = cfg.reuniao.filter(q => q.c !== 'r8' || cfg.r8).map(q => ({ c: q.c, bloco: 'reuniao', f: q.f, p: q.p })).concat(cfg.conselheiros.flatMap(cs => CO.criterios.map(cr => ({ c: cs.c + cr.n, bloco: cs.c, f: cr.f, p: cfg.pesoCrit(cs.c, cr.n, cr.p) }))));
  const pond = {}; cfg.conselheiros.forEach(cs => { g.nBloco[cs.c] = list.filter(r => coAvaliados(r, cfg.conselheiros).includes(cs.c)).length; });
  g.itens = itensDef.map(q => { const base = q.bloco === 'reuniao' ? list : list.filter(r => coAvaliados(r, cfg.conselheiros).includes(q.bloco)); const xs = base.filter(r => num((r.r || {})[q.c])); const na = base.filter(r => (r.r || {})[q.c] === 'NA').length; const pos = xs.filter(r => positivo(r.r[q.c], escDeCo(r))).length; const neg = xs.filter(r => negativo(r.r[q.c], escDeCo(r))).length; const p = pond[q.bloco] = pond[q.bloco] || { num: 0, den: 0 }; p.num += q.p * pos; p.den += q.p * xs.length;
    return { c: q.c, bloco: q.bloco, blocoNome: q.bloco === 'reuniao' ? 'Reunião' : ((cfg.conselheiros.find(x => x.c === q.bloco) || {}).nome || q.bloco), f: q.f, p: q.p, n: xs.length, na, pct: xs.length ? Math.round(pos / xs.length * 100) : null, neg: xs.length ? Math.round(neg / xs.length * 100) : null }; });
  Object.keys(pond).forEach(b => { g.blocos[b] = pond[b].den ? Math.round(pond[b].num / pond[b].den * 100) : null; });
  const notas = list.map(r => (r.r || {}).nota).filter(num); if (notas.length) { g.notaN = notas.length; g.nota = Math.round(notas.reduce((a, b) => a + b, 0) / notas.length * 10) / 10; g.nota9 = Math.round(notas.filter(v => v >= 9).length / notas.length * 100); }
  g.identTotal = g.n > 0 && g.n < N_IDENT; g.identBloco = {}; cfg.conselheiros.forEach(cs => { g.identBloco[cs.c] = g.nBloco[cs.c] > 0 && g.nBloco[cs.c] < N_IDENT; }); g.blocosIdent = cfg.conselheiros.filter(cs => g.identBloco[cs.c]).map(cs => `${cs.nome} (${g.nBloco[cs.c]})`); g.identificavel = g.identTotal || g.blocosIdent.length > 0;
  g.nReunioes = g.reunioes.length; return g;
}

/* ---------------- filtros e consolidação ---------------- */
function mesDe(k, r){ if (k === 'equipe') return (r.mes || '') || (r.data || '').slice(0, 7); if (k === 'clientes') return (r.data || '').slice(0, 7); return (r.unidade || '').slice(0, 7); }
function filtrar(k, list, cf){ return list.filter(r => { const m = mesDe(k, r); if (cf.ano && m.slice(0, 4) !== cf.ano) return false; if (cf.mes && m.slice(5, 7) !== cf.mes) return false; if (k !== 'conselho' && cf.unidade && r.unidade !== cf.unidade) return false; return true; }); }
function cfDefault(){ return { ano: '', mes: '', unidade: '' }; }
function calc(cf){ travaUnidade(cf);
  const P = pool(); const eqTodas = P.equipe.filter(r => r.escala === EQ.escala); const legado = P.equipe.length - eqTodas.length;
  const todosMeses = [...new Set(eqTodas.map(r => mesDe('equipe', r)).concat(P.clientes.map(r => mesDe('clientes', r)), P.conselho.map(r => mesDe('conselho', r))))].filter(m => m && m.length >= 7);
  const anos = [...new Set(todosMeses.map(m => m.slice(0, 4)))].sort().reverse();
  const unidadesOpt = [...new Set(eqTodas.map(r => r.unidade).concat(P.clientes.map(r => r.unidade)))].filter(Boolean).sort();
  if (cf.ano && !anos.includes(cf.ano)) { cf.ano = ''; cf.mes = ''; }   // opção que deixou de existir (ex.: cópia da nuvem apagada): filtro volta a "Todos"
  if (cf.unidade && !unidadesOpt.includes(cf.unidade)) cf.unidade = '';
  const mesesOpt = [...new Set(todosMeses.filter(m => !cf.ano || m.slice(0, 4) === cf.ano).map(m => m.slice(5, 7)))].sort();
  if (cf.mes && !mesesOpt.includes(cf.mes)) cf.mes = '';
  const eq = filtrar('equipe', eqTodas, cf), cl = filtrar('clientes', P.clientes, cf), co = filtrar('conselho', P.conselho, cf);
  const gEq = agEquipe(eq), gCl = agClientes(cl), gCo = agConselho(co);
  const codes = [...new Set(eq.map(r => r.unidade).concat(cl.map(r => r.unidade)))].filter(Boolean).sort();
  const porUnidade = codes.map(u => ({ unidade: u, nome: nomeU(u), eq: agEquipe(eq.filter(r => r.unidade === u)), cl: agClientes(cl.filter(r => r.unidade === u)) }));
  const meses = [...new Set(eq.map(r => mesDe('equipe', r)).concat(cl.map(r => mesDe('clientes', r)), co.map(r => mesDe('conselho', r))))].filter(m => m && m.length >= 7).sort();
  const tendencia = meses.map(m => ({ mes: m, eq: agEquipe(eq.filter(r => mesDe('equipe', r) === m)), cl: agClientes(cl.filter(r => mesDe('clientes', r) === m)), co: agConselho(co.filter(r => mesDe('conselho', r) === m)) }));
  const reunioes = gCo.reunioes.slice().reverse().map(u => Object.assign({ unidade: u, nome: nomeReuniao(u) }, agConselho(co.filter(r => r.unidade === u))));
  const filtroTxt = [cf.ano || 'todos os anos', cf.mes ? mesLabel((cf.ano || '0000') + '-' + cf.mes).slice(0, 3) : 'todos os meses', cf.unidade ? 'unidade ' + cf.unidade : 'todas as unidades'].join(' · ');
  return { cf, gEq, gCl, gCo, porUnidade, tendencia, reunioes, legado, anos, mesesOpt, unidadesOpt: unidadesPermitidas(unidadesOpt), filtroTxt, origem: P.origem || null, totais: { equipe: eqTodas.length, clientes: P.clientes.length, conselho: P.conselho.length } };
}

function graficoLinhas(labels, series){

  let s = `<div class="tabela-wrap"><svg class="grafico" viewBox="0 0 ${W} ${H}" role="img" aria-label="Tendência mensal">`;
  [0, 25, 50, 75, 100].forEach(v => { s += `<line x1="${L}" x2="${W - R}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" stroke="#DED8EA" stroke-width="1"/><text x="${L - 6}" y="${(y(v) + 4).toFixed(1)}" text-anchor="end" class="rot">${v}%</text>`; });
  const passo = Math.ceil(n / 12); labels.forEach((m, i) => { if ((n - 1 - i) % passo) return; const anc = n === 1 ? 'middle' : (i === 0 ? 'start' : (i === n - 1 ? 'end' : 'middle')); s += `<text x="${x(i).toFixed(1)}" y="${H - B + 18}" text-anchor="${anc}" class="rot">${esc(mesLabel(m))}</text>`; });
  series.forEach((se, si) => { const dyL = [-9, -9, 17][si] || -9, dxL = [0, 22, 0][si] || 0; const pts = se.pts.map((v, i) => v == null ? null : [x(i), y(v)]); let d = ''; pts.forEach((p, i) => { if (!p) return; d += (i === 0 || !pts[i - 1] ? 'M' : 'L') + p[0].toFixed(1) + ',' + p[1].toFixed(1) + ' '; }); if (d) s += `<path d="${d.trim()}" fill="none" stroke="${se.cor}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`;

  s += '</svg></div>'; return s + `<div class="legenda-graf">${series.map(se => `<span class="legitem"><i style="background:${se.cor}"></i>${esc(se.nome)}</span>`).join('')}</div>`;

async function apiGet(params){ const u = new URL(settings.webhook); Object.entries(Object.assign({ chave: settings.chave }, params)).forEach(([k, v]) => u.searchParams.set(k, v)); const res = await fetch(u.toString()); if (!res.ok) throw new Error('HTTP ' + res.status); return res.json(); }
function erroServidor(j){ if (!j) return 'Resposta inesperada do servidor.'; if (j.erro === 'chave') return 'Chave de sincronização diferente da do servidor (Configurações).'; if (j.erro === 'configurar-chave') return 'O servidor ainda está com a chave de exemplo: troque CHAVE no Code.gs e implante de novo.'; if (j.erro === 'app') return 'O servidor não conhece uma das pesquisas: atualize o Code.gs (versão com a aba Conselho).'; return 'Resposta inesperada do servidor' + (j.erro ? ' (' + j.erro + ')' : '') + '.'; }
let syncing = false;
async function sincronizar(silencioso, tudo){
  if (!syncOk()) { if (!silencioso) toast('Configure a URL e a chave do servidor em Configurações.'); return; }
  if (syncing) return; if (!navigator.onLine) { if (!silencioso) toast('Sem internet agora; tento de novo quando voltar.'); return; }
  syncing = true; if (!silencioso) toast('Atualizando da nuvem…');
  try {
    const atual = tudo ? {} : nuvem(); const incremental = !tudo && !!settings.ultimaSync; const conv = { equipe: registroEq, clientes: registroCl, conselho: registroCo }; const novo = {}; let novas = 0;
    for (const k of Object.keys(APPS)) { const params = { op: 'list', app: APPS[k] }; if (incremental) params.desde = new Date(new Date(settings.ultimaSync).getTime() - 15 * 60 * 1000).toISOString();
      const j = await apiGet(params); if (!j || !j.ok) throw new Error(erroServidor(j));
      const porId = new Map((atual[k] || []).map(r => [r.id, r])); (j.itens || []).map(conv[k]).forEach(x => { if (!x) return; if (!porId.has(x.id)) novas++; porId.set(x.id, x); }); novo[k] = [...porId.values()]; }
    if (!LS.set('mpp_nuvem', novo)) throw new Error('Não coube na memória deste aparelho.');
    settings.ultimaSync = new Date().toISOString(); saveSettings(); invalidar();
    if (!silencioso) toast(`Nuvem atualizada: ${novas} resposta(s) nova(s).`); if (state.screen === 'painel') render();   // não redesenha Configurações no meio da digitação
  } catch(e) { console.warn('sincronizar', e); if (!silencioso) toast(e.message || 'Não consegui falar com o servidor.'); }
  finally { syncing = false; }
}
async function testarServidor(){
  const url = ((document.getElementById('s-webhook') || {}).value || '').trim(), chave = ((document.getElementById('s-chave') || {}).value || '').trim();
  if (!url || !chave) { toast('Preencha a URL e a chave antes de testar.'); return; } toast('Testando…');
  try { const u = new URL(url); u.searchParams.set('op', 'ping'); u.searchParams.set('chave', chave); const res = await fetch(u.toString()); const j = await res.json(); toast(j && j.ok ? 'Ligação OK: o servidor respondeu.' : erroServidor(j)); }
  catch(e) { toast('Não consegui falar com o servidor: confira a URL (termina em /exec), a implantação "Qualquer pessoa" e a internet.'); }
}

function pdfTxt(s){ return String(s == null ? '' : s).replace(/[\u{1F000}-\u{1FFFF}\u{2600}-\u{27BF}\u{FE0F}\u{200D}\u{20E3}]/gu, '').replace(/[—–−]/g, '-').replace(/…/g, '...').replace(/≠/g, '<>').replace(/→/g, '->').replace(/[‹«]/g, '<').replace(/[›»]/g, '>').replace(/[“”]/g, '"').replace(/[‘’]/g, "'").replace(/×/g, 'x').replace(/[^\x09\x0A\x20-\x7E\xA0-\xFF]/g, '?'); }
async function exportarPdf(){ if (exportando) return; exportando = true; try { await _exportarPdf(); } finally { exportando = false; } }
async function _exportarPdf(){
  let jsPDF; try { toast('Preparando o PDF…'); jsPDF = await loadJsPDF(); } catch(e) { toast('Para gerar o PDF é preciso internet na primeira vez.'); return; }
  try {
    const D = dadosExport(); const doc = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
    const W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight(); const cor = [107, 74, 152];
    const tabela = (titulo, aoa, opts) => { let y = doc.lastAutoTable && doc.lastAutoTable.finalY ? doc.lastAutoTable.finalY + 8 : 24; if (y > H - 40) { doc.addPage(); y = 22; }
      doc.setFontSize(12); doc.setTextColor(cor[0], cor[1], cor[2]); doc.text(pdfTxt(titulo), 12, y); doc.setTextColor(0, 0, 0);
      const linhas = aoa.slice(1).map(r => r.map(pdfTxt));
      doc.autoTable(Object.assign({ head: [aoa[0].map(pdfTxt)], body: linhas.length ? linhas : [['(sem dados)']], startY: y + 3, margin: { top: 21, left: 12, right: 12, bottom: 14 }, styles: { fontSize: 7.5, cellPadding: 1.4, overflow: 'linebreak' }, headStyles: { fillColor: cor, textColor: 255, fontSize: 7.5 }, alternateRowStyles: { fillColor: [244, 243, 252] } }, opts || {})); };
    try { doc.addImage('data:image/png;base64,' + LOGO_B64, 'PNG', 12, 7, 60, 13.8); } catch(e) {}
    doc.setDrawColor(cor[0], cor[1], cor[2]); doc.setLineWidth(1.2); doc.line(12, 24, W - 12, 24);
    doc.setFontSize(18); doc.setTextColor(cor[0], cor[1], cor[2]); const tl = doc.splitTextToSize(pdfTxt(D.titulo), W - 24); const dy = (tl.length - 1) * 7.3; doc.text(tl, 12, 33); doc.setTextColor(0, 0, 0);
    doc.setFontSize(9.5); doc.text(pdfTxt(`Gerado em ${dataLabel(hojeISO())} - ${D.escopo} - Painel v${VERSAO}`), 12, 40 + dy, { maxWidth: W - 24 });
    doc.setFontSize(8.5); doc.setTextColor(155, 28, 28); const av = doc.splitTextToSize(pdfTxt(AVISO_EXPORT), W - 24); doc.text(av, 12, 47 + dy); doc.setTextColor(0, 0, 0);
    doc.lastAutoTable = { finalY: 47 + dy + (av.length - 1) * 3.6 };
    tabela('Resumo — as três pesquisas', D.resumo.slice(D.resumo.findIndex(r => r[0] === 'Indicador')).filter(r => r.length === 3), { columnStyles: { 0: { cellWidth: 90 }, 1: { cellWidth: 30 } } });
    doc.addPage(); doc.lastAutoTable = { finalY: 14 };
    tabela('Por unidade — equipe x clientes', D.porUnidade, { styles: { fontSize: 7, cellPadding: 1.2, overflow: 'linebreak' }, columnStyles: { 13: { cellWidth: 48 } } });
    tabela('Tendência mensal', D.tendencia);
    doc.addPage(); doc.lastAutoTable = { finalY: 14 };
    tabela('Equipe — as 15 frases', D.eqFrases, { columnStyles: { 2: { cellWidth: 110 } } });
    doc.addPage(); doc.lastAutoTable = { finalY: 14 };
    tabela('Clientes — fatores, problemas, resolução e tipo de cliente', D.clFat.filter(r => r.length), { columnStyles: { 0: { cellWidth: 90 } } });
    doc.addPage(); doc.lastAutoTable = { finalY: 14 };
    tabela('Conselho — evolução por reunião', D.coReunioes);
    tabela('Conselho — por item', D.coItens, { columnStyles: { 2: { cellWidth: 90 } } });
    doc.addPage(); doc.lastAutoTable = { finalY: 14 };
    tabela('Legenda', D.legenda, { columnStyles: { 0: { cellWidth: 45 } } });
    const total = doc.internal.getNumberOfPages(); const rodape = pdfTxt(`${D.titulo} - ${D.escopo} - gerado em ${dataLabel(hojeISO())} - uso restrito`); const tituloFaixa = doc.splitTextToSize(pdfTxt(D.titulo), W - 72)[0];
    for (let p = 1; p <= total; p++) { doc.setPage(p); doc.setFontSize(7.5); doc.setTextColor(120, 120, 120); const lr = doc.splitTextToSize(rodape, W - 60); doc.text(lr, 12, H - 6 - 3.04 * (lr.length - 1)); doc.text(pdfTxt(`página ${p} de ${total}`), W - 12, H - 6, { align: 'right' }); if (p > 1) { try { doc.addImage('data:image/png;base64,' + LOGO_B64, 'PNG', 12, 5, 40, 9.2); doc.setDrawColor(cor[0], cor[1], cor[2]); doc.setLineWidth(0.8); doc.line(12, 16.5, W - 12, 16.5); doc.setFontSize(8); doc.setTextColor(cor[0], cor[1], cor[2]); doc.text(tituloFaixa, W - 12, 12, { align: 'right' }); } catch(e) {} } }
    const ok = await shareOrDownload(D.nome + '.pdf', doc.output('blob'), 'application/pdf'); if (ok) toast('PDF gerado.');
  } catch(e) { console.error(e); toast('Não consegui gerar o PDF. Tente de novo.'); }
}

/* ---------------- eventos ---------------- */
function pinTentativa(){
  if (settings.lockUntil && Date.now() < settings.lockUntil) { render(); return; }
  if (state.pin === pinAtual()) { settings.pinFails = 0; saveSettings(); state.pin = ''; go('painel'); if (syncOk()) sincronizar(true); }
  else { settings.pinFails = (settings.pinFails || 0) + 1; if (settings.pinFails >= PIN_MAX_FALHAS) { settings.lockUntil = Date.now() + PIN_BLOQUEIO_MS; settings.pinFails = 0; } saveSettings(); state.pin = ''; toast('PIN incorreto.'); render(); }
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]'); if (!el || el.disabled) return; const a = el.dataset.action;
  switch (a) {
    case 'pinkey': { if (el.dataset.k === 'del') state.pin = state.pin.slice(0, -1); else if (state.pin.length < 8) state.pin += el.dataset.k; render(); break; }
    case 'pinok': pinTentativa(); break;
    case 'painel': go('painel'); break;
    case 'config': go('config'); break;
    case 'sync': sincronizar(false); break;
    case 'syncfull': sincronizar(false, true); break;
    case 'testarservidor': testarServidor(); break;
    case 'saveconfig': { const w = ((document.getElementById('s-webhook') || {}).value || '').trim(); const ch = ((document.getElementById('s-chave') || {}).value || '').trim(); const np = ((document.getElementById('s-pin') || {}).value || '').trim();
      if (w && !/^https?:\/\//.test(w)) { toast('A URL precisa começar com https://'); return; } if (np && !/^\d{4,8}$/.test(np)) { toast('O PIN deve ter de 4 a 8 dígitos.'); return; } if (w && !ch) { toast('Digite também a chave de sincronização.'); return; }
      if (w !== settings.webhook) { settings.ultimaSync = ''; LS.set('mpp_nuvem', {}); invalidar(); }
      settings.webhook = w; settings.chave = ch; if (np) settings.pin = np; saveSettings(); toast('Configurações salvas.'); go('painel'); if (syncOk()) sincronizar(true); break; }
    case 'wipenuvem': LS.set('mpp_nuvem', {}); settings.ultimaSync = ''; saveSettings(); invalidar(); toast('Cópia da nuvem apagada deste aparelho.'); render(); break;
    case 'xlsx': exportarExcel(); break;
    case 'pdf': exportarPdf(); break;
  }
});
document.addEventListener('change', e => { const el = e.target; if (el.matches('[data-cf]')) { state.cf[el.dataset.cf] = el.value; if (el.dataset.cf === 'ano') state.cf.mes = ''; render(); } });
document.addEventListener('input', e => { const el = e.target; if (el.id === 'pin-input') { state.pin = el.value.replace(/\D/g, '').slice(0, 8); if (el.value !== state.pin) el.value = state.pin; } });
document.addEventListener('keydown', e => { if (e.key === 'Enter' && state.screen === 'pin' && e.target && e.target.id === 'pin-input') { e.preventDefault(); if (state.pin) pinTentativa(); } });
window.addEventListener('online', () => { if (state.screen === 'painel' && syncOk()) sincronizar(true); });
window.addEventListener('storage', () => { invalidar(); if (state.screen === 'painel') render(); });   // outra aba do mesmo aparelho gravou respostas

/* ---------------- início ---------------- */
render();
if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) { navigator.serviceWorker.register('../sw.js').catch(() => {}); }
</script>
