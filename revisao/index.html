<script>
/* ═════════ BOTÃO CLARO / ESCURO  (🌙 escurece · ☀ clareia) ═════════════════
   Fica no canto de baixo à direita de todas as telas.
   A escolha é guardada NO APARELHO e vale para as CINCO telas de uma vez,
   porque todas moram no mesmo endereço de site.
   Enquanto ninguém escolher, o app segue o modo claro/escuro do aparelho.
   Roda antes de a tela ser desenhada: no escuro, não pisca branco.          */
(function () {
  'use strict';
  var GUARDA = 'maxipark_tema', raiz = document.documentElement;
  function escolhido() { try { return localStorage.getItem(GUARDA); } catch (e) { return null; } }
  function doAparelho() {
    try { return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'escuro' : 'claro'; }
    catch (e) { return 'claro'; }
  }
  function agora() { var e = escolhido(); return (e === 'escuro' || e === 'claro') ? e : doAparelho(); }
  function aplica(t) {
    raiz.setAttribute('data-theme', t === 'escuro' ? 'dark' : 'light');
    var m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute('content', t === 'escuro' ? '#17111E' : '#6B4A98');
    var b = document.getElementById('btn-tema');
    if (b) {
      b.textContent = t === 'escuro' ? '\u2600' : '\uD83C\uDF19';
      var r = t === 'escuro' ? 'Clarear a tela' : 'Escurecer a tela';
      b.setAttribute('aria-label', r); b.title = r;
    }
  }
  aplica(agora());
  function troca() {
    var novo = agora() === 'escuro' ? 'claro' : 'escuro';
    try { localStorage.setItem(GUARDA, novo); } catch (e) {}
    aplica(novo);
  }
  /* ninguém escolheu ainda: acompanha o aparelho quando ele troca de modo */
  try {
    var mq = window.matchMedia('(prefers-color-scheme: dark)');
    var ouve = function () { if (!escolhido()) aplica(doAparelho()); };
    if (mq.addEventListener) mq.addEventListener('change', ouve);
    else if (mq.addListener) mq.addListener(ouve);
  } catch (e) {}
  /* trocou numa tela com outra aberta ao lado: a outra acompanha na hora */
  try { window.addEventListener('storage', function (ev) { if (ev.key === GUARDA) aplica(agora()); }); } catch (e) {}
  function poeBotao() {
    if (document.getElementById('btn-tema')) return;
    var b = document.createElement('button');
    b.id = 'btn-tema'; b.type = 'button'; b.className = 'botao-tema';
    b.addEventListener('click', troca);
    document.body.appendChild(b);
    aplica(agora());
  }
  if (document.body) poeBotao();
  else document.addEventListener('DOMContentLoaded', poeBotao);
})();
</script>

      { c: 'B12', t: 'Nos últimos 30 dias, meu chefe direto ou o supervisor elogiou meu trabalho.', f: 'Chefia e reconhecimento', p: 2, o: ['Sim', 'Não lembro', 'Não'] },
      { c: 'B13', t: 'Me sinto seguro(a) no meu posto (risco de atropelamento, assalto, escuro à noite).', f: 'Segurança e apoio', p: 3, o: ['Sim', 'Em parte', 'Não'] },
      { c: 'B14', t: 'Se um motorista ou alguém do local me trata mal, a Maxipark me apoia.', f: 'Segurança e apoio', p: 2, o: ['Sim', 'Em parte', 'Não'], na: 'Não se aplica — não aconteceu comigo' },
      { c: 'B15', t: 'Vejo chance de crescer na Maxipark.', f: 'Futuro', p: 1, o: ['Sim', 'Talvez', 'Não'] },
    ] },
    { nome: 'Nota, esforço e comentários', itens: [
      { c: 'eNPS', t: 'De 0 a 10, quanto você recomendaria a Maxipark a um amigo como um bom lugar para trabalhar?', tipo: 'Nota de 0 a 10', f: 'Recomendação como lugar para trabalhar', o: ['0 a 10 — Nada provável … Muito provável'] },
      { c: 'CES', t: 'Pense na última vez que você precisou resolver algo seu com o escritório da Maxipark (holerite, ponto, uniforme, sistema). Foi fácil resolver?', tipo: 'Escolha uma', f: 'Esforço para resolver com o escritório', o: ['Sim, foi fácil', 'Mais ou menos', 'Não, foi difícil'], na: 'Nunca precisei' },
      { c: 'Aberta 1', t: 'O que mais atrapalha seu dia de trabalho nesta unidade hoje?', tipo: 'Texto livre · opcional', f: 'Comentários', o: [], livre: ['Campo livre para escrever'] },
      { c: 'Aberta 2', t: 'Se você pudesse mudar uma coisa na Maxipark, o que seria?', tipo: 'Texto livre · opcional', f: 'Comentários', o: [], livre: ['Campo livre para escrever'] },
    ] } ] },
];
PESQUISAS.forEach(p => p.secoes.forEach(s => s.itens.forEach(it => { it.chave = p.id + ':' + it.c; it.pesquisa = p.id; if (!it.tipo) it.tipo = E3; })));
const TODOS = PESQUISAS.flatMap(p => p.secoes.flatMap(s => s.itens));

const est = { rev: [], erro: '', carregando: false, filtro: 'todas', soFalta: false, consolidado: false, rasc: {}, msgs: {}, timers: {}, busca: '' };
const minha = ch => est.rev.find(r => r.chave_item === ch && r.email === ESCOPO.email) || null;
const dosOutros = ch => est.rev.filter(r => r.chave_item === ch && r.email !== ESCOPO.email).sort((a, b) => String(a.nome).localeCompare(String(b.nome)));
function dh(iso){ const d = new Date(iso); return isNaN(d) ? '' : d.toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }); }

async function carregar(){
  const c = conexao(); if (!c.chave) { render(); return; }
  est.carregando = true; est.erro = ''; render();
  try {
    const u = new URL(c.webhook); u.searchParams.set('op', 'revisao'); u.searchParams.set('chave', c.chave);
    const j = await (await fetch(u.toString())).json();
    if (!j || !j.ok) throw new Error(j && j.erro === 'chave' ? 'A chave de sincronização não confere.' : 'O servidor ainda não tem a revisão das perguntas. Atualize o servidor (Apps Script).');
    est.rev = (j.itens || []).map(r => Object.assign({}, r, { email: String(r.email || '').toLowerCase() }));
  } catch (e) { est.erro = (e && e.message) || 'Sem conexão com o servidor.'; }
  est.carregando = false; render();
}
function agendar(ch){ clearTimeout(est.timers[ch]); est.timers[ch] = setTimeout(() => salvar(ch), 900); }
async function salvar(ch, decisao){
  const c = conexao(), it = TODOS.find(x => x.chave === ch), m = minha(ch);
  const obs = (est.rasc[ch] !== undefined ? est.rasc[ch] : (m ? m.observacao : '')).trim();
  const dec = decisao || (m ? m.decisao : '');
  if (!dec && !obs) return;
  const novo = { chave_item: ch, pesquisa: it.pesquisa, pergunta: it.c + ' — ' + it.t, email: ESCOPO.email, nome: ESCOPO.nome, decisao: dec, observacao: obs, atualizado_em: new Date().toISOString() };
  const i = est.rev.findIndex(r => r.chave_item === ch && r.email === ESCOPO.email); if (i >= 0) est.rev[i] = novo; else est.rev.push(novo);
  est.msgs[ch] = 'salvando'; render();
  try {
    const r = await (await fetch(c.webhook, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ chave: c.chave, op: 'revisao-salvar', item: novo }) })).json();
    est.msgs[ch] = r && r.ok ? 'ok' : 'erro';
  } catch (e) { est.msgs[ch] = 'erro'; }
  render();
}

function csv(){
  const q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
  const L = [['pesquisa', 'codigo', 'pergunta', 'quem', 'email', 'decisao', 'observacao', 'atualizado_em'].map(q).join(';')];
  TODOS.forEach(it => est.rev.filter(r => r.chave_item === it.chave).forEach(r => L.push([it.pesquisa, it.c, it.t, r.nome, r.email, NOME_DEC[r.decisao] || r.decisao, r.observacao, r.atualizado_em].map(q).join(';'))));
  const blob = new Blob(['\ufeff' + L.join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'revisao-perguntas-maxipark.csv'; a.click();
}

function resumo(){
  const pessoas = {}; est.rev.forEach(r => { const p = pessoas[r.email] || (pessoas[r.email] = { nome: r.nome, n: 0, manter: 0, mudar: 0, tirar: 0 }); p.n++; if (p[r.decisao] !== undefined) p[r.decisao]++; });
  const minhas = est.rev.filter(r => r.email === ESCOPO.email && r.decisao).length;
  return { pessoas, minhas, total: TODOS.length };
}

function cardItem(it){
  const m = minha(it.chave), outros = dosOutros(it.chave), msg = est.msgs[it.chave];
  const obs = est.rasc[it.chave] !== undefined ? est.rasc[it.chave] : (m ? m.observacao : '');
  const chips = it.o.map(x => '<span class="chip">' + esc(x) + '</span>').join('') + (it.na ? '<span class="chip na">' + esc(it.na) + ' <i>(opção de escape)</i></span>' : '') + (it.livre || []).map(x => '<span class="chip livre">' + esc(x) + '</span>').join('');
  const meta = '<b>' + esc(it.tipo) + '</b>' + (it.f ? ' · mede: <b>' + esc(it.f) + '</b>' : '') + (it.p ? ' · peso ' + it.p + ' na nota final' : '') + (it.cond ? ' · <i>' + esc(it.cond) + '</i>' : '');
  const cont = { manter: 0, mudar: 0, tirar: 0 }; est.rev.filter(r => r.chave_item === it.chave).forEach(r => { if (cont[r.decisao] !== undefined) cont[r.decisao]++; });
  const placar = Object.keys(cont).some(k => cont[k]) ? '<span class="placar">' + DECISOES.map(([k, n]) => cont[k] ? '<b class="d-' + k + '">' + cont[k] + ' ' + n.toLowerCase() + '</b>' : '').filter(Boolean).join(' · ') + '</span>' : '';
  const botoes = DECISOES.map(([k, n, s]) => '<button class="dec d-' + k + (m && m.decisao === k ? ' sel' : '') + '" data-ch="' + it.chave + '" data-dec="' + k + '">' + s + ' ' + n + '</button>').join('');
  const estado = msg === 'salvando' ? '<span class="small muted">salvando…</span>' : msg === 'ok' ? '<span class="small ok">✓ salvo' + (m ? ' ' + dh(m.atualizado_em) : '') + '</span>' : msg === 'erro' ? '<span class="small erro">✕ não salvou — tente de novo</span>' : (m ? '<span class="small muted">marcado em ' + dh(m.atualizado_em) + '</span>' : '');
  const lista = outros.length ? '<div class="outros"><div class="small muted">O que os outros marcaram</div>' + outros.map(r => '<div class="outro"><span class="dec-tag d-' + esc(r.decisao) + '">' + esc(NOME_DEC[r.decisao] || '—') + '</span> <b>' + esc(r.nome) + '</b> <span class="small muted">' + dh(r.atualizado_em) + '</span>' + (r.observacao ? '<div class="obs">' + esc(r.observacao) + '</div>' : '') + '</div>').join('') + '</div>' : '<div class="small muted outros vazio-outros">Ninguém mais marcou esta pergunta ainda.</div>';
  return '<div class="card q' + (m && m.decisao ? ' feito' : '') + '" id="q-' + it.chave.replace(':', '-') + '">' +
    '<div class="cab"><span class="cod">' + esc(it.c) + '</span><h2>' + esc(it.t) + '</h2></div>' +
    '<div class="meta small">' + meta + '</div><div class="chips">' + chips + '</div>' +
    '<div class="minha"><div class="decs">' + botoes + '</div>' +
    '<textarea placeholder="Observação (o que mudar, por quê…)" data-obs="' + it.chave + '">' + esc(obs) + '</textarea>' +
    '<div class="rodape-q">' + estado + placar + '</div></div>' + lista + '</div>';
}

function render(){
  const app = $('app'), c = conexao();
  if (!ESCOPO) { app.innerHTML = '<div class="card vazio"><h1>Revisão das perguntas</h1><p class="muted">Abra esta tela pelo botão <b>Revisão das perguntas</b> na página inicial, depois de entrar com o seu e-mail.</p><p><a class="btn" href="../">Ir para a página inicial</a></p></div>'; return; }
  if (!c.chave) { app.innerHTML = '<div class="card"><h1>Revisão das perguntas</h1><p class="muted">Este aparelho ainda não está ligado ao servidor. Saia da conta e entre de novo na página inicial, ou digite a chave de sincronização.</p><div class="filtros"><input id="i-chave" placeholder="Chave de sincronização"><button class="btn" id="b-chave">Ligar</button></div></div>';
    $('b-chave').onclick = () => { const v = $('i-chave').value.trim(); if (v) { LS.set('mpr_settings', { webhook: SERVIDOR_PADRAO, chave: v }); carregar(); } }; return; }
  const R = resumo();
  const pessoas = Object.keys(R.pessoas).map(e => R.pessoas[e]).sort((a, b) => b.n - a.n);
  let h = '<div class="card"><h1>Revisão das perguntas</h1><p class="muted">Para cada pergunta, marque <b>manter</b>, <b>mudar o texto</b> ou <b>tirar</b> e deixe a sua observação. Salva sozinho. Todo mundo vê o que os outros marcaram.</p>' +
    '<div class="kpis"><div class="kpi"><b>' + R.minhas + '/' + R.total + '</b><span>perguntas que você já marcou</span></div><div class="kpi"><b>' + pessoas.length + '</b><span>pessoa' + (pessoas.length === 1 ? '' : 's') + ' revisando</span></div></div>' +
    (pessoas.length ? '<div class="pessoas">' + pessoas.map(p => '<span class="pessoa"><b>' + esc(p.nome) + '</b> ' + p.n + '/' + R.total + ' <span class="small muted">(' + p.manter + ' manter · ' + p.mudar + ' mudar · ' + p.tirar + ' tirar)</span></span>').join('') + '</div>' : '') +
    (est.erro ? '<div class="msg erro">' + esc(est.erro) + '</div>' : '') +
    '<div class="filtros"><select id="f-pesq"><option value="todas">As duas pesquisas</option>' + PESQUISAS.map(p => '<option value="' + p.id + '"' + (est.filtro === p.id ? ' selected' : '') + '>' + esc(p.nome) + '</option>').join('') + '</select>' +
    '<input id="f-busca" placeholder="Procurar na pergunta…" value="' + esc(est.busca) + '">' +
    '<label class="chk"><input type="checkbox" id="f-falta"' + (est.soFalta ? ' checked' : '') + '> só o que me falta marcar</label>' +
    '<button class="btn light" id="b-recarregar">' + (est.carregando ? 'Atualizando…' : 'Atualizar') + '</button>' +
    '<button class="btn light" id="b-csv">Baixar planilha (CSV)</button></div></div>';
  PESQUISAS.filter(p => est.filtro === 'todas' || est.filtro === p.id).forEach(p => {
    const itens = p.secoes.flatMap(s => s.itens).filter(it => (!est.soFalta || !(minha(it.chave) && minha(it.chave).decisao)) && (!est.busca || (it.c + ' ' + it.t).toLowerCase().includes(est.busca.toLowerCase())));
    if (!itens.length) return;
    h += '<div class="banner"><h2>' + esc(p.nome) + '</h2><p>' + esc(p.desc) + '</p></div>';
    p.secoes.forEach(s => { const its = s.itens.filter(it => itens.includes(it)); if (!its.length) return; h += '<h3 class="secao">' + esc(s.nome) + '</h3>' + its.map(cardItem).join(''); });
  });
  const foco = document.activeElement && document.activeElement.dataset && document.activeElement.dataset.obs ? { ch: document.activeElement.dataset.obs, s: document.activeElement.selectionStart, e: document.activeElement.selectionEnd } : null;
  app.innerHTML = h;
  if (foco) { const t = app.querySelector('textarea[data-obs="' + foco.ch + '"]'); if (t) { t.focus(); try { t.setSelectionRange(foco.s, foco.e); } catch (e) {} } }
  $('f-pesq').onchange = e => { est.filtro = e.target.value; render(); };
  $('f-busca').oninput = e => { est.busca = e.target.value; render(); const i = $('f-busca'); i.focus(); i.setSelectionRange(i.value.length, i.value.length); };
  $('f-falta').onchange = e => { est.soFalta = e.target.checked; render(); };
  $('b-recarregar').onclick = carregar; $('b-csv').onclick = csv;
  app.querySelectorAll('button.dec').forEach(b => { b.onclick = () => salvar(b.dataset.ch, b.dataset.dec); });
  app.querySelectorAll('textarea[data-obs]').forEach(t => { t.oninput = () => { est.rasc[t.dataset.obs] = t.value; agendar(t.dataset.obs); }; });
}
render(); carregar();
setInterval(() => { const a = document.activeElement; if (!document.hidden && !(a && a.tagName === 'TEXTAREA') && est.msgs && !Object.values(est.msgs).includes('salvando')) carregar(); }, 60000);   // recarrega a cada minuto, sem atrapalhar quem está escrevendo
</script>
<script>
/* ---- aviso de versão nova (pedido do Raphael em 15/10/2026) ----------------
   Ao abrir o app (ou voltar para ele), compara a versão publicada (sw.js) com a
   deste aparelho. Se houver versão nova, aparece um card solto na tela com o
   botão "Atualizar app", que faz a atualização completa: atualiza o service
   worker, apaga todas as cópias guardadas, baixa de novo as páginas e recarrega. */
(() => {
  if (!/^https?:/.test(location.protocol)) return;
  const RAIZ = '../';
  const CHAVE = 'mp_app_versao';
  const PAGINAS = ['', 'index.html', 'equipe/', 'cliente/', 'painel/', 'acompanhamento/', 'revisao/', 'sw.js'];
  let mostrando = false;
  async function versaoPublicada() {
    const t = await (await fetch(RAIZ + 'sw.js?v=' + Date.now(), { cache: 'no-store' })).text();
    const m = /VERSAO\s*=\s*'([0-9.]+)'/.exec(t); return m ? m[1] : '';
  }
  async function versaoAqui() {
    let v = ''; try { v = localStorage.getItem(CHAVE) || ''; } catch (e) {}
    if (v) return v;
    try { const k = (await caches.keys()).find(x => /^pesquisa-maxipark-/.test(x)); if (k) return k.replace('pesquisa-maxipark-', ''); } catch (e) {}
    return '';
  }
  async function atualizarTudo(nova) {
    try { if (navigator.serviceWorker) { const rs = await navigator.serviceWorker.getRegistrations(); await Promise.all(rs.map(r => r.update().catch(() => {}))); } } catch (e) {}
    try { if (window.caches) { const ks = await caches.keys(); await Promise.all(ks.map(k => caches.delete(k))); } } catch (e) {}
    try { await Promise.all(PAGINAS.map(p => fetch(RAIZ + p, { cache: 'reload' }).catch(() => {}))); } catch (e) {}
    try { localStorage.setItem(CHAVE, nova); } catch (e) {}
    const u = new URL(location.href); u.searchParams.set('v', nova); location.replace(u.toString());
  }
  function card(nova, atual) {
    if (mostrando || document.getElementById('card-atualizar')) return; mostrando = true;
    const fundo = document.createElement('div');
    fundo.id = 'card-atualizar';
    fundo.style.cssText = 'position:fixed;inset:0;z-index:2147483000;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(15,10,30,.55)';
    fundo.innerHTML = '<div role="dialog" aria-modal="true" aria-labelledby="ca-tit" style="max-width:420px;width:100%;background:var(--card,var(--branco,#fff));color:var(--texto,var(--text,#1f1a33));border-radius:18px;padding:22px;box-shadow:0 18px 50px rgba(0,0,0,.35);text-align:center;font-family:inherit">'
      + '<div style="font-size:40px;line-height:1">🔄</div>'
      + '<h2 id="ca-tit" style="margin:10px 0 6px;font-size:21px">Tem atualização do app</h2>'
      + '<p style="margin:0 0 16px;font-size:16px;opacity:.85">Versão nova: <b>' + nova + '</b>' + (atual ? ' (neste aparelho: ' + atual + ')' : '') + '. Toque em atualizar — leva poucos segundos e nenhuma resposta é perdida.</p>'
      + '<button type="button" id="ca-sim" style="width:100%;padding:14px 16px;border:0;border-radius:12px;background:#6d28d9;color:#fff;font-size:18px;font-weight:700;cursor:pointer">Atualizar app</button>'
      + '<button type="button" id="ca-nao" style="width:100%;margin-top:10px;padding:10px;border:0;background:transparent;color:inherit;opacity:.75;font-size:15px;cursor:pointer">Agora não</button></div>';
    document.body.appendChild(fundo);
    const sim = document.getElementById('ca-sim');
    sim.addEventListener('click', () => { sim.disabled = true; sim.textContent = 'Atualizando…'; atualizarTudo(nova); });
    document.getElementById('ca-nao').addEventListener('click', () => { fundo.remove(); mostrando = false; try { sessionStorage.setItem('mp_adiou_' + nova, '1'); } catch (e) {} });
  }
  async function conferir() {
    if (!navigator.onLine || document.hidden) return;
    try {
      const nova = await versaoPublicada(); if (!nova) return;
      const atual = await versaoAqui();
      if (!atual) { try { localStorage.setItem(CHAVE, nova); } catch (e) {} return; }   // primeira vez neste aparelho: já veio da rede
      let manual = false; try { manual = sessionStorage.getItem('mp_atualizou_agora') === '1'; sessionStorage.removeItem('mp_atualizou_agora'); } catch (e) {}
      if (manual) { try { localStorage.setItem(CHAVE, nova); } catch (e) {} return; }   // acabou de usar o botão de atualizar da tela
      if (atual === nova) return;
      try { if (sessionStorage.getItem('mp_adiou_' + nova)) return; } catch (e) {}
      card(nova, atual);
    } catch (e) {}
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', conferir); else conferir();
  document.addEventListener('visibilitychange', () => { if (!document.hidden) conferir(); });
  document.addEventListener('click', e => {   // os botões de atualizar que já existiam também contam como "atualizado"
    const b = e.target && e.target.closest && e.target.closest('#btn-atualizar-app, #btn-atualizar-tudo');
    if (b) { try { sessionStorage.setItem('mp_atualizou_agora', '1'); } catch (x) {} }
  }, true);
  window.__aviso = { conferir, atualizarTudo };
})();
</script>
