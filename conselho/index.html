<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Avaliação da reunião do conselho Maxipark</title>
<meta name="theme-color" content="#6B4A98">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Conselho Maxipark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="../icon-192.png">
<link rel="icon" href="../icon-192.png">
<style>
  :root{
    --roxo:#6B4A98; --roxo-escuro:#4E3572; --roxo-claro:#EEE8F5; --acento:#9935F4; --bg:#F5F3F9; --card:#FFFFFF;
    --texto:#221C2E; --cinza:#5E5670; --linha:#DED8EA; --sel:#FFD54F; --sel-texto:#3A2E00; --perigo:#B23A3A; --ok:#2E7D32; --raio:18px;
    color-scheme: light;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%;background:var(--bg);color:var(--texto);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:18px;line-height:1.35}
  button{font-family:inherit;color:var(--texto)}
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 18px;background:#fff;border-bottom:3px solid var(--roxo)}
  .top .marca{display:flex;align-items:center;gap:12px;font-weight:700;color:var(--roxo-escuro);font-size:17px}
  .top .marca img{height:40px;width:auto}
  .top .passo{font-size:15px;color:var(--roxo-escuro);font-weight:600;text-align:right}
  .barra{height:6px;background:var(--linha)} .barra > div{height:100%;background:linear-gradient(90deg,var(--roxo),var(--acento));transition:width .25s}
  .wrap{max-width:900px;margin:0 auto;padding:16px 18px 80px}
  .card{background:var(--card);border-radius:var(--raio);padding:20px 22px;box-shadow:0 2px 10px rgba(34,28,46,.06)}
  h1{font-size:28px;line-height:1.2;margin:0 0 10px;color:var(--roxo-escuro)}
  h2{font-size:23px;line-height:1.25;margin:0 0 12px}
  h3{font-size:19px;margin:18px 0 8px;color:var(--roxo-escuro)}
  p{margin:0 0 12px}
  .small{font-size:14px} .muted{color:var(--cinza)} .legenda{font-size:13px;color:var(--cinza);margin:6px 0 0}
  .pergunta{font-size:27px;font-weight:600;line-height:1.3;margin:4px 0 18px}
  .opcoes{display:grid;gap:12px}
  .opt{display:flex;align-items:center;gap:14px;width:100%;min-height:64px;padding:12px 18px;border:2px solid var(--linha);border-radius:14px;background:#fff;font-size:20px;text-align:left;cursor:pointer}
  .opt.sel{background:var(--sel);border-color:#E0B400;color:var(--sel-texto);font-weight:700}
  .opt .num{min-width:36px;height:36px;border-radius:50%;background:var(--roxo-claro);color:var(--roxo-escuro);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:18px}
  .escala{display:grid;grid-template-columns:repeat(var(--n,5),1fr);gap:10px;margin:8px 0 6px}
  .escala .opt .rot{font-size:14px;color:var(--cinza);line-height:1.2;text-align:center} .escala .opt.sel .rot{color:var(--sel-texto)}
  .escala.n3 .opt{min-height:112px} .escala.n3 .opt .rot{font-size:18px;font-weight:600}
  .pergunta-cfg{border:1px solid var(--linha);border-radius:12px;padding:10px 14px 14px;margin:10px 0;background:#FAFBFB}
  .pergunta-cfg label{font-size:14px;margin:8px 0 4px} .pergunta-cfg input,.pergunta-cfg textarea,.pergunta-cfg select{font-size:16px;padding:8px 10px} .pergunta-cfg textarea{min-height:0}
  .escala .opt{flex-direction:column;justify-content:center;text-align:center;gap:6px;padding:12px 6px;min-height:92px}
  .escala .opt .n{font-size:30px;font-weight:700;color:var(--roxo-escuro)} .escala .opt.sel .n{color:var(--sel-texto)}
  .escala .opt .face{font-size:30px;line-height:1}
  .opt.chip{width:auto;display:inline-flex;min-height:48px;font-size:16px;padding:8px 16px;border-color:transparent;background:var(--roxo-claro);color:var(--roxo-escuro)}
  .opt.destaque{min-height:76px;font-weight:700;border-color:var(--roxo)}
  .nps{display:grid;grid-template-columns:repeat(11,1fr);gap:8px;margin:8px 0 6px}
  .nps .opt{justify-content:center;min-height:64px;padding:8px 4px;font-size:22px;font-weight:700}
  .pontas{display:flex;justify-content:space-between;font-size:14px;color:var(--cinza);margin:2px 2px 10px}
  .na{margin-top:12px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:58px;padding:12px 22px;border:0;border-radius:14px;background:var(--roxo);color:#fff;font-size:20px;font-weight:700;cursor:pointer}
  .btn:disabled{opacity:.4;cursor:default}
  .btn.ghost{background:var(--roxo-claro);color:var(--roxo-escuro)} .btn.light{background:#fff;border:2px solid var(--roxo);color:var(--roxo-escuro)}
  .btn.perigo{background:var(--perigo)} .btn.block{width:100%} .btn.grande{min-height:110px;font-size:30px;border-radius:22px}
  .linha{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px} .espaco{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
  textarea,input,select{width:100%;font:inherit;font-size:19px;padding:12px 14px;border:2px solid var(--linha);border-radius:14px;background:#fff;color:var(--texto)}
  textarea{min-height:120px;resize:vertical}
  label{display:block;font-weight:600;margin:14px 0 6px}
  .check{display:flex;gap:12px;align-items:flex-start;font-weight:500;margin:12px 0 4px;font-size:16px} .check input{width:26px;height:26px;margin-top:2px;flex:none}
  .logo-hero{display:flex;justify-content:center;margin:2px 0 14px} .logo-hero img{height:64px;width:auto;max-width:80%}
  a.home{display:inline-flex;align-items:center;border-radius:8px} a.home:active{opacity:.7}
  .boasvindas{text-align:center;padding:26px 22px}
  .boasvindas h1{font-size:36px;margin:12px 0 10px}
  .boasvindas p{font-size:20px;color:var(--cinza)}
  .boasvindas p.quem-ajuda{font-size:16px;margin:0 0 14px}
  .quem-titulo{font-size:22px;margin:18px 0 6px;color:var(--roxo-escuro)}
  .quem-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:6px 0 0}
  .quem-grid.n1{grid-template-columns:minmax(0,340px);justify-content:center} .quem-grid.n2{grid-template-columns:repeat(2,minmax(0,340px));justify-content:center}
  .quem{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:8px;min-height:176px;padding:18px 12px 16px;border:2px solid var(--linha);border-radius:18px;background:#fff;cursor:pointer;font-family:inherit}
  .quem:active{background:var(--roxo-claro);border-color:var(--roxo)} .quem:focus-visible{outline:3px solid var(--acento);outline-offset:2px}
  .quem .avatar{width:72px;height:72px;border-radius:50%;background:var(--roxo);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:26px;letter-spacing:1px}
  .quem .avatar.duo{width:auto;height:72px;background:none;letter-spacing:0} .quem .avatar.duo span{width:62px;height:62px;border-radius:50%;background:var(--roxo);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:21px;border:3px solid #fff} .quem .avatar.duo span+span{margin-left:-16px;background:var(--acento)}
  .quem-nome{font-size:20px;font-weight:700;color:var(--roxo-escuro);line-height:1.2;text-wrap:balance;overflow-wrap:anywhere;max-width:100%} .quem-sub{font-size:14px;color:var(--cinza);line-height:1.25;overflow-wrap:anywhere;max-width:100%} .quem{min-width:0}
  .so-reuniao{margin-top:12px} .so-reuniao .btn{min-height:44px;font-size:15px;padding:8px 14px}
  .rodape-kiosk{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:center;padding:8px 18px;font-size:13px;color:var(--cinza);background:transparent}
  .rodape-kiosk button{background:none;border:0;color:var(--cinza);font-size:13px;text-decoration:underline;cursor:pointer;padding:10px}
  .obrigado{text-align:center;padding:30px 20px}
  .obrigado .ok{width:96px;height:96px;border-radius:50%;background:var(--ok);color:#fff;font-size:56px;display:flex;align-items:center;justify-content:center;margin:0 auto 20px}
  .kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:10px 0}
  .kpi div{background:var(--roxo-claro);border-radius:14px;padding:12px;text-align:center} .kpi b{display:block;font-size:30px;color:var(--roxo-escuro)} .kpi span{font-size:13px;color:var(--cinza)}
  table{width:100%;border-collapse:collapse;font-size:15px;margin:8px 0} th,td{padding:8px 8px;border-bottom:1px solid var(--linha);text-align:center;vertical-align:top} th{background:var(--roxo-claro);color:var(--roxo-escuro)} td.l,th.l{text-align:left}
  .tabela-wrap{overflow-x:auto}
  .tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:700} .tag.ok{background:#E6F4EA;color:#1B5E20} .tag.pend{background:#FFF4D6;color:#7A5A00}
  .aviso{background:#FFF4D6;border-left:5px solid #E0B400;padding:10px 14px;border-radius:8px;font-size:15px;margin:10px 0}
  .ruim{background:#FBE3E3;border-left:5px solid var(--perigo);padding:10px 14px;border-radius:8px;font-size:15px;margin:10px 0}
  .bom{background:#E6F4EA;border:1px solid #9CCFA9;border-radius:12px;padding:12px 14px;margin:10px 0 14px;font-size:16px;color:#1B3D26}
  .filtros{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:8px 0} .filtros label{margin:0 0 4px;font-size:13px;color:var(--cinza)} .filtros select,.filtros input{font-size:16px;padding:8px 10px}
  .pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:320px;margin:12px auto} .pinpad button{min-height:64px;font-size:26px;border-radius:14px;border:2px solid var(--linha);background:#fff}
  .pininput{display:block;max-width:320px;margin:8px auto 6px;text-align:center;font-size:30px;letter-spacing:12px;min-height:60px;-webkit-text-security:disc}
  details{margin:8px 0 14px} details summary{color:var(--roxo-escuro);cursor:pointer;font-weight:600}
  ul.lista{padding-left:20px;font-size:16px} ul.lista li{margin:6px 0}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#221C2E;color:#fff;padding:12px 18px;border-radius:12px;font-size:16px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center;z-index:9}
  .toast.show{opacity:1}
  @media (max-width:640px){ .quem-grid,.quem-grid.n2{grid-template-columns:repeat(2,minmax(0,1fr))} .quem-grid.n3 .quem:nth-child(3){grid-column:1 / -1} .quem{min-height:150px} .pergunta{font-size:22px} .escala .opt{min-height:80px;padding:10px 4px} .escala .opt .n{font-size:24px} .escala .opt .rot{font-size:12px} .nps{gap:5px} .nps .opt{min-height:52px;font-size:18px} .boasvindas h1{font-size:28px} .wrap{padding:12px 12px 80px} .card{padding:16px} }
  @media (max-height:600px) and (orientation:landscape){ .pergunta{font-size:21px;margin:2px 0 10px} .opt{min-height:52px;font-size:18px} .escala .opt{min-height:76px} .wrap{padding:8px 16px 70px} .boasvindas{padding:14px 18px} .boasvindas h1{font-size:26px;margin:6px 0 6px} .boasvindas p{font-size:17px} .logo-hero img{height:44px} .quem-titulo{font-size:19px;margin:8px 0 4px} .quem{min-height:120px;padding:10px 12px;gap:6px} .quem .avatar{width:52px;height:52px;font-size:20px} .quem .avatar.duo{height:52px} .quem .avatar.duo span{width:46px;height:46px;font-size:17px} .quem-nome{font-size:17px} }
</style>
</head>

   Mesma estrutura das outras pesquisas: respostas ficam no aparelho (ou vão para a nuvem), área do avaliador com PIN,

function perguntasConselheiros(lista){ return lista.flatMap(cs => CRITERIOS_CONSELHEIRO.map(cr => ({ codigo: cs.c + cr.n, tipo: 'escala', bloco: cs.c, fator: cr.fator, peso: cr.peso, obrigatoria: true, texto: cr.texto.replace('{nome}', cs.nome), na: cr.na }))); }
function montarPadrao(lista){ const i = QUESTOES_PADRAO.findIndex(q => q.codigo === 'nota'); return QUESTOES_PADRAO.slice(0, i).concat(perguntasConselheiros(lista), QUESTOES_PADRAO.slice(i)); }
const TODAS_PADRAO = montarPadrao(CONSELHEIROS_PADRAO);
const COLS_RESP = TODAS_PADRAO.flatMap(q => q.campos ? q.campos.map(c => c.c) : [q.codigo]);   // r1…r8, g1…g5, m1…m5, nota, mais, mudar

function perguntasCfg(){ const c = LS.get('mpco_perguntas', null); return (c && typeof c === 'object') ? c : {}; }
function aplicarPerguntas(){
  const cfg = perguntasCfg(); ESC = cfg.esc === 5 ? 5 : 3; const s = cfg.q || {}; const cc = cfg.conselheiros || {};
  CONSELHEIROS = CONSELHEIROS_PADRAO.map(p => ({ c: p.c, nome: (cc[p.c] && typeof cc[p.c].nome === 'string' && cc[p.c].nome.trim()) ? cc[p.c].nome.trim() : p.nome, titulo: (cc[p.c] && typeof cc[p.c].titulo === 'string' && cc[p.c].titulo.trim()) ? cc[p.c].titulo.trim() : p.titulo }));
  QUESTOES = montarPadrao(CONSELHEIROS).map(p => { const c = Object.assign({}, p); const x = s[p.codigo] || {};
    if (p.codigo === 'r8') c.ativa = cfg.r8 === true;
    if (typeof x.texto === 'string' && x.texto.trim()) c.texto = x.texto.trim();
    if (p.tipo === 'escala') { c.rotulos = (Array.isArray(x.rotulos) && x.rotulos.length === ESC && x.rotulos.every(t => String(t).trim())) ? x.rotulos.map(t => String(t).trim()) : ROTULOS[ESC].conc.slice(); if (typeof x.na === 'string') c.na = x.na.trim() || undefined; const pz = parseInt(x.peso, 10); if (pz >= 1 && pz <= 3) c.peso = pz; }
    if (p.opcoes) c.opcoes = p.opcoes.map(o => ({ c: o.c, t: (x.opcoes && typeof x.opcoes[o.c] === 'string' && x.opcoes[o.c].trim()) ? x.opcoes[o.c].trim() : o.t }));
    if (p.campos) c.campos = p.campos.map(o => ({ c: o.c, t: (x.campos && typeof x.campos[o.c] === 'string' && x.campos[o.c].trim()) ? x.campos[o.c].trim() : o.t }));
    return c; });
  FATORES = QUESTOES.filter(q => q.tipo === 'escala' && q.ativa !== false);
}
function perguntasAlteradas(){ const c = perguntasCfg(); return c.esc === 5 || c.r8 === true || !!(c.q && Object.keys(c.q).length) || !!(c.conselheiros && Object.keys(c.conselheiros).length); }
function blocoNome(b){ if (b === 'reuniao') return 'Reunião'; const cs = CONSELHEIROS.find(x => x.c === b); return cs ? cs.nome : b; }
function rotulo(codigo, v){ const q = QUESTOES.find(x => x.codigo === codigo); if (!q || !q.opcoes) return v; const o = q.opcoes.find(o => o.c === v); return o ? o.t : (v === 'NA' ? 'não informado' : v); }
function escDe(rec){ return (rec && (rec.esc === 3 || rec.esc === 5)) ? rec.esc : ESC; }
function positivo(v, e){ return num(v) && (e === 3 ? v === 3 : v >= 4); }

function horaHM(d){ d = d || new Date(); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }
function dataLabel(iso){ if (!iso || iso.length < 10) return iso || ''; return iso.slice(8, 10) + '/' + iso.slice(5, 7) + '/' + iso.slice(0, 4); }
function mesLabel(m){ if (!m) return ''; const n = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez']; return n[parseInt(m.slice(5, 7), 10) - 1] + '/' + m.slice(0, 4); }
function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function pinAtual(){ return settings.pin || PIN_PADRAO; }
function num(v){ return typeof v === 'number' && !isNaN(v); }
let toastT; function toast(m){ const t = document.getElementById('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 3200); }
function abandonos(){ return LS.get('mpco_abandonos', {}); }
function registrarAbandono(){ if (state.r && state.r.r1 !== undefined) { const a = abandonos(); a[settings.unidade] = (a[settings.unidade] || 0) + 1; LS.set('mpco_abandonos', a); } }

/* ---------------- estado e navegação ---------------- */
const state = { screen: settings.unidade ? 'welcome' : 'setup', i: 0, r: {}, pin: '', pinPara: 'admin', cf: null, confirma: null, avaliar: [] };   // avaliar = códigos dos conselheiros que ESTE respondente escolheu avaliar na tela inicial ([] = só a reunião)
let idleT = null, obrigadoT = null, autoT = null;
function resetIdle(){ clearTimeout(idleT); if (state.screen === 'q') idleT = setTimeout(() => { registrarAbandono(); state.r = {}; go('welcome'); toast('Avaliação reiniciada por inatividade.'); }, IDLE_MS); }
function go(screen, extra){ state.screen = screen; Object.assign(state, extra || {}); clearTimeout(obrigadoT); if (screen !== 'pin') state.pin = ''; state.confirma = null; render(); window.scrollTo(0, 0); resetIdle(); if (screen === 'thanks') obrigadoT = setTimeout(() => go('welcome'), OBRIGADO_MS); }
function presente(c){ const p = settings.presentes || {}; return p[c] !== false; }   // conselheiro ausente (marcado na preparação): o bloco dele é pulado e grava 'NA'
function avaliando(c){ return presente(c) && (state.avaliar || []).includes(c); }   // bloco perguntado a ESTE respondente: presente na reunião E escolhido na tela inicial
function presentesDe(r){ if (r && typeof r.presentes === 'string') return r.presentes.split(' ').filter(Boolean); return CONSELHEIROS.map(cs => cs.c); }   // sem a coluna (fonte externa): todos
function avaliadosDe(r){   // conselheiros avaliados num registro: coluna 'avaliados' (v1.1+); registros anteriores: todos os presentes; sem nenhuma das duas (CSV externo): quem tem alguma nota no bloco
  if (r && typeof r.avaliados === 'string') return r.avaliados.split(' ').filter(Boolean);
  if (r && typeof r.presentes === 'string') return r.presentes.split(' ').filter(Boolean);
  return CONSELHEIROS.filter(cs => CRITERIOS_CONSELHEIRO.some(cr => num(r && r.r && r.r[cs.c + cr.n]))).map(cs => cs.c);
}
function iniciais(nome){ const p = String(nome || '').trim().split(/\s+/).filter(Boolean); return ((p[0] || '?')[0] + (p.length > 1 ? p[p.length - 1][0] : '')).toUpperCase(); }
function visiveis(){   // reunião → blocos dos conselheiros ESCOLHIDOS (e presentes) em ordem sorteada por respondente → fechamento
  const ordem = state.ordem || CONSELHEIROS.map(cs => cs.c);
  const base = QUESTOES.filter(q => q.ativa !== false && (!q.bloco || q.bloco === 'reuniao' || avaliando(q.bloco)));
  const reuniao = base.filter(q => q.bloco === 'reuniao'); const fecho = base.filter(q => !q.bloco);
  return reuniao.concat(ordem.flatMap(c => base.filter(q => q.bloco === c)), fecho);
}
function perguntaAtual(){ return visiveis()[state.i] || null; }

  const v = state.r[q.codigo]; const n = vis.length; const pct = Math.round((state.i) / n * 100);

  if (q.bloco) { const grupo = vis.filter(x => x.bloco === q.bloco); const k = grupo.indexOf(q) + 1; const cs = CONSELHEIROS.find(x => x.c === q.bloco);

/* ---------------- cálculos ---------------- */
function agregar(list){
  const g = { n: list.length, fatores: [], blocos: {}, nBloco: {}, nota: null, notaN: 0, nota9: null, papeis: {}, mais: [], mudar: [], durMed: null, escs: {} };
  CONSELHEIROS.forEach(cs => { g.nBloco[cs.c] = list.filter(x => avaliadosDe(x).includes(cs.c)).length; });   // respostas em que o conselheiro foi escolhido para ser avaliado (registros anteriores à v1.1: presença)
  g.soReuniao = list.filter(x => !avaliadosDe(x).length).length;   // responderam só sobre a reunião
  g.ausente = {}; CONSELHEIROS.forEach(cs => { g.ausente[cs.c] = list.length > 0 && list.every(x => !presentesDe(x).includes(cs.c)); });   // faltou em todas as reuniões do conjunto
  list.forEach(x => { const e = escDe(x); g.escs[e] = (g.escs[e] || 0) + 1; }); const escUnica = Object.keys(g.escs).every(k => Number(k) === ESC); g.escMista = !escUnica;
  const media = vs => vs.length ? Math.round(vs.reduce((a, b) => a + b, 0) / vs.length * 10) / 10 : null;
  const notas = list.map(r => r.r.nota).filter(num); if (notas.length) { g.notaN = notas.length; g.nota = media(notas); g.nota9 = Math.round(notas.filter(v => v >= 9).length / notas.length * 100); }
  const pond = {};
  g.fatores = FATORES.map(q => { const base = (q.bloco && q.bloco !== 'reuniao') ? list.filter(x => avaliadosDe(x).includes(q.bloco)) : list;   // item de conselheiro: só quem foi perguntado (o 'NA' de bloco não escolhido não é "não sei")
    const xs = base.filter(x => num(x.r[q.codigo])); const na = base.filter(x => x.r[q.codigo] === 'NA').length; const pos = xs.filter(x => positivo(x.r[q.codigo], escDe(x))).length; const neg = xs.filter(x => negativo(x.r[q.codigo], escDe(x))).length;
    const dist = Array.from({ length: ESC }, (_, i) => xs.filter(x => escDe(x) === ESC && x.r[q.codigo] === i + 1).length);
    const p = pond[q.bloco] = pond[q.bloco] || { num: 0, den: 0 }; p.num += q.peso * pos; p.den += q.peso * xs.length;
    return { codigo: q.codigo, bloco: q.bloco, fator: q.fator, texto: q.texto, peso: q.peso, n: xs.length, na, dist, pct: xs.length ? Math.round(pos / xs.length * 100) : null, insat: xs.length ? Math.round(neg / xs.length * 100) : null, media: (xs.length && escUnica) ? media(xs.map(x => x.r[q.codigo])) : null }; });
  Object.keys(pond).forEach(b => { g.blocos[b] = pond[b].den ? Math.round(pond[b].num / pond[b].den * 100) : null; });   // índice ponderado (% positivo × peso) por bloco: reunião e cada conselheiro
  list.forEach(r => { ['mais', 'mudar'].forEach(k => { const t = r.r[k]; if (t && t !== 'NA' && String(t).trim()) g[k].push({ texto: String(t).trim(), unidade: r.unidade }); }); });
  g.identTotal = g.n > 0 && g.n < N_IDENTIFICAVEL;
  g.identBloco = {}; CONSELHEIROS.forEach(cs => { g.identBloco[cs.c] = g.nBloco[cs.c] > 0 && g.nBloco[cs.c] < N_IDENTIFICAVEL; });   // bloco com 1 ou 2 avaliações: quem avaliou reconhece a outra resposta
  g.blocosIdent = CONSELHEIROS.filter(cs => g.identBloco[cs.c]).map(cs => `${cs.nome} (${g.nBloco[cs.c]})`);
  g.identificavel = g.identTotal || g.blocosIdent.length > 0;
  return g;
}
function poolTodas(){ const loc = allResponses(); const ids = new Set(loc.map(r => r.id)); return loc.concat(histResponses().filter(r => !ids.has(r.id))); }
function cfDefault(){ return { unidade: '', mes: '' }; }
function filtrar(pool, cf){ return pool.filter(r => (!cf.unidade || r.unidade === cf.unidade) && (!cf.mes || (r.unidade || '').slice(0, 7) === cf.mes)); }
function calcConsolidado(cf){
  const pool = poolTodas(); const filt = filtrar(pool, cf); const geral = agregar(filt);
  const porR = {}; filt.forEach(r => { (porR[r.unidade] = porR[r.unidade] || []).push(r); });
  const reunioesT = Object.keys(porR).sort().reverse().map(u => Object.assign({ unidade: u, nome: reuniaoNome(u) }, agregar(porR[u])));
  const meses = [...new Set(pool.map(r => (r.unidade || '').slice(0, 7)).filter(Boolean))].sort().reverse();
  const unidadesOpt = [...new Set(pool.map(r => r.unidade))].sort().reverse();
  const filtroTxt = [cf.unidade ? 'reunião de ' + dataLabel(cf.unidade) : 'todas as reuniões', cf.mes ? mesLabel(cf.mes) : 'todos os meses'].join(' · ');
  return { cf, pool, filt, geral, reunioesT, meses, unidadesOpt, filtroTxt, importadas: histResponses().length };
}
function fmtPct(v){ return v == null ? '—' : v + '%'; }

/* ---------------- área do avaliador ---------------- */
function legendaEscala(g){ return `Positivo = ${ESC === 3 ? 'a melhor resposta ("Sim")' : 'as duas melhores respostas (4 e 5)'}; negativo = ${ESC === 3 ? 'a pior ("Não")' : 'as duas piores (1 e 2)'}. O índice de cada bloco é o % positivo ponderado pelo peso de cada item (1 a 3; Configurações → Editar perguntas).${g && g.escMista ? ` Há respostas gravadas com outra escala (${Object.keys(g.escs).join(' e ')} opções; a atual tem ${ESC}): os percentuais valem para todas; médias e distribuição só saem quando tudo está na escala atual.` : ''}`; }
function avisoN(g){ if (!g.n) return ''; let h = '';
  if (g.identTotal) h += `<div class="ruim"><b>${g.n} resposta${g.n === 1 ? '' : 's'}: o resultado identifica quem respondeu.</b> Uso restrito da governança — não mostre nem discuta individualmente.</div>`;
  else if (g.blocosIdent.length) h += `<div class="ruim"><b>Bloco com menos de ${N_IDENTIFICAVEL} avaliações: ${esc(g.blocosIdent.join(', '))}.</b> Quem avaliou reconhece a outra resposta — não mostre nem discuta esse bloco individualmente.</div>`;
  if (!g.identTotal && g.n < 5) h += `<div class="aviso">Poucas respostas (${g.n}): leia como indicação, não como medida.</div>`;
  return h; }
function kpis(g){

function lerPerguntas(){

    if (p.tipo === 'escala') { if (!mudouEsc) { const linhas = val('pr-' + p.codigo).split(/\r?\n/).map(s => s.trim()).filter(Boolean); if (linhas.length !== novoEsc) erros.push(`${p.codigo}: são necessários ${novoEsc} rótulos (há ${linhas.length})`); else if (linhas.join('|') !== ROTULOS[novoEsc].conc.join('|')) x.rotulos = linhas; }
      const na = val('pn-' + p.codigo); if (na !== (p.na || '')) x.na = na; const pz = parseInt(val('pp-' + p.codigo), 10); if (pz >= 1 && pz <= 3 && pz !== p.peso) x.peso = pz; }
    if (p.opcoes) { const op = {}; p.opcoes.forEach(o => { const v = val(`po-${p.codigo}-${o.c}`); if (!v) erros.push(`${p.codigo} / ${o.c}: a resposta não pode ficar vazia`); else if (v !== o.t) op[o.c] = v; }); if (Object.keys(op).length) x.opcoes = op; }
    if (p.campos) { const cp = {}; p.campos.forEach(o => { const v = val(`pf-${p.codigo}-${o.c}`); if (!v) erros.push(`${p.codigo} / ${o.c}: o texto não pode ficar vazio`); else if (v !== o.t) cp[o.c] = v; }); if (Object.keys(cp).length) x.campos = cp; }
    if (Object.keys(x).length) cfg.q[p.codigo] = x; });

  aplicarPerguntas(); toast(mudouEsc ? `Salvo: escala com ${novoEsc} respostas. Os rótulos voltaram ao padrão — revise se quiser.` : 'Perguntas, respostas e pesos salvos.'); go(mudouEsc ? 'perguntas' : 'config');
}
async function importarPerguntas(file){

async function sincronizar(silencioso, tudo){
  if (!syncOk()) { if (!silencioso) toast('Configure a URL e a chave do servidor em Configurações.'); return; }
  if (syncing) return; if (!navigator.onLine) { if (!silencioso) toast('Sem internet agora; tento de novo quando voltar.'); return; }

    const locais = new Set(allResponses().map(r => r.id)); const manuaisIds = new Set(manuais.map(h => h.id)); const porId = new Map(nuvem.map(h => [h.id, h]));

<script>
/* ---- atualizacao automatica ----------------------------------------------
   A cada minuto o app olha o relogio. Se ninguem tocar na tela por 10 minutos
   e existir uma versao nova publicada, ele recarrega sozinho. Nunca recarrega
   com alguem usando: qualquer toque, tecla ou rolagem zera a contagem.        */
(() => {
  if (!/^https?:/.test(location.protocol)) return;
  let ocioso = 10 * 60 * 1000, ultimo = Date.now(), base = null, ocupado = false;
  const toque = () => { ultimo = Date.now(); };
  ['pointerdown', 'keydown', 'touchstart', 'wheel', 'input'].forEach(e => addEventListener(e, toque, { passive: true }));
  document.addEventListener('visibilitychange', () => { if (!document.hidden) toque(); });
  async function impressao() {
    const r = await fetch(location.pathname, { cache: 'no-store' });
    if (!r.ok) throw new Error('http ' + r.status);
    const t = await r.text();
    let h = 5381;
    for (let i = 0; i < t.length; i++) h = ((h * 33) ^ t.charCodeAt(i)) >>> 0;
    return t.length + ':' + h;
  }
  async function verificar() {
    if (ocupado || document.hidden || !navigator.onLine) return 'pulou';
    ocupado = true;
    try {
      const agora = await impressao();
      if (base === null) { base = agora; return 'primeira leitura'; }
      if (agora === base) return 'sem novidade';
      if (Date.now() - ultimo < ocioso) return 'tem versao nova, mas alguem esta usando';
      location.reload();
      return 'recarregando';
    } catch (e) { return 'falhou: ' + (e && e.message); }
    finally { ocupado = false; }
  }
  impressao().then(x => { base = x; }).catch(() => {});
  setInterval(() => { if (Date.now() - ultimo >= ocioso) verificar(); }, 60 * 1000);
  window.__atualiza = { verificar, ociosoMs: ms => { ocioso = ms; }, parado: () => Date.now() - ultimo };
})();
</script>

(() => {

  let ultimo = '', pedido = 0, tempo = null;
  const cores = { ok: ['#1B7A52', '#E4F4EC'], ruim: ['#A8323F', '#FBE9EB'], neutro: ['#5E5670', '#EFEDF4'] };
  function pinta(tipo, texto) {
    const el = document.getElementById(ID); if (!el) return;
    const c = cores[tipo] || cores.neutro;
    el.style.cssText = 'margin:8px 0 2px;padding:9px 12px;border-radius:10px;font-size:14.5px;font-weight:600;color:' + c[0] + ';background:' + c[1];
    el.textContent = texto;
  }
  function valores() {
    const cx = document.getElementById('s-chave'), cu = document.getElementById('s-webhook');
    const u = (cu && cu.value.trim()) || (typeof settings !== 'undefined' ? (settings.webhook || '') : '');
    const k = (cx && cx.value.trim()) || '';
    return [u, k];
  }
  async function conferir() {
    const [u, k] = valores();
    const meu = ++pedido;
    if (!u) return pinta('neutro', 'Sem endere\u00e7o de servidor: as respostas ficam s\u00f3 neste aparelho.');
    if (!k) return pinta('neutro', 'Falta a chave: cole a chave de sincroniza\u00e7\u00e3o para ligar o servidor.');
    if (!navigator.onLine) return pinta('ruim', 'Sem internet agora — vou tentar de novo quando a rede voltar.');
    pinta('neutro', 'Falando com o servidor\u2026');
    try {
      const r = await fetch(u + (u.indexOf('?') >= 0 ? '&' : '?') + 'op=ping&chave=' + encodeURIComponent(k));
      const j = await r.json();
      if (meu !== pedido) return;
      if (j && j.ok) pinta('ok', '\u2713 Servidor ligado — as respostas deste aparelho v\u00e3o para a planilha.');
      else if (j && j.erro === 'chave') pinta('ruim', '\u2717 Chave diferente da do servidor: confira se copiou certo.');
      else if (j && j.erro === 'configurar-chave') pinta('ruim', '\u2717 O servidor ainda est\u00e1 com a chave de exemplo.');
      else pinta('ruim', '\u2717 O servidor respondeu algo inesperado.');
    } catch (e) { if (meu === pedido) pinta('ruim', '\u2717 N\u00e3o consegui falar com o servidor (internet ou endere\u00e7o errado).'); }
  }
  function agenda(ms) { clearTimeout(tempo); tempo = setTimeout(conferir, ms); }
  function montar() {
    const cx = document.getElementById('s-chave');
    if (!cx) { ultimo = ''; return; }
    if (!document.getElementById(ID)) {
      const el = document.createElement('div');
      el.id = ID;
      cx.insertAdjacentElement('afterend', el);
      ultimo = '';
    }
    const agora = valores().join('|');
    if (agora !== ultimo) { ultimo = agora; agenda(500); }
  }
  setInterval(montar, 700);
  document.addEventListener('input', e => { if (e.target && (e.target.id === 's-chave' || e.target.id === 's-webhook')) montar(); });
  window.addEventListener('online', () => { ultimo = ''; montar(); });
})();
</script>
